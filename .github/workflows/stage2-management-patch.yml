name: One-shot stage2 management patch
on:
  push:
    branches: [codex/reflection-ui-finalize]
    paths:
      - scripts/patch-stage2-management.py
      - .github/workflows/stage2-management-patch.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/reflection-ui-finalize
      - name: Apply management patch
        run: python3 scripts/patch-stage2-management.py
      - name: Commit patched management and remove one-shot files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/patch-stage2-management.py .github/workflows/stage2-management-patch.yml
          git add src/server/managementPage.ts
          git commit -m "ui: wire teacher class and code lifecycle management"
          git push origin HEAD:codex/reflection-ui-finalize
