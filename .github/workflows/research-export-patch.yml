name: One-shot research export minimization
on:
  push:
    branches: [codex/reflection-ui-finalize]
    paths:
      - scripts/patch-research-export.py
      - .github/workflows/research-export-patch.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/reflection-ui-finalize
      - name: Apply export patch
        run: python3 scripts/patch-research-export.py
      - name: Commit patch and remove one-shot files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/patch-research-export.py .github/workflows/research-export-patch.yml
          git add src/server/persistence.ts
          git commit -m "privacy: minimize researcher export to anonymous metrics"
          git push origin HEAD:codex/reflection-ui-finalize
