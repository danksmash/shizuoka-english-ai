name: Stage 3B implementation
on:
  push:
    branches:
      - codex/stage3b-student-reflection-history
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/stage3b-student-reflection-history
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply targeted changes
        run: |
          python scripts/stage3b_prepatch.py
          python scripts/stage3b_apply.py
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Full QA
        run: npm run qa && npx tsx scripts/qa-stage3b.ts
      - name: Production build
        run: npm run build
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts src/App.tsx src/components/SetupScreen.tsx src/components/FeedbackScreen.tsx src/components/ReflectionScreen.tsx src/components/LearningHistoryScreen.tsx scripts/qa-stage3b.ts
          git commit -m "feat: add student reflection and learning history flow"
          git push origin HEAD:codex/stage3b-student-reflection-history
