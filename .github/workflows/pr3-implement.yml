name: PR3 implement Azure primary

on:
  push:
    branches:
      - codex/pr3-azure-primary
    paths:
      - '.github/workflows/pr3-implement.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/pr3-azure-primary
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply minimal PR3 patch
        run: python3 scripts/apply-pr3.py
      - name: Protect SpeechRecognition and research-critical areas
        run: |
          git diff -- src/utils/speech.ts | grep -E '^[-+].*(SpeechRecognition|webkitSpeechRecognition|onend|recognitionRef|accumulateSpeechResults)' && exit 1 || true
          git diff --exit-code origin/main -- src/components src/data/curriculum.ts src/dataContract.ts src/server/persistence.ts src/server/auth.ts src/utils/security.ts
      - name: Full regression
        run: |
          npx tsx scripts/qa-azure-primary.ts
          npm run qa
          npm run build
      - name: Commit verified app implementation only
        run: |
          rm -f scripts/apply-pr3.py
          git config user.name danksmash
          git config user.email danksmash@gmail.com
          git add server.ts src/utils/speech.ts scripts/qa-azure-primary.ts scripts/apply-pr3.py
          git commit -m 'feat: switch TTS primary to Azure with Chirp fallback'
          git fetch origin codex/pr3-azure-primary
          git rebase origin/codex/pr3-azure-primary
          git push origin HEAD:codex/pr3-azure-primary
