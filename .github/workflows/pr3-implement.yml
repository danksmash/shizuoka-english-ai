name: PR3 implement Azure primary

on:
  push:
    branches:
      - codex/pr3-azure-primary
    paths:
      - '.github/workflows/pr3-implement.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/pr3-azure-primary
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply minimal PR3 patch
        run: python3 scripts/apply-pr3.py
      - name: Full regression
        run: |
          npx tsx scripts/qa-azure-primary.ts
          npm run qa
          npm run build
      - name: Commit verified app implementation only
        run: |
          git restore .github/workflows/cloud-run-deploy.yml
          rm -f scripts/apply-pr3.py
          git config user.name danksmash
          git config user.email danksmash@gmail.com
          git add server.ts scripts/qa-azure-primary.ts scripts/apply-pr3.py
          git commit -m 'feat: switch TTS primary to Azure with Chirp fallback'
          git push origin HEAD:codex/pr3-azure-primary
