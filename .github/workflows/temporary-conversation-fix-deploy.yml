name: Temporary conversation-fix verify and deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  verify-and-deploy:
    if: contains(github.event.head_commit.message, 'DEPLOY_CONVERSATION_FIX')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy shizuoka-english-ai \
            --source . \
            --region asia-northeast1 \
            --allow-unauthenticated \
            --set-env-vars ANTHROPIC_MODEL=claude-sonnet-4-6 \
            --update-secrets ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest
