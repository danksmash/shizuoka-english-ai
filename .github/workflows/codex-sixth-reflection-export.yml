name: Codex integrate sixth Reflection research CSV

on:
  push:
    branches:
      - codex/research-sixth-reflection-csv

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/research-sixth-reflection-csv
          fetch-depth: 0

      - name: Apply deterministic integration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          # server.ts: imports
          replace_once(
              'server.ts',
              "import { buildResearchDashboardData, buildResearchExportDataSets, filterResearchExportDataSets, normalizeFormalResearchExportQuery, serializeResearchCsv, type ResearchExportDatasetName } from './src/server/researchDashboard';\n",
              "import { buildResearchDashboardData, buildResearchExportDataSets, filterResearchExportDataSets, normalizeFormalResearchExportQuery, serializeResearchCsv, type ResearchExportDatasetName } from './src/server/researchDashboard';\nimport { getAllReflectionRecordsForTeacher } from './src/server/reflectionPersistence';\nimport { buildResearchLessonReflectionCodebookRows, buildResearchLessonReflectionRows, serializeResearchLessonReflectionCsv } from './src/server/researchLessonReflectionExport';\n",
          )

          # server.ts: dashboard row count for the sixth file, using formal export-safe filters.
          replace_once(
              'server.ts',
              "app.get('/api/management/research.dashboard',requireManagementRole(['researcher']),async(req,res)=>{\n  try{\n    const dashboard=buildResearchDashboardData(await getAllSessionsForManagement(),req.query);\n    res.setHeader('Cache-Control','no-store');return res.json(dashboard);\n  }catch(error:any){console.error('Research dashboard failed',{message:error?.message});return res.status(503).json({success:false,error:'RESEARCH_DASHBOARD_UNAVAILABLE'});}\n});",
              "app.get('/api/management/research.dashboard',requireManagementRole(['researcher']),async(req,res)=>{\n  try{\n    const [sessions,lessonReflections]=await Promise.all([getAllSessionsForManagement(),getAllReflectionRecordsForTeacher()]);\n    const dashboard=buildResearchDashboardData(sessions,req.query);\n    const lessonReflectionRowCount=buildResearchLessonReflectionRows(lessonReflections,normalizeFormalResearchExportQuery(req.query)).length;\n    res.setHeader('Cache-Control','no-store');return res.json({...dashboard,lessonReflectionRowCount});\n  }catch(error:any){console.error('Research dashboard failed',{message:error?.message});return res.status(503).json({success:false,error:'RESEARCH_DASHBOARD_UNAVAILABLE'});}\n});",
          )

          # server.ts: formal six-file bundle plus codebook augmentation.
          replace_once(
              'server.ts',
              "app.get('/api/management/research.bundle.zip',requireManagementRole(['researcher']),async(req,res)=>{\n  try{\n    const exportQuery=normalizeFormalResearchExportQuery(req.query);\n    const datasets=filterResearchExportDataSets(buildResearchExportDataSets(await getAllSessionsForManagement()),exportQuery);\n    const exportedAt=new Date().toISOString();\n    const names=['sessions','utterances','expressions','personas','codebook'] as const;\n    const manifest={export_id:`export_${Date.now()}`,exported_at:exportedAt,schema_version:4,filters:exportQuery,row_counts:Object.fromEntries(names.map((name)=>[name,datasets[name].length]))};\n    const files=names.map((name)=>({name:`${name}.csv`,content:serializeResearchCsv(datasets[name],name)}));\n    const zip=buildStoredZip([...files,{name:'manifest.json',content:JSON.stringify(manifest,null,2)}]);\n    res.setHeader('Content-Type','application/zip');res.setHeader('Content-Disposition',`attachment; filename=\"research-bundle-${exportedAt.slice(0,10).replace(/-/g,'')}.zip\"`);res.setHeader('Cache-Control','no-store');return res.send(zip);\n  }catch(error:any){console.error('Research bundle export failed',{message:error?.message});return res.status(503).json({success:false,error:'RESEARCH_BUNDLE_UNAVAILABLE'});}\n});",
              "app.get('/api/management/research.bundle.zip',requireManagementRole(['researcher']),async(req,res)=>{\n  try{\n    const exportQuery=normalizeFormalResearchExportQuery(req.query);\n    const [sourceSessions,lessonReflections]=await Promise.all([getAllSessionsForManagement(),getAllReflectionRecordsForTeacher()]);\n    const datasets=filterResearchExportDataSets(buildResearchExportDataSets(sourceSessions),exportQuery);\n    const lessonReflectionRows=buildResearchLessonReflectionRows(lessonReflections,exportQuery);\n    const codebookRows=[...datasets.codebook,...buildResearchLessonReflectionCodebookRows()];\n    const exportedAt=new Date().toISOString();\n    const rowCounts={sessions:datasets.sessions.length,utterances:datasets.utterances.length,expressions:datasets.expressions.length,personas:datasets.personas.length,lesson_reflections:lessonReflectionRows.length,codebook:codebookRows.length};\n    const manifest={export_id:`export_${Date.now()}`,exported_at:exportedAt,schema_version:5,filters:exportQuery,row_counts:rowCounts,lesson_reflection_join_key:['research_id','local_date'],lesson_reflection_filter_scope:['start','end','dataScope','grade','classId']};\n    const files=[\n      {name:'sessions.csv',content:serializeResearchCsv(datasets.sessions,'sessions')},\n      {name:'utterances.csv',content:serializeResearchCsv(datasets.utterances,'utterances')},\n      {name:'expressions.csv',content:serializeResearchCsv(datasets.expressions,'expressions')},\n      {name:'personas.csv',content:serializeResearchCsv(datasets.personas,'personas')},\n      {name:'lesson_reflections.csv',content:serializeResearchLessonReflectionCsv(lessonReflectionRows)},\n      {name:'codebook.csv',content:serializeResearchCsv(codebookRows,'codebook')},\n    ];\n    const zip=buildStoredZip([...files,{name:'manifest.json',content:JSON.stringify(manifest,null,2)}]);\n    res.setHeader('Content-Type','application/zip');res.setHeader('Content-Disposition',`attachment; filename=\"research-bundle-${exportedAt.slice(0,10).replace(/-/g,'')}.zip\"`);res.setHeader('Cache-Control','no-store');return res.send(zip);\n  }catch(error:any){console.error('Research bundle export failed',{message:error?.message});return res.status(503).json({success:false,error:'RESEARCH_BUNDLE_UNAVAILABLE'});}\n});",
          )

          # server.ts: individual formal dataset download for lesson_reflections.csv.
          replace_once(
              'server.ts',
              "    const requested=typeof req.query?.dataset==='string'?req.query.dataset:'sessions';\n    const allowed=['sessions','utterances','expressions','personas','codebook'] as const;",
              "    const requested=typeof req.query?.dataset==='string'?req.query.dataset:'sessions';\n    if(requested==='lesson_reflections'){\n      const rows=buildResearchLessonReflectionRows(await getAllReflectionRecordsForTeacher(),normalizeFormalResearchExportQuery(req.query));\n      const csv=serializeResearchLessonReflectionCsv(rows);\n      res.setHeader('Content-Type','text/csv; charset=utf-8');res.setHeader('Content-Disposition','attachment; filename=\"lesson_reflections.csv\"');res.setHeader('Cache-Control','no-store');return res.send(csv);\n    }\n    const allowed=['sessions','utterances','expressions','personas','codebook'] as const;",
          )

          # Research dashboard: six-file copy, join-key documentation, and sixth dynamic card.
          replace_once('src/server/managementPage.ts', '.exports{display:grid;grid-template-columns:repeat(5,1fr);', '.exports{display:grid;grid-template-columns:repeat(3,1fr);')
          replace_once('src/server/managementPage.ts', '>5 CSVを一括ZIP</button>', '>6 CSVを一括ZIP</button>')
          replace_once(
              'src/server/managementPage.ts',
              '正式Exportは安全のため「本研究」が標準です。Pilot Bはデータ区分で「Pilot B」を明示選択してからExportしてください。「すべて」表示中にExportした場合も本研究のみを出力します。',
              '正式Exportは安全のため「本研究」が標準です。Pilot Bはデータ区分で「Pilot B」を明示選択してからExportしてください。「すべて」表示中にExportした場合も本研究のみを出力します。lesson_reflections.csv は授業日単位のため、開始日・終了日・データ区分・学年・学級を反映し、Persona・ラベル・テーマ・completeのみは適用しません。',
          )
          replace_once(
              'src/server/managementPage.ts',
              'sessions.csv ↔ personas.csv は persona_id で結合できます。codebook.csv は全列の定義・型・値域・分析用途を収録します。',
              'sessions.csv ↔ personas.csv は persona_id で結合できます。sessions.csv ↔ lesson_reflections.csv は research_id + local_date で授業日単位に結合できます。codebook.csv は6 CSVの全列の定義・型・値域・分析用途を収録します。',
          )
          replace_once(
              'src/server/managementPage.ts',
              "$('exportCards').innerHTML=(d.exportFiles||[]).map(function(r){return '<div class=\"card export-card\"><h3>'+esc(r.fileName)+'</h3><p><b>格納データ</b><br>'+esc(r.contains)+'</p><p><b>主な分析</b><br>'+esc(r.analysisUse)+'</p><p class=\"muted\">現在の対象行数: '+esc(r.rowCount)+'</p><button class=\"secondary download\" data-export-dataset=\"'+esc(r.dataset)+'\">CSVをDL</button></div>'}).join('');bindDynamicExportButtons()",
              "const exportFiles=[...(d.exportFiles||[]),{dataset:'lesson_reflections',fileName:'lesson_reflections.csv',contains:'授業全体のめあて・4件法自己評価・自由記述振り返り',analysisUse:'AI対話データとの授業日単位結合・授業全体の振り返り分析',rowCount:d.lessonReflectionRowCount??0}];$('exportCards').innerHTML=exportFiles.map(function(r){return '<div class=\"card export-card\"><h3>'+esc(r.fileName)+'</h3><p><b>格納データ</b><br>'+esc(r.contains)+'</p><p><b>主な分析</b><br>'+esc(r.analysisUse)+'</p><p class=\"muted\">現在の対象行数: '+esc(r.rowCount)+'</p><button class=\"secondary download\" data-export-dataset=\"'+esc(r.dataset)+'\">CSVをDL</button></div>'}).join('');bindDynamicExportButtons()",
          )
          replace_once('src/server/managementPage.ts', "'5 CSV一括ZIPを安全なデータ区分でダウンロードします'", "'6 CSV一括ZIPを安全なデータ区分でダウンロードします'")

          # Keep the older compatibility endpoint but route its CSV generation through the same formal serializer/classification logic.
          replace_once(
              'src/server/reflectionTeacherModel.ts',
              "import type { ReflectionRecord } from './reflectionPersistence';\n",
              "import type { ReflectionRecord } from './reflectionPersistence';\nimport { buildResearchLessonReflectionRows, serializeResearchLessonReflectionCsv as serializeFormalResearchLessonReflectionCsv } from './researchLessonReflectionExport';\n",
          )
          old_function = '''export function serializeResearchLessonReflectionCsv(
  records: ReflectionRecord[],
  requestedDate?: unknown,
): string {
  const dateText = typeof requestedDate === 'string' && /^\\d{4}-\\d{2}-\\d{2}$/.test(requestedDate) ? requestedDate : '';
  const rows = records
    .filter((record) => !dateText || record.localDate === dateText)
    .sort((a, b) => a.localDate.localeCompare(b.localDate) || a.classId.localeCompare(b.classId, 'ja') || a.researchId.localeCompare(b.researchId));
  const lines = [RESEARCH_LESSON_REFLECTION_HEADERS.map(csvCell).join(',')];
  for (const record of rows) {
    lines.push([
      record.researchId,
      record.classId,
      reflectionDataScopeForClassId(record.classId),
      reflectionGradeForClassId(record.classId),
      reflectionClassNumberForClassId(record.classId),
      record.localDate,
      record.status,
      record.todayGoal,
      record.goalRating ?? '',
      record.communicationRating ?? '',
      REFLECTION_RATING_SCALE_MIN,
      REFLECTION_RATING_SCALE_MAX,
      REFLECTION_RATING_ITEM_1,
      REFLECTION_RATING_ITEM_2,
      record.reflectionText,
      record.reflectionCharCount,
      record.revision,
      record.createdAt,
      record.updatedAt,
      record.submittedAt,
    ].map(csvCell).join(','));
  }
  return `\\uFEFF${lines.join('\\r\\n')}\\r\\n`;
}'''
          new_function = '''export function serializeResearchLessonReflectionCsv(
  records: ReflectionRecord[],
  requestedDate?: unknown,
): string {
  const dateText = typeof requestedDate === 'string' && /^\\d{4}-\\d{2}-\\d{2}$/.test(requestedDate) ? requestedDate : '';
  const rows = buildResearchLessonReflectionRows(records, dateText ? { start: dateText, end: dateText, dataScope: 'all' } : { dataScope: 'all' });
  return serializeFormalResearchLessonReflectionCsv(rows);
}'''
          replace_once('src/server/reflectionTeacherModel.ts', old_function, new_function)

          # This workflow is intentionally one-shot; remove it from the resulting branch.
          Path('.github/workflows/codex-sixth-reflection-export.yml').unlink()
          PY

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Full QA
        run: npm run qa

      - name: Production build
        run: npm run build

      - name: Commit integrated files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: integrate lesson Reflection as sixth research CSV"
          git push origin HEAD:codex/research-sixth-reflection-csv
