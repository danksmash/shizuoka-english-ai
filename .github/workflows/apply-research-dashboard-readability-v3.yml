name: Apply researcher dashboard readability fixes v3

on:
  push:
    branches:
      - codex/research-dashboard-readability-filters

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Reuse validated implementation patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          wf=Path('.github/workflows/apply-research-dashboard-readability-v2.yml').read_text()
          marker="          python3 - <<'PY'\n"
          start=wf.index(marker)+len(marker)
          end=wf.index("\n          PY",start)
          lines=wf[start:end].splitlines()
          code='\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
          exec(compile(code,'research-dashboard-patch.py','exec'),{})
          qa=Path('scripts/qa-dashboard-data-sync.ts')
          text=qa.read_text()
          text=text.replace("for(const label of Object.values(topicLabels))assert.ok(pageSource.includes(label),'theme missing '+label);","for(const label of ['自己紹介・あいさつ','好きなもの・すきなこと','静岡のじまん＆世界の文化','できること・得意なこと','自由トーク・おしゃべり'])assert.ok(pageSource.includes(label),'theme missing '+label);")
          qa.write_text(text)
          PY
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Full QA
        run: npm run qa
      - name: Production build
        run: npm run build
      - name: Verify protected student UI unchanged
        shell: bash
        run: |
          test -z "$(git diff --name-only origin/main -- src/App.tsx src/components src/utils/speech.ts src/data/curriculum.ts src/assets/images)"
      - name: Commit validated implementation
        shell: bash
        run: |
          git config user.name "danksmash"
          git config user.email "danksmash@gmail.com"
          git add src/server/researchDashboard.ts src/server/managementPage.ts scripts/qa-dashboard-data-sync.ts scripts/qa-research-export-complete.ts
          if git diff --cached --quiet; then echo 'already applied'; exit 0; fi
          git commit -m "fix: improve researcher dashboard readability and filters"
          git push origin HEAD:codex/research-dashboard-readability-filters
