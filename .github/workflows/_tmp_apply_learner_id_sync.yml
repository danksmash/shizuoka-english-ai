name: Temporary learner ID sync implementation
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]
permissions:
  contents: write
jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/learner-id-unification
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Correct patch targeting
        run: python3 scripts/_tmp_fix_identity_patch.py
      - name: Apply implementation patch
        run: python3 scripts/_tmp_apply_learner_id_sync.py
      - name: Apply focused teacher identity UI fixes
        run: python3 scripts/_tmp_post_apply_identity_fix.py
      - name: Update legacy QA expectations
        run: python3 scripts/_tmp_update_learner_id_qa.py
      - name: Full QA
        run: npm run qa
      - name: Production build
        run: npm run build
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src server.ts scripts package.json
          git commit -m "fix: unify learner IDs across learner and teacher views"
          git push origin HEAD:codex/learner-id-unification
