name: Temporary learner ID sync implementation
on:
  push:
    branches: [codex/learner-id-unification]
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/learner-id-unification
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Apply implementation patch
        run: python3 scripts/_tmp_apply_learner_id_sync.py
      - name: Full QA
        run: npm run qa
      - name: Production build
        run: npm run build
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src server.ts scripts package.json
          git commit -m "fix: unify learner IDs across learner and teacher views"
          git push origin HEAD:codex/learner-id-unification
