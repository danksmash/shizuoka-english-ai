name: Apply Minji/Zofia age-fit Azure voices

on:
  push:
    branches:
      - feat/minji-zofia-age-fit-voices
    paths:
      - '.github/workflows/apply-minji-zofia-age-fit-voices.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/minji-zofia-age-fit-voices
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply reviewed voice selections
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          p = Path('src/data/azureVoiceProfiles.ts')
          s = p.read_text()
          replacements = {
            "export const AZURE_VOICE_PROFILE_VERSION = 'azure-voice-profile-v2' as const;": "export const AZURE_VOICE_PROFILE_VERSION = 'azure-voice-profile-v3' as const;",
            "  sentenceBoundaryMs?: number;\n": "  sentenceBoundaryMs?: number;\n  ageFitReview?: 'round1-A' | 'round3-B';\n",
            " * Human-reviewed Azure Voice Profile v2 for the 20 research personas.": " * Human-reviewed Azure Voice Profile v3 for the 20 research personas.",
            " * v2 preserves Azure default speaking rate for all personas. Liam uses a": " * v3 preserves Azure default speaking rate for all personas. Minji and Zofia use\n * age-fit replacements selected by human listening review; Liam uses a",
            "  minji_korea: { personaId: 'minji_korea', voiceName: 'en-US-EmmaMultilingualNeural', voiceLocale: 'en-US', synthesisLocale: 'en-US', gender: 'female', gate4Choice: 'A', selectionClass: 'exact-english-locale' },": "  minji_korea: { personaId: 'minji_korea', voiceName: 'en-US-AshleyNeural', voiceLocale: 'en-US', synthesisLocale: 'en-US', gender: 'female', gate4Choice: 'A', selectionClass: 'exact-english-locale', ageFitReview: 'round3-B' },",
            "  zofia_poland: { personaId: 'zofia_poland', voiceName: 'en-GB-AdaMultilingualNeural', voiceLocale: 'en-GB', synthesisLocale: 'en-GB', gender: 'female', gate4Choice: 'A', selectionClass: 'exact-english-locale' },": "  zofia_poland: { personaId: 'zofia_poland', voiceName: 'en-GB-LibbyNeural', voiceLocale: 'en-GB', synthesisLocale: 'en-GB', gender: 'female', gate4Choice: 'A', selectionClass: 'exact-english-locale', ageFitReview: 'round1-A' },",
          }
          for old,new in replacements.items():
              assert old in s, f'missing azure profile target: {old}'
              s=s.replace(old,new,1)
          p.write_text(s)

          p = Path('scripts/qa-azure-voice-profile.ts')
          s = p.read_text()
          assert "'azure-voice-profile-v2'" in s
          s = s.replace("'azure-voice-profile-v2'", "'azure-voice-profile-v3'", 1)
          s = s.replace("{ voice: string; choice: 'A' | 'B' | 'refined'; pause?: number }", "{ voice: string; choice: 'A' | 'B' | 'refined'; pause?: number; ageFitReview?: 'round1-A' | 'round3-B' }")
          assert "minji_korea: { voice: 'en-US-EmmaMultilingualNeural', choice: 'A' }," in s
          s = s.replace("minji_korea: { voice: 'en-US-EmmaMultilingualNeural', choice: 'A' },", "minji_korea: { voice: 'en-US-AshleyNeural', choice: 'A', ageFitReview: 'round3-B' },")
          assert "zofia_poland: { voice: 'en-GB-AdaMultilingualNeural', choice: 'A' }," in s
          s = s.replace("zofia_poland: { voice: 'en-GB-AdaMultilingualNeural', choice: 'A' },", "zofia_poland: { voice: 'en-GB-LibbyNeural', choice: 'A', ageFitReview: 'round1-A' },")
          needle = "  if (profile.sentenceBoundaryMs !== e.pause) fail(`Sentence pause mismatch for ${profile.personaId}`);\n"
          assert needle in s
          s = s.replace(needle, needle + "  if (profile.ageFitReview !== e.ageFitReview) fail(`Age-fit review mismatch for ${profile.personaId}`);\n")
          p.write_text(s)

          p = Path('src/server/azureTts.ts')
          s = p.read_text().replace('Voice Profile v2', 'Voice Profile v3')
          p.write_text(s)

          p = Path('.github/workflows/cloud-run-deploy.yml')
          s = p.read_text().replace('Voice Profile v2 uses the human-approved Gate 4 Azure default speed.', 'Voice Profile v3 uses the human-approved Azure default speed.')
          p.write_text(s)

          record = {
            "voice_profile_version": "azure-voice-profile-v3",
            "baseline_main_sha": "c7da42e17e0d7f90e14b2bd51d7f904c28edb75d",
            "effective_rate": 1.0,
            "changed_personas": [
              {
                "persona_id": "minji_korea",
                "age": 21,
                "previous_voice": "en-US-EmmaMultilingualNeural",
                "selected_voice": "en-US-AshleyNeural",
                "human_review": "round3-B",
                "preview_artifact_id": 9885844330
              },
              {
                "persona_id": "zofia_poland",
                "age": 20,
                "previous_voice": "en-GB-AdaMultilingualNeural",
                "selected_voice": "en-GB-LibbyNeural",
                "human_review": "round1-A",
                "preview_artifact_id": 9884709355
              }
            ],
            "unchanged_persona_count": 18,
            "research_note": "Human listening review changed only Minji and Zofia for better age fit. Azure default speaking rate remains 1.00. The v2 Golden Reference remains an immutable historical baseline."
          }
          Path('docs/azure-voice-profile-v3-selection.json').write_text(json.dumps(record, ensure_ascii=False, indent=2) + '\n')
          PY
      - name: Full QA and production build
        run: |
          npm run qa
          npm run build
      - name: Commit verified source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/azureVoiceProfiles.ts scripts/qa-azure-voice-profile.ts src/server/azureTts.ts .github/workflows/cloud-run-deploy.yml docs/azure-voice-profile-v3-selection.json
          git diff --cached --check
          git commit -m 'feat: update Minji and Zofia age-fit Azure voices'
          git push origin HEAD:feat/minji-zofia-age-fit-voices
