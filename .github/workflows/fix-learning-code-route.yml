name: One-shot learning-code route fix
on:
  push:
    branches: [codex/learning-code-route-fix]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch raw four-character validation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('server.ts')
          s=p.read_text()
          old1="""  if(!persistenceConfigured())return res.status(503).json({success:false,error:'PERSISTENCE_NOT_CONFIGURED'}); const learningCode=normalizeLearningCode(req.body?.learningCode);\n  if(!isValidLearningCode(learningCode))return res.status(400).json({success:false,error:'INVALID_LEARNING_CODE'});"""
          new1="""  if(!persistenceConfigured())return res.status(503).json({success:false,error:'PERSISTENCE_NOT_CONFIGURED'});\n  if(!isValidLearningCode(req.body?.learningCode))return res.status(400).json({success:false,error:'INVALID_LEARNING_CODE'});\n  const learningCode=normalizeLearningCode(req.body.learningCode);"""
          old2="""  const ip=req.ip||req.socket.remoteAddress||'unknown';if(!checkSensitiveLimit(`history:${ip}`,30,10*60_000))return res.status(429).json({success:false,error:'RATE_LIMITED'});const learningCode=normalizeLearningCode(req.body?.learningCode);\n  if(!isValidLearningCode(learningCode))return res.status(400).json({success:false,error:'INVALID_LEARNING_CODE'});"""
          new2="""  const ip=req.ip||req.socket.remoteAddress||'unknown';if(!checkSensitiveLimit(`history:${ip}`,30,10*60_000))return res.status(429).json({success:false,error:'RATE_LIMITED'});\n  if(!isValidLearningCode(req.body?.learningCode))return res.status(400).json({success:false,error:'INVALID_LEARNING_CODE'});\n  const learningCode=normalizeLearningCode(req.body.learningCode);"""
          if old1 not in s or old2 not in s:
              raise SystemExit('expected route text not found')
          s=s.replace(old1,new1).replace(old2,new2)
          p.write_text(s)
          PY
      - name: Commit fix and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-learning-code-route.yml
          git add server.ts
          git commit -m 'fix: enforce raw four-character learner codes'
          git push
