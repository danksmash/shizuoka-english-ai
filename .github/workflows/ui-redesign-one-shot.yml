# corrected contract validation run
name: UI redesign one-shot
on:
  push:
    branches:
      - codex/full-ui-redesign
    paths:
      - .github/workflows/ui-redesign-one-shot.yml
permissions:
  contents: write
jobs:
  validate-and-finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/full-ui-redesign
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Patch learner flow and QA contract
        run: |
          python3 scripts/ui-redesign-finalize.py
          rm scripts/ui-redesign-finalize.py
          rm .github/workflows/ui-redesign-one-shot.yml
      - run: npm run qa
      - run: npm run build
      - name: Commit validated redesign
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "ui: complete functional learner teacher researcher redesign"
          git push origin HEAD:codex/full-ui-redesign
