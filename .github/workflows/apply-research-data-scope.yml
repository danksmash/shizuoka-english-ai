name: Apply research data scope migration

on:
  push:
    branches:
      - feat/research-data-scope

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[scope-migration-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Apply migration
        run: python3 scripts/apply-research-data-scope.py
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Targeted QA
        run: |
          npm run qa:pilot-b
          npm run qa:management
          npm run qa:dashboard
          npm run qa:research-export
          npm run lint
          npm run build
      - name: Commit generated changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/server/researchDashboard.ts src/server/managementPage.ts server.ts scripts/qa-pilot-b-isolation.ts
          git commit -m 'feat: separate research data scopes [scope-migration-applied]'
          git push origin HEAD:feat/research-data-scope
