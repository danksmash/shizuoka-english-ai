name: One-time dialogue fallback removal

on:
  push:
    paths:
      - '.github/workflows/one-time-dialogue-fallback-removal.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove local conversation fallback from App.tsx
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/App.tsx')
          s = p.read_text(encoding='utf-8')

          old_import = """import {\n  generateFallbackFeedback,\n  generateLocalStudentDialogueReply,\n} from './utils/feedbackFallback';"""
          new_import = """import {\n  generateFallbackFeedback,\n} from './utils/feedbackFallback';"""
          if old_import not in s:
              raise SystemExit('App.tsx: expected fallback import not found')
          s = s.replace(old_import, new_import, 1)

          old_catch = """    } catch (e) {\n      console.warn('AI backend unavailable, generating local safe response:', e);\n      const studentObj = currentAiStudentRef.current;\n      const currentProf = profileRef.current;\n      const localReply = generateLocalStudentDialogueReply(\n        studentObj,\n        currentProf.selectedTopic,\n        trimmed,\n        turnCountRef.current,\n        currentProf.name,\n        messagesRef.current\n      );\n\n      extractAndAddVocab(localReply.reply);\n\n      const fallbackAiMsg: ChatMessage = {\n        id: `ai-local-${Date.now()}`,\n        sender: 'ai',\n        englishText: localReply.reply,\n        japaneseText: localReply.japaneseTranslation,\n        timestamp: Date.now(),\n        culturalNote: localReply.culturalNote,\n      };\n      const fallbackHistory = [...messagesRef.current, fallbackAiMsg];\n      setMessages(fallbackHistory);\n      messagesRef.current = fallbackHistory;\n\n      setMood((localReply.mood as CharacterMood) || 'speaking');\n      if (localReply.culturalNote) {\n        setLatestCulturalNote(localReply.culturalNote);\n      }\n      playAiVoice(localReply.reply);\n    } finally {"""
          new_catch = """    } catch (e) {\n      console.error('AI backend unavailable; no conversation fallback will be generated:', e);\n      setMood('listening');\n      setMicHintMessage('AI留学生に接続できませんでした。もう一度送ってみてね。');\n      setTimeout(() => setMicHintMessage(''), 5000);\n    } finally {"""
          if old_catch not in s:
              raise SystemExit('App.tsx: expected local fallback catch block not found')
          s = s.replace(old_catch, new_catch, 1)
          p.write_text(s, encoding='utf-8')

      - name: Remove server-side local conversation fallback
        shell: python
        run: |
          from pathlib import Path
          p = Path('server.ts')
          s = p.read_text(encoding='utf-8')

          old_import = "import { generateLocalStudentDialogueReply, generateFallbackFeedback } from './src/utils/feedbackFallback';"
          new_import = "import { generateFallbackFeedback } from './src/utils/feedbackFallback';"
          if old_import not in s:
              raise SystemExit('server.ts: expected local fallback import not found')
          s = s.replace(old_import, new_import, 1)

          old_no_client = """    // High-quality local context-aware fallback when API client is not configured\n    route = 'fallback';\n    fallbackReason = 'API_KEY_NOT_CONFIGURED';\n    const localReply = generateLocalStudentDialogueReply(\n      persona,\n      topic || 'favorites',\n      safeUserMessage,\n      rawHistory.length + 1,\n      effectiveName,\n      rawHistory\n    );\n    const sanitizedLocalReply = sanitizeAiOutput(localReply.reply, persona.name);\n    const responseEnd = Date.now();\n\n    return res.json({\n      success: true,\n      isFallback: true,\n      fallbackReason,\n      data: {\n        reply: sanitizedLocalReply,\n        japaneseTranslation: localReply.japaneseTranslation,\n        mood: localReply.mood,\n        culturalNote: localReply.culturalNote || '',\n        detectedName: spokenName || undefined,\n      },\n      _diagnostics: {\n        requestId: `req-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,\n        requestStart,\n        responseEnd,\n        latencyMs: responseEnd - requestStart,\n        pathType: 'SERVER_FALLBACK',\n        route,\n        fallbackReason,\n      },\n    });"""
          new_no_client = """    return res.status(503).json({\n      success: false,\n      error: 'AI service is not configured. No conversation fallback is available.',\n      _diagnostics: {\n        requestId: `req-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,\n        requestStart,\n        responseEnd: Date.now(),\n        pathType: 'AI_UNAVAILABLE',\n      },\n    });"""
          if old_no_client not in s:
              raise SystemExit('server.ts: expected no-client fallback block not found')
          s = s.replace(old_no_client, new_no_client, 1)

          old_catch = """  } catch (error: any) {\n    route = 'fallback';\n    if (error?.status === 429) {\n      fallbackReason = 'RATE_LIMIT';\n    } else if (error?.name === 'AbortError' || error?.message?.includes('aborted') || error?.message?.includes('timeout')) {\n      fallbackReason = 'API_TIMEOUT';\n    } else if (error?.message?.includes('API_INVALID_RESPONSE')) {\n      fallbackReason = 'API_INVALID_RESPONSE';\n    } else if (error?.status >= 500) {\n      fallbackReason = 'API_5XX';\n    } else {\n      fallbackReason = 'API_ERROR';\n    }\n\n    // High-quality local context-aware fallback for API error resilience\n    const localReply = generateLocalStudentDialogueReply(\n      persona,\n      topic || 'favorites',\n      safeUserMessage,\n      rawHistory.length + 1,\n      effectiveName,\n      rawHistory\n    );\n    const sanitizedLocalReply = sanitizeAiOutput(localReply.reply, persona.name);\n    const responseEnd = Date.now();\n\n    return res.json({\n      success: true,\n      isFallback: true,\n      fallbackReason,\n      data: {\n        reply: sanitizedLocalReply,\n        japaneseTranslation: localReply.japaneseTranslation,\n        mood: localReply.mood,\n        culturalNote: localReply.culturalNote || '',\n        detectedName: spokenName || undefined,\n      },\n      _diagnostics: {\n        requestId: `req-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,\n        requestStart,\n        apiRequestStart,\n        apiResponseReceived,\n        responseEnd,\n        latencyMs: responseEnd - requestStart,\n        pathType: 'SERVER_FALLBACK',\n        route,\n        fallbackReason,\n      },\n    });\n  }"""
          new_catch = """  } catch (error: any) {\n    const responseEnd = Date.now();\n    const fallbackReason =\n      error?.status === 429\n        ? 'RATE_LIMIT'\n        : error?.name === 'AbortError' || error?.message?.includes('aborted') || error?.message?.includes('timeout')\n          ? 'API_TIMEOUT'\n          : error?.message?.includes('API_INVALID_RESPONSE')\n            ? 'API_INVALID_RESPONSE'\n            : error?.status >= 500\n              ? 'API_5XX'\n              : 'API_ERROR';\n\n    const statusCode = fallbackReason === 'RATE_LIMIT' ? 429 : fallbackReason === 'API_TIMEOUT' ? 504 : 502;\n    return res.status(statusCode).json({\n      success: false,\n      error: 'AI service is temporarily unavailable. No conversation fallback is available.',\n      _diagnostics: {\n        requestId: `req-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,\n        requestStart,\n        apiRequestStart,\n        apiResponseReceived,\n        responseEnd,\n        latencyMs: responseEnd - requestStart,\n        pathType: 'AI_ERROR',\n        fallbackReason,\n      },\n    });\n  }"""
          if old_catch not in s:
              raise SystemExit('server.ts: expected server fallback catch block not found')
          s = s.replace(old_catch, new_catch, 1)

          p.write_text(s, encoding='utf-8')

      - name: Commit patch and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/one-time-dialogue-fallback-removal.yml
          git add src/App.tsx server.ts .github/workflows/one-time-dialogue-fallback-removal.yml
          git diff --cached --check
          git commit -m "fix: remove conversation generation fallback"
          git push
