name: One-time sealed comparison ID export

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-comparison-id-export.yml'

permissions:
  contents: read
  id-token: write

jobs:
  export:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/1075707511474/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-actions-deploy@shizuoka-english-ai.iam.gserviceaccount.com
          project_id: shizuoka-english-ai

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: shizuoka-english-ai
          version: '>= 416.0.0'

      - name: Read, audit and seal comparison IDs
        shell: bash
        run: |
          set -euo pipefail
          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          export ACCESS_TOKEN
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request

          token=os.environ['ACCESS_TOKEN']
          base='https://firestore.googleapis.com/v1/projects/shizuoka-english-ai/databases/(default)/documents/students'
          docs=[]
          page=''
          while True:
              url=base+'?pageSize=1000'+(('&pageToken='+urllib.parse.quote(page)) if page else '')
              req=urllib.request.Request(url,headers={'Authorization':'Bearer '+token})
              with urllib.request.urlopen(req,timeout=30) as r:
                  data=json.load(r)
              docs.extend(data.get('documents',[]))
              page=data.get('nextPageToken','')
              if not page: break

          def val(v):
              if not isinstance(v,dict): return None
              if 'stringValue' in v: return v['stringValue']
              if 'booleanValue' in v: return bool(v['booleanValue'])
              if 'integerValue' in v: return int(v['integerValue'])
              if 'doubleValue' in v: return float(v['doubleValue'])
              if 'nullValue' in v: return None
              if 'timestampValue' in v: return v['timestampValue']
              if 'arrayValue' in v: return [val(x) for x in v.get('arrayValue',{}).get('values',[])]
              if 'mapValue' in v: return {k:val(x) for k,x in v.get('mapValue',{}).get('fields',{}).items()}
              return None

          rows=[]
          for d in docs:
              f={k:val(v) for k,v in d.get('fields',{}).items()}
              if f.get('classId') not in ('6-C1','6-C1-R'):
                  continue
              rows.append({
                  'attendanceNumber':int(f.get('attendanceNumber') or 0),
                  'learningCode':str(f.get('learningId') or ''),
                  'researchId':str(f.get('researchId') or ''),
                  'classId':str(f.get('classId') or ''),
                  'active':f.get('active') is not False,
                  'formalStudyParticipant':f.get('formalStudyParticipant') is True,
                  'studySiteId':str(f.get('studySiteId') or ''),
                  'schoolCondition':str(f.get('schoolCondition') or ''),
                  'studyGradeLevel':f.get('studyGradeLevel') or '',
                  'studyStartDate':str(f.get('studyStartDate') or ''),
              })
          rows.sort(key=lambda x:(x['classId'].endswith('-R'),x['attendanceNumber'],x['learningCode']))
          pupils=[r for r in rows if r['classId']=='6-C1']
          reserve=[r for r in rows if r['classId']=='6-C1-R']
          assert len(pupils)==28, f'pupil count {len(pupils)}'
          assert [r['attendanceNumber'] for r in pupils]==list(range(1,29)), 'attendance mismatch'
          assert all(r['active'] for r in pupils), 'inactive pupil ID'
          assert len(reserve)==1 and reserve[0]['attendanceNumber']==29, 'reserve mismatch'
          assert reserve[0]['active'] is False, 'reserve must be inactive'
          assert all(not r['formalStudyParticipant'] for r in rows), 'formal study must still be unset'
          assert all(not r['studyStartDate'] for r in rows), 'study start date must still be unset'
          codes=[r['learningCode'] for r in rows]
          rids=[r['researchId'] for r in rows]
          assert all(codes) and len(set(codes))==29, 'learning code empty/duplicate'
          assert all(rids) and len(set(rids))==29, 'research_id empty/duplicate'
          payload={'audit':{'pupils':28,'reserve':1,'learningCodeDuplicates':0,'researchIdDuplicates':0,'formalStudyParticipants':0},'rows':rows}
          with open('/tmp/comparison-ids.json','w',encoding='utf-8') as f:
              json.dump(payload,f,ensure_ascii=False,separators=(',',':'))
          print('AUDIT_PASS pupils=28 reserve=1 codes_unique=29 research_ids_unique=29 formal=0')
          PY

          cat >/tmp/recipient.pem <<'PEM'
          -----BEGIN CERTIFICATE-----
          MIIELTCCApWgAwIBAgIUQ0ZddpvlC/defHCnFtgLXPULoHswDQYJKoZIhvcNAQEL
          BQAwJjEkMCIGA1UEAwwbdGVtcG9yYXJ5LWNvbXBhcmlzb24tZXhwb3J0MB4XDTI2
          MDkyOTEwNTExM1oXDTI2MDkzMDEwNTExM1owJjEkMCIGA1UEAwwbdGVtcG9yYXJ5
          LWNvbXBhcmlzb24tZXhwb3J0MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKC
          AYEAuvbQ+TLyXa0UQylrquEesGuWcKJ0BKBNCe1k34nBXBNINyfVv0BvMdKQbfmy
          e0C9bnjX3iWrbP1VZmC+ywbZAiph7xdd7pgWQjku5ch5qZFcCYpmhX3U3iCI6JG5
          WgrH34RZlIfKEzzJQ5fjysCc3XL8wJWYeVbw9QnbeFk7YsTyBx7x+a6wtTzL5j8X
          Si0zMr8+7lD1IrnV9vQbo+epWjifrhtIn/twRcPQLd/8VeHOD0YCWS6AlfVoMjCM
          67PtosGX+HDbJ6w4xzfUWq+r3heFVhUBv3+QLz6qCL7VVGVx0vBfLOVN1o9E201K
          KwPY10pU6sgmqMXkRHXbJ+FV0uzCnwDMKiG9fDk2V6MU3q7gsiUjuBZ6W21+CCh+
          2WWcDM6aKnXUBSpuDryU1eugOgJKjqR2UZBdxv/+/dVk1tn4Tr7d3piS4TLNV1SE
          FA4aahi7vc0N0iAajPK/B9+UO1FpLYIpYvo4AiaCZSwDUOE/aTDUA9rUEaQOA1tp
          uNyRAgMBAAGjUzBRMB0GA1UdDgQWBBQfgpCB0vyIXqWPPa5tnuXQhno2nTAfBgNV
          HSMEGDAWgBQfgpCB0vyIXqWPPa5tnuXQhno2nTAPBgNVHRMBAf8EBTADAQH/MA0G
          CSqGSIb3DQEBCwUAA4IBgQBi1JeZ20eGqlnVUWKSSJsTIaENR74J11X9RbrDRWvs
          ALRvbqzQmYRa27r/RPpob8FdBq8Aew8iJ0y9ognHRfM2VA72dOgkHPjzHyZv+iB0
          cc1AmUIeL6OFlA5WzE+AT1wu4YCYHOhDnU4EmJDtOHzhiY5BsU3FNS0d6tTzTPjl
          2ZG+N0rhSBiPZZ2CCd6eURf2EsbO60V+ZDZTZ7xMnAgfTl2u+akrGJ0nxKGn4ina
          qlxpXngaG0j7BlGmzF2VCD2n34Ictj2LH3+tB3zviHyjENRbn7lZl4bMX+igzob0
          qxPaHXHFfupt0bo2fewxWSrT2I5aDTbzUqUvTGwBPrrWDvKePauqTT9mYKNEr7+I
          5X+fXONWP1cBG9k5T1zgCRAYG5EZov2u1V2yKUZ6zuGHSsYB6QzLLuGE30UmBiP+
          PX5vrI2KBziRcQO/+M7LOPGmlaWPtZ/GVL2CytKXmNon0MAUJWT+QlyTqNmeHvZl
          UZLyDHNNc8cMyuiHXP4Nasc=
          -----END CERTIFICATE-----
          PEM
          openssl cms -encrypt -binary -aes-256-cbc -in /tmp/comparison-ids.json -out comparison-ids-sealed.cms -outform DER /tmp/recipient.pem
          rm -f /tmp/comparison-ids.json /tmp/recipient.pem

      - name: Upload sealed export
        uses: actions/upload-artifact@v4
        with:
          name: comparison-ids-sealed
          path: comparison-ids-sealed.cms
          retention-days: 1
          if-no-files-found: error
