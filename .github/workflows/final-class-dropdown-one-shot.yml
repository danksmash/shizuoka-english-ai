name: Final class dropdown one-shot
on:
  push:
    branches:
      - codex/final-class-dropdown-fix
    paths:
      - .github/workflows/final-class-dropdown-one-shot.yml
permissions:
  contents: write
jobs:
  validate-and-finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/final-class-dropdown-fix
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply final audit fix
        run: |
          python3 scripts/final-class-dropdown-fix.py
          rm scripts/final-class-dropdown-fix.py
          rm .github/workflows/final-class-dropdown-one-shot.yml
      - name: Full QA
        run: npm run qa
      - name: Production build
        run: npm run build
      - name: Commit validated fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: finalize exact class dropdown and chart point label"
          git push origin HEAD:codex/final-class-dropdown-fix
