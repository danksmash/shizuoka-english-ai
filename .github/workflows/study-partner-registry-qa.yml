name: Study Partner Registry QA

on:
  pull_request:
    paths:
      - 'src/server/studyPartnerVideoRoutes.ts'
      - 'src/server/auth.ts'
      - 'server-entry.ts'
      - 'public/study-partner-videos.html'
      - 'public/study-schedule.html'
      - 'scripts/qa-study-partner-videos.ts'
      - 'package.json'
      - '.github/workflows/study-partner-registry-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run qa:study-schedule
      - run: npm run lint
      - run: npm run build
