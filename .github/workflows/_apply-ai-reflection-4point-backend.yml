name: Apply AI reflection 4-point backend patch

on:
  push:
    branches:
      - fix/ai-reflection-4point-dashboard-20260911
    paths:
      - scripts/_apply_ai_reflection_4point_backend_patch.py
      - scripts/_fix_ai_reflection_patch_mapping.py
      - .github/workflows/_apply-ai-reflection-4point-backend.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: fix/ai-reflection-4point-dashboard-20260911
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Correct patch helper mapping
        run: python3 scripts/_fix_ai_reflection_patch_mapping.py
      - name: Apply backend and dashboard patch
        run: python3 scripts/_apply_ai_reflection_4point_backend_patch.py
      - name: Run focused QA
        run: |
          npm run qa:data
          npm run qa:research
          npm run qa:dashboard
          npm run qa:research-export
          npm run lint
          npm run build
      - name: Remove one-off patch helpers
        run: |
          rm scripts/_apply_ai_reflection_4point_backend_patch.py
          rm scripts/_fix_ai_reflection_patch_mapping.py
          rm .github/workflows/_apply-ai-reflection-4point-backend.yml
      - name: Commit verified patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: support 4-point AI reflection dashboard'
          git push origin HEAD:fix/ai-reflection-4point-dashboard-20260911
