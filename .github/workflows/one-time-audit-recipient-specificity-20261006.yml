name: One-time audit recipient specificity 2026-10-06

on:
  push:
    branches:
      - audit/recipient-specificity-postmerge-20261006
    paths:
      - '.github/workflows/one-time-audit-recipient-specificity-20261006.yml'

permissions:
  contents: read
  id-token: write

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify deployed build and public UI
        shell: bash
        run: |
          set -euo pipefail
          API_URL="https://shizuoka-english-ai-1075707511474.asia-northeast1.run.app"
          health="$(curl --fail --silent --show-error --max-time 20 "$API_URL/api/health")"
          echo "$health" | grep -q '"status":"ok"'
          echo "$health" | grep -q '"build":"f4cee78c1b4a"'
          page="$(curl --fail --silent --show-error --max-time 20 "$API_URL/study-schedule.html")"
          echo "$page" | grep -q 'Phase 2　来校予定留学生の国籍'
          echo "$page" | grep -q 'Phase 3　担当留学生設定'
          echo "$page" | grep -q '担当相手告知日'
          rq1="$(curl --fail --silent --show-error --max-time 20 "$API_URL/research-rq1.html")"
          echo "$rq1" | grep -q 'Phase 1→2：20 Personaから来校国籍群へ'
          echo "$rq1" | grep -q 'Phase 2→3：来校国籍群から担当国へ'

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/1075707511474/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-actions-deploy@shizuoka-english-ai.iam.gserviceaccount.com
          project_id: shizuoka-english-ai

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: shizuoka-english-ai
          version: '>= 416.0.0'

      - name: Read-only Firestore audit
        shell: bash
        run: |
          set -euo pipefail
          export ACCESS_TOKEN="$(gcloud auth print-access-token)"
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request, collections, hashlib, re

          token=os.environ['ACCESS_TOKEN']
          base='https://firestore.googleapis.com/v1/projects/shizuoka-english-ai/databases/(default)/documents'

          def decode(v):
              if not isinstance(v,dict): return None
              if 'stringValue' in v: return v['stringValue']
              if 'booleanValue' in v: return bool(v['booleanValue'])
              if 'integerValue' in v: return int(v['integerValue'])
              if 'doubleValue' in v: return float(v['doubleValue'])
              if 'timestampValue' in v: return v['timestampValue']
              if 'nullValue' in v: return None
              if 'arrayValue' in v: return [decode(x) for x in v['arrayValue'].get('values',[])]
              if 'mapValue' in v: return {k:decode(x) for k,x in v['mapValue'].get('fields',{}).items()}
              return None

          def get(url):
              req=urllib.request.Request(url,headers={'Authorization':'Bearer '+token})
              with urllib.request.urlopen(req,timeout=30) as r:
                  return json.load(r)

          def list_collection(name):
              out=[]
              page=''
              while True:
                  url=f'{base}/{name}?pageSize=1000'
                  if page:
                      url += '&pageToken='+urllib.parse.quote(page,safe='')
                  data=get(url)
                  for doc in data.get('documents',[]):
                      fields={k:decode(v) for k,v in doc.get('fields',{}).items()}
                      fields['_name']=doc.get('name','')
                      fields['_createTime']=doc.get('createTime','')
                      fields['_updateTime']=doc.get('updateTime','')
                      out.append(fields)
                  page=data.get('nextPageToken','')
                  if not page: break
              return out

          sched_doc=get(base+'/study_schedules/5-3')
          sched={k:decode(v) for k,v in sched_doc.get('fields',{}).items()}
          schedule_summary={
              'classId':sched.get('classId'),
              'revision':sched.get('revision'),
              'appStartDate':sched.get('appStartDate'),
              'nationalityRevealDate':sched.get('nationalityRevealDate'),
              'announcedVisitorCountries':sched.get('announcedVisitorCountries'),
              'announcedVisitorCountryCounts':sched.get('announcedVisitorCountryCounts'),
              'videoViewDate':sched.get('videoViewDate'),
              'assignmentRevealDate':sched.get('assignmentRevealDate'),
              'exchangeDate':sched.get('exchangeDate'),
              'updatedBy':sched.get('updatedBy'),
              'updateTime':sched_doc.get('updateTime',''),
          }
          print('SCHEDULE',json.dumps(schedule_summary,ensure_ascii=False,sort_keys=True))

          expected_countries=['Germany','Hungary','Lithuania','Poland']
          expected_counts={'Germany':2,'Hungary':2,'Lithuania':1,'Poland':1}
          assert sched.get('nationalityRevealDate')=='2026-10-06'
          assert sched.get('announcedVisitorCountries')==expected_countries
          assert sched.get('announcedVisitorCountryCounts')==expected_counts
          assert not str(sched.get('assignmentRevealDate') or '')
          assert int(sched.get('revision') or 0) >= 3

          students=list_collection('students')
          class_students=[s for s in students if str(s.get('classId') or '')=='5-3' and s.get('active') is not False]
          source=open('src/server/study1FormalParticipantHashes.ts','r',encoding='utf-8').read()
          allow=set(re.findall(r"'([0-9a-f]{64})'",source))
          def legacy_formal(s):
              sid=str(s.get('studentId') or '').strip()
              att=s.get('attendanceNumber')
              try: att=int(att)
              except: return False
              if not sid or att<1 or att>25: return False
              h=hashlib.sha256(('study1-formal-v1|'+sid).encode()).hexdigest()
              return h in allow
          formal_students=[s for s in class_students if (s.get('formalStudyParticipant') is True) or legacy_formal(s)]
          reserve_students=[s for s in class_students if s not in formal_students]
          student_audit={
              'active_5_3_students':len(class_students),
              'formal_study_participants_current_logic':len(formal_students),
              'nonformal_or_reserve_active_current_logic':len(reserve_students),
              'with_assigned_partner_country':sum(bool(str(s.get('assignedPartnerCountry') or '').strip()) for s in class_students),
              'with_assigned_partner_id':sum(bool(str(s.get('assignedPartnerId') or '').strip()) for s in class_students),
              'with_assignment_announced_at':sum(bool(str(s.get('assignmentAnnouncedAt') or '').strip()) for s in class_students),
          }
          print('STUDENTS',json.dumps(student_audit,ensure_ascii=False,sort_keys=True))

          sessions=list_collection('sessions')
          target=[s for s in sessions if str(s.get('classId') or '')=='5-3' and str(s.get('localDate') or '')=='2026-10-06']
          by_country=collections.Counter(str(s.get('personaCountry') or '').strip() for s in target if str(s.get('personaCountry') or '').strip())
          def child_turns(s):
              hist=s.get('history') or []
              return sum(1 for m in hist if isinstance(m,dict) and str(m.get('sender') or '')=='child' and str(m.get('englishText') or '').strip())
          formal_research_ids=set(str(s.get('researchId') or '') for s in formal_students if str(s.get('researchId') or ''))
          formal_student_ids=set(str(s.get('studentId') or '') for s in formal_students if str(s.get('studentId') or ''))
          formal_target=[s for s in target if (str(s.get('researchId') or '') in formal_research_ids) or (str(s.get('studentId') or '') in formal_student_ids)]
          child_valid=[s for s in formal_target if child_turns(s)>=1]
          valid_by_country=collections.Counter(str(s.get('personaCountry') or '').strip() for s in child_valid if str(s.get('personaCountry') or '').strip())
          session_audit={
              'sessions_5_3_2026_10_06':len(target),
              'formal_sessions':len(formal_target),
              'formal_unique_research_ids':len(set(str(s.get('researchId') or '') for s in formal_target if str(s.get('researchId') or ''))),
              'formal_with_child_utterance':len(child_valid),
              'formal_child_valid_visitor_sessions':sum(valid_by_country[c] for c in expected_countries),
              'formal_child_valid_visitor_country_counts':{c:valid_by_country[c] for c in expected_countries},
              'with_assigned_partner_country':sum(bool(str(s.get('assignedPartnerCountry') or '').strip()) for s in target),
              'with_assigned_partner_id':sum(bool(str(s.get('assignedPartnerId') or '').strip()) for s in target),
              'with_assignment_announced_at':sum(bool(str(s.get('assignmentAnnouncedAt') or '').strip()) for s in target),
              'selected_visitor_country_sessions':sum(by_country[c] for c in expected_countries),
              'visitor_country_counts':{c:by_country[c] for c in expected_countries},
              'distinct_persona_countries':len(by_country),
          }
          print('SESSIONS',json.dumps(session_audit,ensure_ascii=False,sort_keys=True))

          assert session_audit['with_assigned_partner_country']==0
          assert session_audit['with_assigned_partner_id']==0
          assert session_audit['with_assignment_announced_at']==0
          assert student_audit['with_assignment_announced_at']==0
          assert student_audit['formal_study_participants_current_logic'] > 0

          # Verify no current schedule history entry incorrectly binds assignment reveal to nationality reveal.
          history=sched.get('history') or []
          if history:
              latest=history[-1]
              print('LATEST_HISTORY',json.dumps({
                  'revision':latest.get('revision'),
                  'nationalityRevealDate':latest.get('nationalityRevealDate'),
                  'announcedVisitorCountries':latest.get('announcedVisitorCountries'),
                  'assignmentRevealDate':latest.get('assignmentRevealDate'),
                  'updatedBy':latest.get('updatedBy'),
              },ensure_ascii=False,sort_keys=True))
              assert not str(latest.get('assignmentRevealDate') or '')

          print('AUDIT_RESULT PASS')
          PY
