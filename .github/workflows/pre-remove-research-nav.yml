name: Stage researcher navigation removal
on:
  push:
    branches:
      - codex/research-dashboard-readability-filters
permissions:
  contents: write
jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove obsolete researcher navigation buttons
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/server/managementPage.ts');s=p.read_text()
          nav='<div class="nav"><button class="secondary" data-nav="overview">研究データ概要</button><button class="secondary" data-nav="quality">データ品質</button><button class="secondary" data-nav="exports">CSVダウンロード</button><button class="secondary" data-nav="dictionary">データ辞書</button></div>'
          js="document.querySelectorAll('[data-nav]').forEach(function(b){b.onclick=function(){const e=$(b.dataset.nav);if(e&&e.scrollIntoView)e.scrollIntoView({behavior:'smooth',block:'start'})}});"
          s=s.replace(nav,'',1).replace(js,'',1)
          p.write_text(s)
          PY
          if git diff --quiet; then exit 0; fi
          git config user.name "danksmash"
          git config user.email "danksmash@gmail.com"
          git add src/server/managementPage.ts
          git commit -m "fix: remove researcher section navigation"
          git push origin HEAD:codex/research-dashboard-readability-filters
