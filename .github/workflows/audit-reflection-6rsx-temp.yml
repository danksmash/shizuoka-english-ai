name: Repair and verify Reflection 6RSX

on:
  push:
    branches:
      - fix/reflection-6rsx-login-20260910
    paths:
      - '.github/workflows/audit-reflection-6rsx-temp.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  repair_verify:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/1075707511474/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-actions-deploy@shizuoka-english-ai.iam.gserviceaccount.com
          project_id: shizuoka-english-ai
      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: shizuoka-english-ai
          version: '>= 416.0.0'
      - name: Repair only 6RSX class and verify live register/bootstrap
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(gcloud auth print-access-token)"
          ACCESS_TOKEN="$TOKEN" python3 - <<'PY'
          import datetime, json, os, urllib.request, urllib.parse, urllib.error

          project='shizuoka-english-ai'
          api='https://shizuoka-english-ai-1075707511474.asia-northeast1.run.app'
          token=os.environ['ACCESS_TOKEN']
          base=f'https://firestore.googleapis.com/v1/projects/{project}/databases/(default)/documents'

          def auth_fetch(url, method='GET', body=None):
              data=None if body is None else json.dumps(body).encode()
              req=urllib.request.Request(url,data=data,method=method,headers={'Authorization':f'Bearer {token}','Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=30) as r:
                  raw=r.read()
                  return json.loads(raw) if raw else {}

          def public_post(path, payload):
              req=urllib.request.Request(api+path,data=json.dumps(payload).encode(),method='POST',headers={'Content-Type':'application/json'})
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      return r.status, json.loads(r.read())
              except urllib.error.HTTPError as e:
                  raw=e.read()
                  try: data=json.loads(raw)
                  except: data={'raw':raw.decode(errors='replace')[:300]}
                  return e.code, data

          def val(v):
              if not isinstance(v,dict): return None
              for k in ('stringValue','booleanValue','integerValue','doubleValue','timestampValue'):
                  if k in v:
                      x=v[k]
                      if k=='integerValue':
                          try:return int(x)
                          except:return x
                      return x
              if 'nullValue' in v:return None
              return None

          def list_collection(name):
              docs=[]; page=''
              while True:
                  url=f'{base}/{name}?pageSize=1000'
                  if page:url += '&pageToken='+urllib.parse.quote(page)
                  data=auth_fetch(url)
                  docs += data.get('documents',[])
                  page=data.get('nextPageToken','')
                  if not page: break
              return docs

          students=[]
          for d in list_collection('students'):
              row={k:val(v) for k,v in d.get('fields',{}).items()}
              row['_name']=d.get('name','')
              students.append(row)
          exact=[r for r in students if str(r.get('learningId','')).upper()=='6RSX']
          assert len(exact)==1, f'expected exactly one 6RSX record, got {len(exact)}'
          row=exact[0]
          assert row.get('active') is not False, '6RSX is inactive'
          assert row.get('studentId') and row.get('researchId'), '6RSX core identity incomplete'
          current_class=str(row.get('classId') or '')
          assert current_class in ('','テスト'), f'unexpected existing classId={current_class!r}'

          if current_class=='':
              now=datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z')
              url='https://firestore.googleapis.com/v1/'+row['_name']+'?updateMask.fieldPaths=classId&updateMask.fieldPaths=updatedAt'
              auth_fetch(url,'PATCH',{'fields':{'classId':{'stringValue':'テスト'},'updatedAt':{'stringValue':now}}})
              print('6RSX_CLASS_REPAIRED_TO_TEST')
          else:
              print('6RSX_CLASS_ALREADY_TEST')

          # Snapshot valid 6RSX test-device docs before live smoke, so only the QA-created token can be removed.
          before=set()
          for d in list_collection('reflection_devices'):
              f={k:val(v) for k,v in d.get('fields',{}).items()}
              if str(f.get('learningId','')).upper()=='6RSX' and f.get('classId')=='テスト':
                  before.add(d.get('name',''))

          status, reg=public_post('/api/reflection/register',{'learningCode':'6RSX'})
          assert status==200 and reg.get('success') is True and reg.get('deviceToken'), f'register failed: {status} {reg}'
          device=reg['deviceToken']
          status, boot=public_post('/api/reflection/bootstrap',{'deviceToken':device})
          assert status==200 and boot.get('success') is True and boot.get('learningId')=='6RSX', f'bootstrap failed: {status} {boot}'
          print('6RSX_LIVE_REGISTER_BOOTSTRAP_PASS')

          # Remove only device docs created by this smoke run; do not touch user devices.
          after=[]
          for d in list_collection('reflection_devices'):
              f={k:val(v) for k,v in d.get('fields',{}).items()}
              if str(f.get('learningId','')).upper()=='6RSX' and f.get('classId')=='テスト' and d.get('name','') not in before:
                  after.append(d.get('name',''))
          assert len(after)==1, f'expected one QA device doc, got {len(after)}'
          for name in after:
              url='https://firestore.googleapis.com/v1/'+name
              req=urllib.request.Request(url,method='DELETE',headers={'Authorization':f'Bearer {token}'})
              with urllib.request.urlopen(req,timeout=30) as r:
                  assert r.status in (200,204)
          print('6RSX_QA_DEVICE_CLEANED')
          PY
