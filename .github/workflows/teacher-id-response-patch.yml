name: One-shot teacher id response patch
on:
  push:
    branches: [codex/reflection-ui-finalize]
    paths:
      - scripts/patch-teacher-id-response.py
      - .github/workflows/teacher-id-response-patch.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/reflection-ui-finalize
      - name: Apply response patch
        run: python3 scripts/patch-teacher-id-response.py
      - name: Commit patch and remove one-shot files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/patch-teacher-id-response.py .github/workflows/teacher-id-response-patch.yml
          git add server.ts src/server/managementPage.ts
          git commit -m "fix: return stable teacher student id after code issue"
          git push origin HEAD:codex/reflection-ui-finalize
