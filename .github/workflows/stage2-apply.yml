name: Stage 2 integration runner

on:
  push:
    branches:
      - codex/stage2-data-contract

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/stage2-data-contract
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply stage 2 integration
        run: |
          cat > /tmp/apply_stage2.py <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected 1 match, got {count}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1))

          replace_once('server.ts', "import { getAIStudentById } from './src/data/curriculum';\n", "import { getAIStudentById } from './src/data/curriculum';\nimport { detectVocabularyInText } from './src/data/vocabulary';\nimport { calculateCanonicalStats, canonicalizeHistory, isAIStudentId, isDialogueDuration, isDialogueTopic } from './src/dataContract';\n")
          replace_once('server.ts', "  const { message, history, topic, aiStudentId } = req.body;\n  const persona = getAIStudentById(aiStudentId);\n  const trimmedMessage = typeof message === 'string' ? message.trim() : '';\n", "  const { message, history, topic, aiStudentId } = req.body;\n  if (!isAIStudentId(aiStudentId)) return res.status(400).json({ success: false, error: 'INVALID_AI_STUDENT_ID' });\n  if (!isDialogueTopic(topic)) return res.status(400).json({ success: false, error: 'INVALID_TOPIC' });\n  const persona = getAIStudentById(aiStudentId);\n  const trimmedMessage = typeof message === 'string' ? message.trim() : '';\n")
          replace_once('server.ts', "  const recentHistory = rawHistory.slice(-8);\n", "  const recentHistory = rawHistory.slice(-16);\n")

          p = Path('server.ts')
          text = p.read_text()
          start_marker = "  const { history, durationMinutes, turns, totalWords, aiStudentId, encounteredVocab } = req.body;\n"
          end_marker = "  const prompt = `小学5・6年生の英会話練習を日本語で短く講評してください。"
          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise SystemExit(f'feedback boundary mismatch: start={text.count(start_marker)} end={text.count(end_marker)}')
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          new_block = (
              "  const { history, durationMinutes, aiStudentId } = req.body;\n"
              "  if (!isAIStudentId(aiStudentId)) return res.status(400).json({ success: false, error: 'INVALID_AI_STUDENT_ID' });\n"
              "  const targetDuration = Number(durationMinutes);\n"
              "  if (!isDialogueDuration(targetDuration)) return res.status(400).json({ success: false, error: 'INVALID_DURATION' });\n"
              "  const persona = getAIStudentById(aiStudentId);\n"
              "  const rawHistory = canonicalizeHistory(history);\n"
              "  const childMessages = rawHistory.filter((m) => m.sender === 'child' && m.englishText.trim());\n"
              "  const childUtterances = childMessages\n"
              "    .map((m) => maskHighRiskPII(m.englishText.trim()).maskedText.slice(0, 100))\n"
              "    .filter(Boolean);\n"
              "  const examples = childUtterances.map((t) => `「${t}」`).join('、');\n"
              "  const detectedVocabMap = new Map<string, ReturnType<typeof detectVocabularyInText>[number]>();\n"
              "  for (const message of rawHistory) {\n"
              "    for (const item of detectVocabularyInText(message.englishText)) detectedVocabMap.set(item.id, item);\n"
              "  }\n"
              "  const canonicalVocab = Array.from(detectedVocabMap.values());\n"
              "  const firstTimestamp = rawHistory[0]?.timestamp || Date.now();\n"
              "  const lastTimestamp = rawHistory[rawHistory.length - 1]?.timestamp || firstTimestamp;\n"
              "  const stats = calculateCanonicalStats(rawHistory, firstTimestamp, lastTimestamp, targetDuration, canonicalVocab);\n\n"
          )
          text = text[:start] + new_block + text[end:]
          marker = "app.post('/api/feedback'"
          before, after = text.split(marker, 1)
          after = after.replace('${durationMinutes || 1}分', '${targetDuration}分')
          after = after.replace('${turns || 0}', '${stats.totalTurns}')
          after = after.replace('turns || 0', 'stats.totalTurns')
          after = after.replace('totalWords || 0', 'stats.totalChildWords')
          after = after.replace('(durationMinutes || 1) * 60', 'stats.actualDurationSeconds')
          after = after.replace('durationMinutes || 1', 'targetDuration')
          after = after.replace('encounteredVocab || []', 'canonicalVocab')
          p.write_text(before + marker + after)

          replace_once('src/utils/exportLog.ts', "import { maskHighRiskPII } from './security';\n", "import { maskTextForExternalUse } from './privacy';\n")
          replace_once('src/utils/exportLog.ts', "  return escapeHtml(maskHighRiskPII(String(value ?? '')).maskedText);\n", "  return escapeHtml(maskTextForExternalUse(String(value ?? '')));\n")
          PY
          python /tmp/apply_stage2.py
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Full QA and build
        run: |
          npm run qa
          npm run build
      - name: Commit stage 2 integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts src/utils/exportLog.ts
          git commit -m "feat: enforce canonical API data contract"
          git push origin HEAD:codex/stage2-data-contract
