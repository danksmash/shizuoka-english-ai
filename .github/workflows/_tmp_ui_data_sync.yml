name: Temporary UI data synchronization
on:
  push:
    branches:
      - codex/ui-data-sync-audit
permissions:
  contents: write
jobs:
  implement-and-verify:
    if: "${{ !contains(github.event.head_commit.message, 'feat: synchronize UI and data dashboards') }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: codex/ui-data-sync-audit
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply audited fixes
        run: |
          python3 scripts/_tmp_fix_ui_data_sync.py
          python3 scripts/_tmp_fix_ui_data_sync_followup.py
      - name: Full QA
        run: npm run qa
      - name: Production build
        run: npm run build
      - name: Commit implementation
        run: |
          git config user.name "danksmash"
          git config user.email "danksmash@gmail.com"
          git add src/App.tsx src/components/AIStudentCard.tsx src/components/FeedbackScreen.tsx src/server/researchExport.ts src/server/managementPage.ts scripts/qa-management-page.ts scripts/qa-research-integrated.ts scripts/qa-responsive-vocabulary.ts scripts/qa-dashboard-data-sync.ts package.json
          git commit -m "feat: synchronize UI and data dashboards"
          git push origin HEAD:codex/ui-data-sync-audit
