name: Functional UI Redesign

on:
  push:
    branches:
      - codex/ui-redesign-functional-20260828
    paths:
      - scripts/apply-functional-ui-redesign.py
      - .github/workflows/ui-redesign-functional.yml

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/ui-redesign-functional-20260828
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply UI redesign
        run: python3 scripts/apply-functional-ui-redesign.py
      - name: Install dependencies
        run: npm ci
      - name: Run all QA
        run: npm run qa
      - name: Production build
        run: npm run build
      - name: Commit verified redesign
        run: |
          rm -f scripts/apply-functional-ui-redesign.py .github/workflows/ui-redesign-functional.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "ui: rebuild learner teacher researcher workflows"
          git push origin HEAD:codex/ui-redesign-functional-20260828
