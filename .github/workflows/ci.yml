name: Build and type-check

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Apply approved topic starter patch
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/topic-starters-persona-routine'
        run: |
          python3 scripts/apply-topic-starter-patch.py
          git diff --check
          git checkout origin/main -- .github/workflows/ci.yml
          rm scripts/apply-topic-starter-patch.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: guide topic starters and free persona routines'
          git push origin HEAD:${{ github.head_ref }}

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Full QA (dialogue, speech, security, type-check)
        run: npm run qa

      - name: Production build
        run: npm run build
