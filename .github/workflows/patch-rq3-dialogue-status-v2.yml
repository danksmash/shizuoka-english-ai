name: One-shot RQ3 dialogue status alignment

on:
  push:
    branches:
      - fix/research-analysis-eligibility-v2
    paths:
      - '.github/workflows/patch-rq3-dialogue-status-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/research-analysis-eligibility-v2
      - name: Align RQ3 status count with dialogue analysis inclusion
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/server/researchRq3Routes.ts')
          s = p.read_text()
          old = "included: analysisSessions.filter((row) => Number(row.analysis_included || 0) === 1).length,"
          new = "dialogueIncluded: analysisSessions.filter((row) => Number(row.dialogue_analysis_included || 0) === 1).length,\n        reflectionIncluded: analysisSessions.filter((row) => Number(row.reflection_analysis_included || 0) === 1).length,\n        included: analysisSessions.filter((row) => Number(row.dialogue_analysis_included || 0) === 1).length,"
          if old not in s:
              raise SystemExit('expected RQ3 status line not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server/researchRq3Routes.ts
          git commit -m "fix: align RQ3 status with dialogue inclusion"
          git push origin HEAD:fix/research-analysis-eligibility-v2
