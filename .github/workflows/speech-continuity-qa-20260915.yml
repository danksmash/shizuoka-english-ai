name: Speech continuity safe patch

on:
  push:
    branches:
      - fix/speech-continuity-qa-20260915-final2
    paths:
      - '.github/workflows/speech-continuity-qa-20260915.yml'
      - 'scripts/patch_speech_continuity_20260915.py'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/speech-continuity-qa-20260915-final2
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply deterministic patch
        run: python scripts/patch_speech_continuity_20260915.py

      - name: Install dependencies
        run: npm ci

      - name: Speech regression QA
        run: npm run qa:speech

      - name: Contextual ASR QA
        run: npm run qa:contextual-asr

      - name: Data contract QA
        run: npm run qa:data

      - name: TypeScript check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Commit verified patch
        run: |
          rm -f .github/workflows/speech-continuity-qa-20260915.yml scripts/patch_speech_continuity_20260915.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: preserve natural speech continuity without research restart logs"
          git push origin HEAD:fix/speech-continuity-qa-20260915-final2
