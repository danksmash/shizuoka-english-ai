name: Temporary management refresh semantics
on:
  push:
    branches: [codex/management-refresh-semantics]
permissions:
  contents: write
jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/management-refresh-semantics
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Apply management refresh semantics
        run: python3 scripts/_tmp_apply_management_refresh.py
      - name: Full QA
        run: npm run qa
      - name: Production build
        run: npm run build
      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server/managementPage.ts scripts/qa-learner-identity-sync.ts
          git commit -m "fix: preserve management filters on Firestore reload"
          git push origin HEAD:codex/management-refresh-semantics
