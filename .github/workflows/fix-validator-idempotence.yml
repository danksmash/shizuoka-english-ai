name: Fix researcher dashboard validator idempotence
on:
  push:
    branches:
      - codex/research-dashboard-readability-filters
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make normalized filter patch idempotent
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/apply-research-dashboard-readability.yml')
          s=p.read_text()
          old="          s = replace_once(s, old_filters, new_filters, 'fixed researcher filter choices')"
          new="          if \"classes:['1','2','3','test','reserve']\" not in s:\n              s = replace_once(s, old_filters, new_filters, 'fixed researcher filter choices')"
          if new in s:
              print('already idempotent')
          elif old in s:
              p.write_text(s.replace(old,new,1))
          else:
              raise SystemExit('validator line not found')
          PY
          if git diff --quiet; then exit 0; fi
          git config user.name "danksmash"
          git config user.email "danksmash@gmail.com"
          git add .github/workflows/apply-research-dashboard-readability.yml
          git commit -m "ci: make researcher dashboard patch idempotent"
          git push origin HEAD:codex/research-dashboard-readability-filters
