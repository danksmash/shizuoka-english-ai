name: Study schedule production smoke

on:
  workflow_run:
    workflows:
      - Deploy production to Cloud Run
    types:
      - completed

permissions:
  contents: read

jobs:
  smoke:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify Study 1 schedule page, dashboard navigation and protected API
        run: |
          API_URL="https://shizuoka-english-ai-1075707511474.asia-northeast1.run.app"

          page="$(curl --fail --silent --show-error --max-time 20 "$API_URL/study-schedule.html")"
          echo "$page" | grep -q 'Study 1 学級スケジュール管理'
          echo "$page" | grep -q '実践校と比較校'
          echo "$page" | grep -q "let classes=\['5-1','5-2','5-3','6-1','6-2'\];"
          if echo "$page" | grep -q "'6-3'"; then
            echo 'Nonexistent class 6-3 is still present in Study 1 schedule page.'
            exit 1
          fi
          echo "$page" | grep -q 'Mid基準日（C1）'
          echo "$page" | grep -q '本人動画日 / C2分析基準日'
          echo "$page" | grep -q 'C2（動画提示なし）'
          echo "$page" | grep -q 'Post基準日'
          echo "$page" | grep -q 'href="/management"'

          dashboard="$(curl --fail --silent --show-error --max-time 20 "$API_URL/management")"
          echo "$dashboard" | grep -q 'Study 1 日程管理'
          echo "$dashboard" | grep -q 'href="/study-schedule.html"'

          query_status=$(curl --silent --show-error --max-time 20 \
            -o /tmp/study-schedule-query.json \
            -w '%{http_code}' \
            -X POST "$API_URL/api/management/study-schedules/query" \
            -H 'Content-Type: application/json' \
            --data '{}')
          test "$query_status" = '401'
          grep -q 'UNAUTHORIZED' /tmp/study-schedule-query.json

          save_status=$(curl --silent --show-error --max-time 20 \
            -o /tmp/study-schedule-save.json \
            -w '%{http_code}' \
            -X PUT "$API_URL/api/management/study-schedules" \
            -H 'Content-Type: application/json' \
            --data '{"classId":"5-1","appStartDate":"2026-09-17","nationalityRevealDate":"2026-10-01","videoViewDate":"2026-10-08","exchangeDate":"2026-10-15","expectedRevision":0}')
          test "$save_status" = '401'
          grep -q 'UNAUTHORIZED' /tmp/study-schedule-save.json
