name: Finalize researcher dashboard UX

on:
  push:
    branches:
      - codex/research-dashboard-csv-verification
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: research-dashboard-final-ux
  cancel-in-progress: false

jobs:
  fix-test-commit:
    if: ${{ !contains(github.event.head_commit.message || '', '[research-ux-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/research-dashboard-csv-verification
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Apply researcher dashboard UX fixes
        run: python3 scripts/finalize-research-dashboard-ux.py

      - name: Remove one-shot patch script
        run: rm -f scripts/finalize-research-dashboard-ux.py

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Full QA
        run: npm run qa

      - name: Real browser layout and instant-filter QA
        shell: bash
        run: |
          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_PATH"
          npm install --no-save --package-lock=false playwright-core@1.55.0 >/dev/null 2>&1
          cat > scripts/.tmp-render-research-page.ts <<'TS'
          import fs from 'node:fs';
          import { managementPageHtml } from '../src/server/managementPage';
          fs.writeFileSync('/tmp/research-dashboard.html',managementPageHtml(),'utf8');
          TS
          npx tsx scripts/.tmp-render-research-page.ts
          rm -f scripts/.tmp-render-research-page.ts
          cat > /tmp/qa-research-browser.mjs <<'JS'
          import { chromium } from 'playwright-core';
          const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_PATH,args:['--no-sandbox']});
          const page=await browser.newPage({viewport:{width:1366,height:900}});
          await page.goto('file:///tmp/research-dashboard.html');
          const sample={success:true,metrics:{participantCount:128,totalSessions:384,childUtteranceCount:9842,completeRate:98.7,latestAt:'2026-09-03 14:32:00'},filters:{classes:['5-1','6-2'],grades:['5','6'],personas:['emma_usa','rahul_bangladesh'],circles:['Inner','Outer'],labelConditions:['shown','hidden'],topics:['favorites','shizuoka_culture']},charts:{daily:[{date:'2026-09-01',sessions:45,mean_child_words:12.5,reflection_conveyed:3.1,reflection_understood:3.2,reflection_culture:3},{date:'2026-09-02',sessions:52,mean_child_words:14.2,reflection_conveyed:null,reflection_understood:3.5,reflection_culture:3.3}],personas:[{label:'Emma (emma_usa)',value:45}],circles:[{label:'Inner',value:45}],aggregation:'daily'},dataQuality:[{label:'complete',value:379},{label:'missing_reflection',value:5}],systemQuality:[{label:'AI応答失敗',value:2},{label:'マイクエラー',value:1},{label:'TTSフォールバック',value:3}],topExpressions:[{expression:'surfing',count:187,source:'persona'}],recentSessions:[{local_started_at:'2026-09-03 14:31:00',research_id:'R0123',persona_name:'Emma',persona_id:'emma_usa',topic:'好きなもの',target_duration_minutes:3,data_quality_flag:'complete'}],exportFiles:[{dataset:'sessions',fileName:'sessions.csv',contains:'session data',analysisUse:'longitudinal',rowCount:384},{dataset:'utterances',fileName:'utterances.csv',contains:'utterances',analysisUse:'interaction',rowCount:12000},{dataset:'expressions',fileName:'expressions.csv',contains:'expressions',analysisUse:'vocabulary',rowCount:3000},{dataset:'personas',fileName:'personas.csv',contains:'personas',analysisUse:'conditions',rowCount:9},{dataset:'codebook',fileName:'codebook.csv',contains:'variables',analysisUse:'reproducibility',rowCount:180}]};
          await page.evaluate((data)=>{document.getElementById('login').style.display='none';document.getElementById('panel').style.display='block';window.renderDashboard(data,'');},sample);
          const sizes=[[1920,1000],[1440,1000],[1366,900],[1024,900],[768,1000],[390,844]];
          for(const [width,height] of sizes){
            await page.setViewportSize({width,height});await page.waitForTimeout(50);
            const audit=await page.evaluate(()=>{const vw=document.documentElement.clientWidth;const visibleButtons=[...document.querySelectorAll('button')].filter((b)=>{const st=getComputedStyle(b),r=b.getBoundingClientRect();return st.display!=='none'&&st.visibility!=='hidden'&&r.width>0&&r.height>0});return{overflow:document.documentElement.scrollWidth-vw,outside:visibleButtons.filter((b)=>{const r=b.getBoundingClientRect();return r.left<-1||r.right>vw+1}).map((b)=>b.textContent?.trim())}});
            if(audit.overflow>2||audit.outside.length)throw new Error(`layout overflow at ${width}px: ${JSON.stringify(audit)}`);
          }
          await page.evaluate((data)=>{window.__urls=[];window.fetch=async(url)=>{window.__urls.push(String(url));const next=structuredClone(data);if(String(url).includes('personaId=emma_usa'))next.metrics.totalSessions=45;return{ok:true,json:async()=>next}};const p=document.getElementById('personaId');p.value='emma_usa';p.dispatchEvent(new Event('change',{bubbles:true}));},sample);
          await page.waitForTimeout(350);
          const instant=await page.evaluate(()=>({sessions:document.getElementById('mSessions').textContent,urls:window.__urls,exportUrl:window.appliedQueryUrl('/api/management/research.csv','sessions'),doctor:document.body.innerText.includes('博士')}));
          if(instant.sessions!=='45')throw new Error('persona dropdown did not refresh immediately');
          if(!instant.urls.some((u)=>u.includes('personaId=emma_usa')))throw new Error('auto refresh did not send persona filter');
          if(!instant.exportUrl.includes('personaId=emma_usa'))throw new Error('export filter snapshot is not synchronized with displayed dashboard');
          if(instant.doctor)throw new Error('forbidden researcher UI wording is visible');
          await page.evaluate(()=>{const e=document.getElementById('start');e.value='2026-09-01';e.dispatchEvent(new Event('change',{bubbles:true}));});
          await page.waitForTimeout(350);
          const dateAudit=await page.evaluate(()=>({urls:window.__urls,exportUrl:window.appliedQueryUrl('/api/management/research.csv','sessions')}));
          if(!dateAudit.urls.some((u)=>u.includes('start=2026-09-01')))throw new Error('date change did not refresh immediately');
          if(!dateAudit.exportUrl.includes('start=2026-09-01'))throw new Error('date filter is not synchronized with export');
          await browser.close();
          console.log('Real browser researcher dashboard responsive/instant-filter QA: PASS');
          JS
          CHROME_PATH="$CHROME_PATH" node /tmp/qa-research-browser.mjs

      - name: No forbidden researcher UI wording
        run: |
          if grep -R -n '博士' src/server/managementPage.ts; then
            echo 'Forbidden researcher UI wording found.' >&2
            exit 1
          fi

      - name: Production build
        run: npm run build

      - name: Verify protected student app unchanged
        run: |
          test -z "$(git status --short | grep -E 'public/images|src/assets/images|src/utils/speech.ts|src/components/SetupScreen.tsx|src/App.tsx|src/components/DialogueView.tsx|src/components/FeedbackScreen.tsx|src/components/ReflectionScreen.tsx' || true)"

      - name: Commit validated researcher dashboard fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898297+github-actions[bot]@users.noreply.github.com"
          git checkout HEAD -- .github/workflows
          git add -A
          git commit -m "fix: synchronize researcher dashboard filters and charts [research-ux-applied]"
          git push origin HEAD:codex/research-dashboard-csv-verification
