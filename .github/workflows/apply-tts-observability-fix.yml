name: Apply and verify TTS observability fix

on:
  push:
    branches:
      - fix/tts-provider-observability-20260909
    paths:
      - 'scripts/apply-tts-observability-fix.mjs'
      - '.github/workflows/apply-tts-observability-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply patch
        run: |
          sed -i "s/workflow.includes('Access-Control-Expose-Headers')/workflow.includes('access-control-expose-headers')/" scripts/apply-tts-observability-fix.mjs
          node scripts/apply-tts-observability-fix.mjs
      - name: Full QA and build
        run: |
          npm run qa
          npm run build
      - name: Commit verified implementation and remove helpers
        run: |
          rm -f scripts/apply-tts-observability-fix.mjs .github/workflows/apply-tts-observability-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: make TTS provider telemetry observable and research-safe'
          git push origin HEAD:fix/tts-provider-observability-20260909
