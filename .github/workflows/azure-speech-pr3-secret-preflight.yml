name: PR3 Azure secret preflight

on:
  push:
    branches:
      - codex/pr3-azure-primary
    paths:
      - '.github/workflows/azure-speech-pr3-secret-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/1075707511474/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-actions-deploy@shizuoka-english-ai.iam.gserviceaccount.com
          project_id: shizuoka-english-ai
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: shizuoka-english-ai
          version: '>= 416.0.0'
      - name: Verify Secret Manager entry without reading secret value
        run: |
          if gcloud secrets describe AZURE_SPEECH_KEY --project shizuoka-english-ai --format='value(name)' >/tmp/secret-name 2>/tmp/secret-error; then
            test -s /tmp/secret-name
            echo 'AZURE_SPEECH_KEY exists in Secret Manager.'
          else
            echo 'AZURE_SPEECH_KEY is not available to the deployment identity in Secret Manager.'
            cat /tmp/secret-error
            exit 3
          fi
