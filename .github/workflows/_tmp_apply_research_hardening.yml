name: Temporary apply research data hardening
on:
  push:
    branches: [codex/research-data-hardening]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/research-data-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply hardening patch
        run: python3 scripts/_tmp_apply_research_hardening.py
      - name: Full QA and build
        run: |
          npm run qa
          npm run build
      - name: Commit implementation only
        run: |
          rm -f scripts/_tmp_apply_research_hardening.py .github/workflows/_tmp_apply_research_hardening.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: harden longitudinal research data pipeline"
          git push origin HEAD:codex/research-data-hardening
