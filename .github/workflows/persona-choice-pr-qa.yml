name: Persona choice questionnaire PR QA

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/server/personaChoiceReasonAnalysis.ts'
      - 'src/server/personaChoiceReasonExport.ts'
      - 'src/server/personaReasonRq1Link.ts'
      - 'src/server/researchRq1Routes.ts'
      - 'src/server/researchRq1DashboardRuntime.ts'
      - 'src/server/questionnaireRoutes.ts'
      - 'src/server/researchStreamingExportRuntime.ts'
      - 'public/persona-choice-analysis.html'
      - 'public/questionnaire-analysis.html'
      - 'scripts/persona-choice-reasons-auto-sync.gs'
      - 'scripts/qa-persona-choice-analysis.ts'
      - 'scripts/qa-questionnaire-auto-sync.ts'
      - 'package.json'
      - '.github/workflows/persona-choice-pr-qa.yml'

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript check
        run: npm run lint
      - name: Questionnaire auto-sync and Persona reason QA
        run: npm run qa:questionnaire-auto
      - name: Existing questionnaire QA
        run: npm run qa:questionnaire
      - name: Existing research CSV/ZIP QA
        run: npm run qa:research-export
