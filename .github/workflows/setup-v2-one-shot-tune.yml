name: One-shot setup v2 reference tuning

on:
  push:
    branches:
      - codex/setup-main-reference-5x4

permissions:
  contents: write

jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: codex/setup-main-reference-5x4
          fetch-depth: 0

      - name: Apply guarded CSS tuning
        run: |
          python - <<'PY'
          from pathlib import Path

          css_path = Path('src/setup-screen-v2.css')
          css = css_path.read_text()
          if 'width: min(100%, 1612px);' in css:
              print('setup v2 CSS already tuned')
              raise SystemExit(0)

          replacements = {
              'width: min(100%, 1720px);\n  min-height: calc(100dvh - clamp(16px, 1.7vw, 28px));':
              'width: min(100%, 1612px);\n  height: min(calc(100dvh - 20px), 904px);\n  min-height: 0;',
              '.setup-v2-shell {\n    min-height: auto;\n    grid-template-rows: auto auto auto;':
              '.setup-v2-shell {\n    height: auto;\n    min-height: auto;\n    grid-template-rows: auto auto auto;',
          }
          for old, new in replacements.items():
              if old not in css:
                  raise SystemExit(f'missing guarded CSS pattern: {old!r}')
              css = css.replace(old, new, 1)
          css_path.write_text(css)
          PY

      - name: Commit CSS if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/setup-screen-v2.css
          if git diff --cached --quiet; then
            echo 'No CSS change needed.'
            exit 0
          fi
          git commit -m 'style: align setup v2 with reference viewport'
          git push origin HEAD:codex/setup-main-reference-5x4
