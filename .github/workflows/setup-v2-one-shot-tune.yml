name: One-shot setup v2 reference tuning

on:
  push:
    branches:
      - codex/setup-main-reference-5x4

permissions:
  contents: write

jobs:
  tune:
    if: github.event.head_commit.message == 'ops: tune setup v2 reference sizing and preview'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: codex/setup-main-reference-5x4
          fetch-depth: 0

      - name: Apply guarded visual tuning
        run: |
          python - <<'PY'
          from pathlib import Path

          css_path = Path('src/setup-screen-v2.css')
          css = css_path.read_text()
          replacements = {
              'width: min(100%, 1720px);\n  min-height: calc(100dvh - clamp(16px, 1.7vw, 28px));':
              'width: min(100%, 1612px);\n  height: min(calc(100dvh - 20px), 904px);\n  min-height: 0;',
              '.setup-v2-shell {\n    min-height: auto;\n    grid-template-rows: auto auto auto;':
              '.setup-v2-shell {\n    height: auto;\n    min-height: auto;\n    grid-template-rows: auto auto auto;',
          }
          for old, new in replacements.items():
              if old not in css:
                  raise SystemExit(f'missing guarded CSS pattern: {old!r}')
              css = css.replace(old, new, 1)
          css_path.write_text(css)

          preview_path = Path('.github/workflows/setup-v2-preview.yml')
          preview = preview_path.read_text()
          old_build = '''      - name: Production build\n        run: npm run build\n'''
          new_build = '''      - name: Production build\n        env:\n          VITE_API_BASE_URL: https://shizuoka-english-ai-1075707511474.asia-northeast1.run.app\n          VITE_PERSONA_LABEL_CONDITION: shown\n        run: npm run build\n'''
          if old_build not in preview:
              raise SystemExit('missing guarded production build block')
          preview = preview.replace(old_build, new_build, 1)
          if '--wait-for-timeout=1500' not in preview:
              raise SystemExit('missing screenshot wait marker')
          preview = preview.replace('--wait-for-timeout=1500', '--wait-for-timeout=5000')
          preview_path.write_text(preview)
          PY

      - name: Remove one-shot workflow
        run: rm .github/workflows/setup-v2-one-shot-tune.yml

      - name: Commit tuned branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/setup-screen-v2.css .github/workflows/setup-v2-preview.yml .github/workflows/setup-v2-one-shot-tune.yml
          git commit -m 'style: align setup v2 with reference viewport'
          git push origin HEAD:codex/setup-main-reference-5x4
