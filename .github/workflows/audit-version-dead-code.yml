name: Audit obsolete version code
on:
  push:
    branches:
      - codex/docs-and-version-cleanup
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify obsolete version code is isolated
        run: |
          set -euo pipefail
          EXCLUDES=(
            ':!scripts/app-version.ts'
            ':!scripts/qa-version-ui.ts'
            ':!docs/VERSIONING.md'
            ':!.github/workflows/audit-version-dead-code.yml'
          )
          echo "References outside legacy module/QA/doc/audit workflow:"
          git grep -n -E 'app-version|getAppVersionMetadata|injectManagementVersionIntoBundle|isVersionedCommit' -- . "${EXCLUDES[@]}" || true
          count=$(git grep -l -E 'app-version|getAppVersionMetadata|injectManagementVersionIntoBundle|isVersionedCommit' -- . "${EXCLUDES[@]}" | wc -l)
          test "$count" -eq 0
          echo "PASS: legacy dynamic version module has no runtime/build references outside its own QA/doc."
