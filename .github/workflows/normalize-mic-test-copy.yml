# trigger
name: Normalize microphone test copy
on:
  push:
    paths:
      - '.github/workflows/normalize-mic-test-copy.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Update wording
        run: |
          python -c "from pathlib import Path; p=Path('src/components/SetupScreen.tsx'); s=p.read_text(); s=s.replace('対話の前に「マイクを準備する」を押してください。','対話の前に「マイク・音声入力をテスト」を押して、英語を一言話してください。'); p.write_text(s)"
          ! grep -q 'マイクを準備する' src/components/SetupScreen.tsx
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run qa:dialogue
      - run: npm run build
      - name: Commit and clean up
        run: |
          rm -f .github/workflows/normalize-mic-test-copy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/SetupScreen.tsx .github/workflows/normalize-mic-test-copy.yml
          git commit -m "Normalize microphone recognition test guidance"
          git push
