name: Azure Voice refinement review

on:
  push:
    branches:
      - codex/azure-voice-v2-golden-speed
    paths:
      - 'scripts/azure-voice-refine-review.mjs'
      - '.github/workflows/azure-voice-refine-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/azure-voice-v2-golden-speed
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate targeted comparison audio
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: japaneast
          AZURE_VOICE_REFINE_OUTPUT: voice-refine-artifacts
        run: node scripts/azure-voice-refine-review.mjs
      - name: Validate package
        run: |
          test -f voice-refine-artifacts/index.html
          test -f voice-refine-artifacts/manifest.json
          test "$(find voice-refine-artifacts/audio -name '*.mp3' | wc -l)" -eq 12
          grep -q 'emma-Cora-default' voice-refine-artifacts/manifest.json
          grep -q 'oliver-Ollie-plus5' voice-refine-artifacts/manifest.json
          grep -q 'liam-Ken-gap150' voice-refine-artifacts/manifest.json
      - name: Upload review package
        uses: actions/upload-artifact@v4
        with:
          name: azure-voice-refine-review
          path: voice-refine-artifacts/
          retention-days: 7
