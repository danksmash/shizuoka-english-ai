name: Feedback charts layout one-shot

on:
  push:
    branches: [codex/fix-feedback-charts-layout]

permissions:
  contents: write

jobs:
  validate-and-finalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/fix-feedback-charts-layout
          fetch-depth: 0
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply audited patch
        run: python3 scripts/patch-feedback-charts-layout.py
      - name: Full QA
        run: npm run qa
      - name: Production build
        run: npm run build
      - name: Remove one-shot files
        run: |
          rm scripts/patch-feedback-charts-layout.py
          rm .github/workflows/fix-feedback-charts-layout.yml
      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: Japanese feedback and useful dashboard charts"
          git push origin HEAD:codex/fix-feedback-charts-layout
