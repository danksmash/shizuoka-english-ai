name: Audit Pilot B Azure fallback cause

on:
  push:
    branches:
      - audit/azure-pilotb-20260909
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/1075707511474/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-actions-deploy@shizuoka-english-ai.iam.gserviceaccount.com
          project_id: shizuoka-english-ai
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: shizuoka-english-ai
          version: '>= 416.0.0'
      - name: Read-only Azure / Cloud Run production audit
        shell: bash
        run: |
          set -euo pipefail
          PROJECT=shizuoka-english-ai
          REGION=asia-northeast1
          SERVICE=shizuoka-english-ai
          API_URL='https://shizuoka-english-ai-1075707511474.asia-northeast1.run.app'

          echo '=== CURRENT_SERVICE_SAFE_CONFIG ==='
          gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format=json > /tmp/service.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/service.json'))
          spec=((d.get('spec') or {}).get('template') or {}).get('spec') or {}
          meta=(d.get('status') or {})
          containers=spec.get('containers') or []
          env=[]
          for c in containers:
            for e in c.get('env') or []:
              item={'name':e.get('name')}
              if 'value' in e and e.get('name') in {'APP_VERSION','APP_BUILD','AZURE_SPEECH_REGION','ANTHROPIC_MODEL'}:
                item['value']=e.get('value')
              if 'valueFrom' in e:
                sk=((e.get('valueFrom') or {}).get('secretKeyRef') or {})
                item['secret_name']=sk.get('name'); item['secret_key']=sk.get('key')
              env.append(item)
          print(json.dumps({
            'latestReadyRevisionName':meta.get('latestReadyRevisionName'),
            'latestCreatedRevisionName':meta.get('latestCreatedRevisionName'),
            'traffic':meta.get('traffic'),
            'serviceAccountName':spec.get('serviceAccountName'),
            'env':env,
          },ensure_ascii=False,indent=2))
          PY

          echo '=== AZURE_SECRET_METADATA ==='
          gcloud secrets versions list AZURE_SPEECH_KEY --project "$PROJECT" --limit=5 --format='table(name,state,createTime,destroyTime)' || true
          RUNTIME_SA=$(gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format='value(spec.template.spec.serviceAccountName)')
          if [ -z "$RUNTIME_SA" ]; then
            PROJECT_NUMBER=$(gcloud projects describe "$PROJECT" --format='value(projectNumber)')
            RUNTIME_SA="${PROJECT_NUMBER}-compute@developer.gserviceaccount.com"
          fi
          echo "runtime_sa=$RUNTIME_SA"
          gcloud secrets get-iam-policy AZURE_SPEECH_KEY --project "$PROJECT" --format=json > /tmp/policy.json
          RUNTIME_SA="$RUNTIME_SA" python3 - <<'PY'
          import json,os
          sa='serviceAccount:'+os.environ['RUNTIME_SA']
          p=json.load(open('/tmp/policy.json'))
          roles=[]
          for b in p.get('bindings') or []:
            if sa in (b.get('members') or []): roles.append(b.get('role'))
          print('runtime_secret_roles='+json.dumps(roles))
          PY

          echo '=== REVISIONS_AROUND_PILOT ==='
          gcloud run revisions list --service "$SERVICE" --project "$PROJECT" --region "$REGION" --limit=30 \
            --format='table(metadata.name,metadata.creationTimestamp,status.conditions[0].status,spec.containers[0].env)' || true

          echo '=== PILOT_WINDOW_AZURE_FAILURE_LOGS ==='
          FILTER='resource.type="cloud_run_revision" AND resource.labels.service_name="shizuoka-english-ai" AND timestamp>="2026-09-09T02:10:00Z" AND timestamp<="2026-09-09T03:00:00Z" AND (textPayload:"Azure TTS failed" OR jsonPayload.message:"Azure TTS failed")'
          gcloud logging read "$FILTER" --project "$PROJECT" --limit=1000 --format=json > /tmp/azure_failures.json || echo '[]' > /tmp/azure_failures.json
          python3 - <<'PY'
          import json,re,collections
          rows=json.load(open('/tmp/azure_failures.json'))
          bymsg=collections.Counter(); byrev=collections.Counter(); samples=[]
          for r in rows:
            msg=r.get('textPayload') or ((r.get('jsonPayload') or {}).get('message')) or ''
            # Keep only error class/message, remove any incidental request/user material.
            m=re.search(r'(AZURE_[A-Z0-9_:.-]+|AbortError|aborted|fetch failed|ETIMEDOUT|ECONNRESET|HTTP_\d+)',str(msg),re.I)
            key=m.group(1) if m else str(msg)[:180]
            bymsg[key]+=1
            rev=((r.get('resource') or {}).get('labels') or {}).get('revision_name','unknown')
            byrev[rev]+=1
            if len(samples)<10: samples.append({'timestamp':r.get('timestamp'),'revision':rev,'error':key})
          print(json.dumps({'count':len(rows),'by_error':dict(bymsg),'by_revision':dict(byrev),'samples':samples},ensure_ascii=False,indent=2))
          PY

          echo '=== PILOT_WINDOW_CLOUD_RUN_REVISION_REQUEST_COUNTS ==='
          FILTER2='resource.type="cloud_run_revision" AND resource.labels.service_name="shizuoka-english-ai" AND timestamp>="2026-09-09T02:10:00Z" AND timestamp<="2026-09-09T03:00:00Z" AND httpRequest.requestMethod="POST" AND httpRequest.requestUrl:"/api/tts"'
          gcloud logging read "$FILTER2" --project "$PROJECT" --limit=5000 --format=json > /tmp/tts_requests.json || echo '[]' > /tmp/tts_requests.json
          python3 - <<'PY'
          import json,collections
          rows=json.load(open('/tmp/tts_requests.json'))
          rev=collections.Counter(); status=collections.Counter()
          for r in rows:
            labels=((r.get('resource') or {}).get('labels') or {})
            rev[labels.get('revision_name','unknown')]+=1
            status[str((r.get('httpRequest') or {}).get('status','unknown'))]+=1
          print(json.dumps({'request_log_count':len(rows),'by_revision':dict(rev),'by_http_status':dict(status)},indent=2))
          PY

          echo '=== CURRENT_HEALTH ==='
          curl --fail --silent --show-error --max-time 15 "$API_URL/api/health" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(json.dumps({k:d.get(k) for k in ["status","appBuild","appVersion","ttsProvider","ttsFallback","azureTtsConfigured"]},indent=2))'

          echo '=== CURRENT_TTS_PROVIDER_SMOKE ==='
          for student in emma_usa oliver_uk minji_korea; do
            H=$(mktemp); A=$(mktemp)
            code=$(curl --silent --show-error --max-time 20 -D "$H" -o "$A" -w '%{http_code}' -X POST "$API_URL/api/tts" -H 'Content-Type: application/json' --data "{\"text\":\"Hello. Nice to meet you.\",\"aiStudentId\":\"$student\",\"speakingRate\":1.0}")
            provider=$(awk -F': ' 'tolower($1)=="x-tts-provider"{gsub("\r","");print $2}' "$H")
            fallback=$(awk -F': ' 'tolower($1)=="x-tts-fallback-from"{gsub("\r","");print $2}' "$H")
            latency=$(awk -F': ' 'tolower($1)=="x-tts-latency-ms"{gsub("\r","");print $2}' "$H")
            echo "$student status=$code provider=${provider:-none} fallback_from=${fallback:-none} latency_ms=${latency:-none} bytes=$(wc -c < "$A")"
            rm -f "$H" "$A"
          done
