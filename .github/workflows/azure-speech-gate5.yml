name: Gate 5 - Cloud Run Claude Azure load

on:
  push:
    branches:
      - codex/gate5-cloudrun-claude-azure
    paths:
      - 'scripts/gate5-load.ts'
      - '.github/workflows/azure-speech-gate5.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate5:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GATE5_OUTPUT_DIR: gate5-artifacts
      GATE5_CHAT_URL: https://shizuoka-english-ai-1075707511474.asia-northeast1.run.app
      AZURE_SPEECH_REGION: japaneast
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify protected production primary and Azure secret
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
        run: |
          test -n "$AZURE_SPEECH_KEY"
          health=$(curl --fail --silent --show-error --max-time 20 "$GATE5_CHAT_URL/api/health")
          echo "$health" | grep -q '"status":"ok"'
          echo "$health" | grep -q '"model":"claude-sonnet-5"'
          echo "$health" | grep -q '"ttsProvider":"google-chirp3-hd"'
          echo "Production remains Google Chirp 3 HD; Azure secret stays only in the Actions process."

      - name: Full QA and build before load
        run: |
          npm run qa
          npm run build

      - name: Run paired Cloud Run Claude plus exact PR2 Azure provider load at 10 to 35 concurrency
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
        run: npx tsx scripts/gate5-load.ts

      - name: Upload Gate 5 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azure-speech-gate5-report
          path: gate5-artifacts/
          if-no-files-found: warn
          retention-days: 14
