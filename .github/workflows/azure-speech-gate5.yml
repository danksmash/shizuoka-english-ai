name: Gate 5 - Cloud Run Claude Azure load

on:
  push:
    branches:
      - codex/gate5-cloudrun-claude-azure
    paths:
      - 'scripts/gate5-prepare-canary.mjs'
      - 'scripts/gate5-load.py'
      - '.github/workflows/azure-speech-gate5.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  gate5:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PROJECT_ID: shizuoka-english-ai
      REGION: asia-northeast1
      SERVICE: shizuoka-english-ai-azure-canary
      GATE5_OUTPUT_DIR: gate5-artifacts
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify Azure Speech GitHub secret
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
        run: |
          test -n "$AZURE_SPEECH_KEY"
          echo "Azure Speech secret is configured."

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/1075707511474/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-actions-deploy@shizuoka-english-ai.iam.gserviceaccount.com
          project_id: shizuoka-english-ai

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: shizuoka-english-ai
          version: '>= 416.0.0'

      - name: Synchronize Azure key to Google Secret Manager
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
        run: |
          if ! gcloud secrets describe AZURE_SPEECH_KEY --project "$PROJECT_ID" >/dev/null 2>&1; then
            gcloud secrets create AZURE_SPEECH_KEY --project "$PROJECT_ID" --replication-policy=automatic
          fi
          printf '%s' "$AZURE_SPEECH_KEY" | gcloud secrets versions add AZURE_SPEECH_KEY --project "$PROJECT_ID" --data-file=- >/dev/null
          echo "Azure Speech key synchronized to Secret Manager without printing its value."

      - name: Prepare isolated canary source
        run: |
          node scripts/gate5-prepare-canary.mjs
          npm run qa
          npm run build
          TOKEN=$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')
          echo "GATE5_CANARY_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Deploy isolated Azure canary service
        run: |
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT_ID" \
            --source . \
            --region "$REGION" \
            --allow-unauthenticated \
            --min-instances 0 \
            --max-instances 10 \
            --concurrency 80 \
            --timeout 60 \
            --memory 512Mi \
            --update-env-vars ANTHROPIC_MODEL=claude-sonnet-5,SESSION_RETENTION_DAYS=1095,APP_VERSION=gate5-canary,APP_BUILD="$GITHUB_SHA",AZURE_CANARY_ENABLED=true,AZURE_CANARY_TOKEN="$GATE5_CANARY_TOKEN",AZURE_SPEECH_REGION=japaneast \
            --update-secrets ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest,AZURE_SPEECH_KEY=AZURE_SPEECH_KEY:latest
          URL=$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')
          test -n "$URL"
          echo "GATE5_CANARY_URL=$URL" >> "$GITHUB_ENV"

      - name: Canary health check
        run: |
          health=$(curl --fail --silent --show-error --max-time 20 "$GATE5_CANARY_URL/api/health")
          echo "$health" | grep -q '"status":"ok"'
          echo "$health" | grep -q '"model":"claude-sonnet-5"'
          echo "$health" | grep -q '"ttsProvider":"google-chirp3-hd"'

      - name: Run paired 10 to 35 concurrency load
        run: python3 scripts/gate5-load.py

      - name: Upload Gate 5 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azure-speech-gate5-report
          path: gate5-artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Delete isolated canary service
        if: always()
        run: |
          gcloud run services delete "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --quiet || true
