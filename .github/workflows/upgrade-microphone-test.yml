name: Microphone recognition test upgrade

on:
  push:
    paths:
      - '.github/workflows/upgrade-microphone-test.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Apply patch
        run: python scripts/patch_mic_recognition_test.py

      - name: Verify patch
        run: |
          grep -q "createSpeechRecognitionInstance" src/components/SetupScreen.tsx
          grep -q "音声入力OK" src/components/SetupScreen.tsx
          grep -q "recognition.start()" src/components/SetupScreen.tsx
          grep -q "マイク・音声入力をテスト" src/components/SetupScreen.tsx

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dialogue QA
        run: npm run qa:dialogue

      - name: Build
        run: npm run build

      - name: Commit production change
        run: |
          rm -f .github/workflows/upgrade-microphone-test.yml scripts/patch_mic_recognition_test.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/SetupScreen.tsx .github/workflows/upgrade-microphone-test.yml scripts/patch_mic_recognition_test.py
          git commit -m "Make microphone setup perform real speech input test"
          git push
