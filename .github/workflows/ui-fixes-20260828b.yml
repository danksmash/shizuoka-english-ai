name: UI fixes 20260828b
on:
  push:
    branches:
      - codex/ui-fixes-20260828b
    paths:
      - .github/workflows/ui-fixes-20260828b.yml
permissions:
  contents: write
jobs:
  validate-and-finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/ui-fixes-20260828b
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply reported UI fixes
        run: |
          python3 scripts/apply-ui-fixes-20260828.py
          rm scripts/apply-ui-fixes-20260828.py
          rm .github/workflows/ui-fixes-20260828b.yml
      - name: Full QA
        run: npm run qa
      - name: Production build
        run: npm run build
      - name: Commit validated fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: address learner and management UI regressions"
          git push origin HEAD:codex/ui-fixes-20260828b
