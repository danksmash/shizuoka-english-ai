name: Apply six-topic formalization once

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  codemod:
    if: github.head_ref == 'fix/formalize-six-dialogue-topics'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/formalize-six-dialogue-topics
          fetch-depth: 0

      - name: Apply focused dialogue codemod
        run: node scripts/formalize-six-topics.cjs

      - name: Validate patch whitespace
        run: git diff --check

      - name: Commit generated source changes
        run: |
          # Workflow files cannot be pushed by the branch GITHUB_TOKEN here.
          # Keep the production-smoke workflow change for a separate connector commit.
          git checkout -- .github/workflows/cloud-run-deploy.yml
          if git diff --quiet && git diff --cached --quiet; then
            echo "No codemod changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src server.ts scripts
          git commit -m "fix: formalize six dialogue topics"
          git push origin HEAD:fix/formalize-six-dialogue-topics
