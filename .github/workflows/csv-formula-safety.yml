name: CSV formula safety fix
on:
  push:
    branches:
      - codex/csv-formula-safety
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Apply minimal CSV safety fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p=Path('src/server/researchDashboard.ts')
          s=p.read_text()
          old="""function csvCell(value: unknown): string {\n  const text = String(value ?? '');\n  return `\\\"${text.replace(/\\\"/g, '\\\"\\\"')}\\\"`;\n}"""
          new="""function csvCell(value: unknown): string {\n  const raw = String(value ?? '');\n  const text = typeof value === 'string' && /^[\\t\\r ]*[=+\\-@]/.test(raw) ? `'${raw}` : raw;\n  return `\\\"${text.replace(/\\\"/g, '\\\"\\\"')}\\\"`;\n}"""
          if s.count(old)!=1:
              raise SystemExit(f'csvCell marker count={s.count(old)}')
          p.write_text(s.replace(old,new,1))

          p=Path('scripts/qa-research-export-complete.ts')
          s=p.read_text()
          marker="""for (const dataset of ['sessions','utterances','expressions','personas','codebook'] as const) {\n  const expected = RESEARCH_EXPORT_HEADERS[dataset];"""
          insert="""const formulaProbeRows=[\n  {english_text_anonymized:'=1+1',word_count:-1},\n  {english_text_anonymized:'  @SUM(A1:A2)',word_count:2},\n  {english_text_anonymized:'normal text',word_count:3},\n];\nconst formulaProbeCsv=serializeResearchCsv(formulaProbeRows as any,'utterances');\nassert.ok(formulaProbeCsv.includes(\"\\\"'=1+1\\\"\"),'formula-like string must be neutralized at CSV serialization time');\nassert.ok(formulaProbeCsv.includes(\"\\\"'  @SUM(A1:A2)\\\"\"),'formula-like string after leading spaces must be neutralized');\nassert.ok(formulaProbeCsv.includes('\\\"normal text\\\"'),'ordinary text must remain unchanged');\nassert.ok(formulaProbeCsv.includes('\\\"-1\\\"'),'numeric negative values must remain numeric text and must not be prefixed');\nassert.equal(formulaProbeRows[0].english_text_anonymized,'=1+1','internal research data must remain unchanged by CSV serialization');\n\n"""+marker
          if s.count(marker)!=1:
              raise SystemExit(f'qa marker count={s.count(marker)}')
          p.write_text(s.replace(marker,insert,1))
          PY
      - name: Guard scope
        run: |
          set -euo pipefail
          git diff --name-only
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "scripts/qa-research-export-complete.ts src/server/researchDashboard.ts "
      - name: Run full QA
        run: npm run qa
      - name: Production build
        run: npm run build
      - name: Commit clean implementation
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/csv-formula-safety.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/server/researchDashboard.ts scripts/qa-research-export-complete.ts .github/workflows/csv-formula-safety.yml
          git commit -m 'fix: neutralize formula-like research CSV cells'
          git push origin HEAD:codex/csv-formula-safety
