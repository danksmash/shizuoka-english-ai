name: Research dashboard scalability QA

on:
  push:
    branches:
      - fix/research-dashboard-scalable-aggregates-20260930
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Dashboard resilience QA
        run: npm run qa:research-dashboard-resilience
      - name: Aggregate parity QA
        run: npm run qa:research-dashboard-aggregate
      - name: Pilot B isolation QA
        run: npm run qa:pilot-b
      - name: TypeScript
        run: npm run lint
      - name: Build
        run: npm run build
