name: Research dashboard scalability QA

on:
  push:
    branches:
      - fix/research-dashboard-scalable-aggregates-20260930
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Dashboard resilience QA
        run: npm run qa:research-dashboard-resilience
      - name: Aggregate parity QA
        shell: bash
        run: |
          set -o pipefail
          npm run qa:research-dashboard-aggregate 2>&1 | tee aggregate-qa.log
      - name: Pilot B isolation QA
        run: npm run qa:pilot-b
      - name: Full regression QA
        run: npm run qa
      - name: Build
        run: npm run build
      - name: Upload aggregate QA diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aggregate-qa-diagnostics
          path: aggregate-qa.log
          if-no-files-found: ignore
          retention-days: 1
