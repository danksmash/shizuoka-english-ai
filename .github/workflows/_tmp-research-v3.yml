name: Temporary integrated research v3 implementation
on:
  push:
    branches:
      - codex/research-integrated-data-v3
permissions:
  contents: write
jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/research-integrated-data-v3
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Apply implementation patch
        run: python3 scripts/_apply_research_v3_patch.py
      - name: Install dependencies
        run: npm ci
      - name: Full QA
        run: npm run qa
      - name: Production build
        run: npm run build
      - name: Remove temporary implementation files
        run: rm -f scripts/_apply_research_v3_patch.py .github/workflows/_tmp-research-v3.yml
      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add integrated longitudinal research datasets"
          git push origin codex/research-integrated-data-v3
