name: Apply contextual ASR patch

on:
  push:
    branches:
      - feat/contextual-asr-information-gap
    paths:
      - .github/workflows/contextual-asr-apply.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/contextual-asr-information-gap
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply contextual ASR implementation
        run: |
          node scripts/apply-contextual-asr.mjs
          node scripts/post-contextual-asr-fix.mjs

      - name: Target contextual ASR QA
        run: npm run qa:contextual-asr

      - name: Full regression QA
        run: npm run qa

      - name: Production build
        run: npm run build

      - name: Validate diff
        run: |
          git diff --check
          git status --short
          test -f src/utils/contextualAsr.ts
          test -f scripts/qa-contextual-asr.ts

      - name: Commit verified implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx src/utils/contextualAsr.ts src/data/dialogueTopicContext.ts scripts/qa-contextual-asr.ts package.json
          if git diff --cached --quiet; then
            echo 'No implementation diff produced.' >&2
            exit 1
          fi
          git commit -m 'feat: add conservative contextual ASR interpretation'
          git push origin HEAD:feat/contextual-asr-information-gap
