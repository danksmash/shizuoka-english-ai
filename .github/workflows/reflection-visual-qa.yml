name: Reflection visual QA

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/reflection/ReflectionApp.tsx'
      - 'src/reflection/reflection-b.css'
      - 'scripts/qa-reflection-visual.mjs'
      - '.github/workflows/reflection-visual-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install project dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright for rendered visual QA
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Build production assets
        run: npm run build

      - name: Start production preview
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/reflection-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/reflection/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/reflection-preview.log
          exit 1

      - name: Render and inspect Chromebook viewports
        run: node scripts/qa-reflection-visual.mjs

      - name: Upload rendered screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reflection-visual-qa
          path: artifacts/reflection-*.png
          if-no-files-found: warn
