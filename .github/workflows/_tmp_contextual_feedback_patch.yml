name: Temporary contextual feedback patch
on: [push]
permissions: write-all
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/_tmp_apply_contextual_feedback.py
      - run: |
          rm scripts/_tmp_apply_contextual_feedback.py
          rm .github/workflows/_tmp_contextual_feedback_patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: let AI select contextual learning expressions"
          git push
