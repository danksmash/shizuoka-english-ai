name: Stage 3A implementation
on:
  push:
    branches:
      - codex/stage3a-learning-data
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/stage3a-learning-data
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply targeted changes
        run: python scripts/stage3a_apply.py
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Full QA
        run: npm run qa && npx tsx scripts/qa-stage3a.ts
      - name: Production build
        run: npm run build
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts src/components/SetupScreen.tsx src/dataContract.ts src/server/persistence.ts scripts/qa-stage3a.ts
          git commit -m "feat: wire learning data and management APIs"
          git push origin HEAD:codex/stage3a-learning-data
