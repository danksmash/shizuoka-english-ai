name: One-time set 5-3 exchange date 2026-10-06

on:
  push:
    branches:
      - ops/set-5-3-exchange-date-20261006
    paths:
      - '.github/workflows/one-time-set-5-3-exchange-date-20261006.yml'

permissions:
  contents: read
  id-token: write

jobs:
  configure:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/1075707511474/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-actions-deploy@shizuoka-english-ai.iam.gserviceaccount.com
          project_id: shizuoka-english-ai

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: shizuoka-english-ai
          version: '>= 416.0.0'

      - name: Set known exchange date without changing Phase 2 or raw sessions
        shell: bash
        run: |
          set -euo pipefail
          export ACCESS_TOKEN="$(gcloud auth print-access-token)"
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          from datetime import datetime, timezone

          token=os.environ['ACCESS_TOKEN']
          url='https://firestore.googleapis.com/v1/projects/shizuoka-english-ai/databases/(default)/documents/study_schedules/5-3'

          def decode(v):
              if not isinstance(v,dict): return None
              if 'stringValue' in v: return v['stringValue']
              if 'booleanValue' in v: return bool(v['booleanValue'])
              if 'integerValue' in v: return int(v['integerValue'])
              if 'doubleValue' in v: return float(v['doubleValue'])
              if 'timestampValue' in v: return v['timestampValue']
              if 'nullValue' in v: return None
              if 'arrayValue' in v: return [decode(x) for x in v['arrayValue'].get('values',[])]
              if 'mapValue' in v: return {k:decode(x) for k,x in v['mapValue'].get('fields',{}).items()}
              return None

          def encode(v):
              if v is None: return {'nullValue':None}
              if isinstance(v,bool): return {'booleanValue':v}
              if isinstance(v,int): return {'integerValue':str(v)}
              if isinstance(v,float): return {'doubleValue':v}
              if isinstance(v,str): return {'stringValue':v}
              if isinstance(v,list): return {'arrayValue':{'values':[encode(x) for x in v]}}
              if isinstance(v,dict): return {'mapValue':{'fields':{k:encode(x) for k,x in v.items()}}}
              return {'stringValue':str(v)}

          def request(u, method='GET', body=None):
              req=urllib.request.Request(
                  u,
                  data=None if body is None else json.dumps(body).encode(),
                  headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'},
                  method=method,
              )
              with urllib.request.urlopen(req,timeout=30) as r:
                  return json.load(r)

          doc=request(url)
          f={k:decode(v) for k,v in doc.get('fields',{}).items()}
          before={
              'revision':f.get('revision',0),
              'nationalityRevealDate':f.get('nationalityRevealDate',''),
              'announcedVisitorCountries':f.get('announcedVisitorCountries',[]),
              'videoViewDate':f.get('videoViewDate',''),
              'assignmentRevealDate':f.get('assignmentRevealDate',''),
              'exchangeDate':f.get('exchangeDate',''),
          }
          print('BEFORE',json.dumps(before,ensure_ascii=False,sort_keys=True))

          assert before['nationalityRevealDate']=='2026-10-06'
          assert before['announcedVisitorCountries']==['Germany','Hungary','Lithuania','Poland']
          assert not str(before['videoViewDate'] or '')
          assert not str(before['assignmentRevealDate'] or '')
          if str(before['exchangeDate'] or '') == '2026-10-16':
              print('NO_OP exchangeDate already correct')
              raise SystemExit(0)
          assert not str(before['exchangeDate'] or ''), 'SAFETY_ABORT: existing exchangeDate differs'

          revision=int(before['revision'] or 0)+1
          now=datetime.now(timezone.utc).isoformat().replace('+00:00','Z')
          actor='chatgpt-study-schedule-audit'
          snapshot={
              'revision':revision,
              'appStartDate':str(f.get('appStartDate') or ''),
              'nationalityRevealDate':'2026-10-06',
              'announcedVisitorCountries':f.get('announcedVisitorCountries') or [],
              'announcedVisitorCountryCounts':f.get('announcedVisitorCountryCounts') or {},
              'videoViewDate':'',
              'assignmentRevealDate':'',
              'exchangeDate':'2026-10-16',
              'updatedAt':now,
              'updatedBy':actor,
          }
          history=list(f.get('history') or [])
          history=(history+[snapshot])[-100:]

          patch={
              'exchangeDate':'2026-10-16',
              'revision':revision,
              'updatedAt':now,
              'updatedBy':actor,
              'history':history,
          }
          mask=list(patch.keys())
          update_time=doc.get('updateTime')
          assert update_time, 'SAFETY_ABORT: Firestore updateTime missing'
          query='&'.join('updateMask.fieldPaths='+urllib.parse.quote(x,safe='') for x in mask)
          patch_url=url+'?'+query+'&currentDocument.updateTime='+urllib.parse.quote(update_time,safe='')
          request(patch_url,'PATCH',{'fields':{k:encode(v) for k,v in patch.items()}})

          after_doc=request(url)
          a={k:decode(v) for k,v in after_doc.get('fields',{}).items()}
          after={
              'revision':a.get('revision'),
              'nationalityRevealDate':a.get('nationalityRevealDate'),
              'announcedVisitorCountries':a.get('announcedVisitorCountries'),
              'videoViewDate':a.get('videoViewDate'),
              'assignmentRevealDate':a.get('assignmentRevealDate'),
              'exchangeDate':a.get('exchangeDate'),
          }
          print('AFTER',json.dumps(after,ensure_ascii=False,sort_keys=True))
          assert after['exchangeDate']=='2026-10-16'
          assert after['nationalityRevealDate']=='2026-10-06'
          assert after['announcedVisitorCountries']==['Germany','Hungary','Lithuania','Poland']
          assert not str(after['videoViewDate'] or '')
          assert not str(after['assignmentRevealDate'] or '')
          print('CONFIG_RESULT PASS')
          PY
