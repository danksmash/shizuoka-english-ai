name: Audit Pilot B reflection triangulation

on:
  push:
    branches:
      - audit/pilot-b-291-quality
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/1075707511474/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-actions-deploy@shizuoka-english-ai.iam.gserviceaccount.com
          project_id: shizuoka-english-ai
      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: shizuoka-english-ai
      - name: Read-only reflection/log triangulation
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(gcloud auth print-access-token)"
          curl --fail --silent --show-error --max-time 45 \
            -X POST 'https://firestore.googleapis.com/v1/projects/shizuoka-english-ai/databases/(default)/documents:runQuery' \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            --data '{"structuredQuery":{"from":[{"collectionId":"sessions"}],"where":{"fieldFilter":{"field":{"fieldPath":"classId"},"op":"EQUAL","value":{"stringValue":"6-PB"}}},"limit":1000}}' > /tmp/pb.json
          python3 - <<'PY'
          import json, math
          from collections import Counter, defaultdict

          TARGET='2026-09-09'
          def dec(v):
              if not isinstance(v,dict): return None
              for k in ('stringValue','timestampValue'):
                  if k in v:return v[k]
              if 'integerValue' in v:
                  try:return int(v['integerValue'])
                  except:return 0
              if 'doubleValue' in v:
                  try:return float(v['doubleValue'])
                  except:return 0
              if 'booleanValue' in v:return bool(v['booleanValue'])
              if 'nullValue' in v:return None
              if 'arrayValue' in v:return [dec(x) for x in (v.get('arrayValue',{}).get('values') or [])]
              if 'mapValue' in v:return {k:dec(x) for k,x in (v.get('mapValue',{}).get('fields') or {}).items()}
              return None

          rows=[]
          for item in json.load(open('/tmp/pb.json')):
              f=(item.get('document') or {}).get('fields') or {}
              r={k:dec(v) for k,v in f.items()}
              if r.get('localDate')==TARGET:rows.append(r)
          assert len(rows)==291

          def hist(r):return r.get('history') if isinstance(r.get('history'),list) else []
          def child(r):return [m for m in hist(r) if isinstance(m,dict) and m.get('sender')=='child' and str(m.get('englishText') or '').strip()]
          def evs(r):return r.get('systemEvents') if isinstance(r.get('systemEvents'),list) else []
          def evcount(r,t):return sum(1 for e in evs(r) if isinstance(e,dict) and e.get('type')==t)
          def ref(r):return r.get('reflection') if isinstance(r.get('reflection'),dict) else {}
          def done(r):return evcount(r,'session_finish')>0 or (bool(r.get('endedAt')) and bool(ref(r)))
          def quality(r):
              if not r.get('sessionId') or not r.get('researchId') or not hist(r) or not child(r):return 'missing_core'
              if not done(r):return 'interrupted'
              if not ref(r):return 'missing_reflection'
              return 'complete'
          def start(r):
              x=r.get('startedAt')
              if isinstance(x,(int,float)):return float(x)
              if isinstance(x,str):
                  try:
                      from datetime import datetime
                      return datetime.fromisoformat(x.replace('Z','+00:00')).timestamp()*1000
                  except:return 0
              return 0
          complete2=[r for r in rows if quality(r)=='complete' and int(r.get('targetDurationMinutes') or 0)==2]
          assert len(complete2)==186
          by=defaultdict(list)
          for r in complete2:by[str(r.get('researchId') or '')].append(r)
          core52=[]
          for rs in by.values():
              rs.sort(key=start);core52.extend(rs[:2])
          assert len(core52)==52

          def mean(vals):
              vals=[float(x) for x in vals if isinstance(x,(int,float))]
              return round(sum(vals)/len(vals),2) if vals else None
          def dist(vals):return dict(sorted(Counter(int(v) for v in vals if int(v) in (1,3,5)).items()))
          def avg_rating(scope,key):return mean([ref(r).get(key) for r in scope if ref(r).get(key) in (1,3,5)])
          def low_rate(scope,key):
              vals=[ref(r).get(key) for r in scope if ref(r).get(key) in (1,3,5)]
              return round(100*sum(v in (1,3) for v in vals)/len(vals),1) if vals else None
          def summarize(scope):
              replay=[r for r in scope if evcount(r,'ai_replay')>0]
              no_replay=[r for r in scope if evcount(r,'ai_replay')==0]
              mic=[r for r in scope if evcount(r,'mic_error')>0]
              no_mic=[r for r in scope if evcount(r,'mic_error')==0]
              out={
                'sessions':len(scope),
                'ratings':{},
                'replay_sessions':len(replay),
                'mic_error_sessions':len(mic),
                'by_replay':{},
                'by_mic_error':{},
              }
              labels={
                'conveyedIdeas':'conveyed_ideas',
                'understoodPartner':'understood_partner',
                'noticedLanguageCulture':'noticed_language_culture',
              }
              for key,label in labels.items():
                  vals=[ref(r).get(key) for r in scope if ref(r).get(key) in (1,3,5)]
                  out['ratings'][label]={'distribution':dist(vals),'mean':mean(vals),'not_top_rating_rate_percent':round(100*sum(v<5 for v in vals)/len(vals),1) if vals else None}
                  out['by_replay'][label]={
                    'replay_mean':avg_rating(replay,key),
                    'no_replay_mean':avg_rating(no_replay,key),
                    'replay_not_top_rate_percent':low_rate(replay,key),
                    'no_replay_not_top_rate_percent':low_rate(no_replay,key),
                  }
                  out['by_mic_error'][label]={
                    'mic_error_mean':avg_rating(mic,key),
                    'no_mic_error_mean':avg_rating(no_mic,key),
                    'mic_error_not_top_rate_percent':low_rate(mic,key),
                    'no_mic_error_not_top_rate_percent':low_rate(no_mic,key),
                  }
              return out

          out={
            'complete_2min_all':summarize(complete2),
            'candidate_core_first_two_complete_2min_per_participant':summarize(core52),
          }
          print('=== PILOT_B_REFLECTION_TRIANGULATION ===')
          print(json.dumps(out,ensure_ascii=False,indent=2,sort_keys=True))
          print('NOTE: These are descriptive associations only; they do not establish causation.')
          print('=== END_REFLECTION_TRIANGULATION ===')
          PY
