name: Deploy production to Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloud-run-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Full QA and production build
        run: |
          npm run qa
          npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/1075707511474/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-actions-deploy@shizuoka-english-ai.iam.gserviceaccount.com
          project_id: shizuoka-english-ai

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: shizuoka-english-ai
          version: '>= 416.0.0'

      - name: Diagnose current Google TTS availability
        run: |
          API_URL="https://shizuoka-english-ai-1075707511474.asia-northeast1.run.app"
          tts_body=$(mktemp)
          status=$(curl --silent --show-error --max-time 20 \
            -o "$tts_body" \
            -w '%{http_code}' \
            -X POST "$API_URL/api/tts" \
            -H 'Content-Type: application/json' \
            --data '{"text":"Hello. Nice to meet you.","aiStudentId":"emma_usa","speakingRate":0.95}' || true)
          if [ "$status" != "200" ]; then
            echo "Current TTS endpoint returned HTTP $status"
            cat "$tts_body" || true
            echo "Recent Cloud Run logs:"
            gcloud run services logs read shizuoka-english-ai \
              --project shizuoka-english-ai \
              --region asia-northeast1 \
              --limit 30 || true
            exit 1
          fi
          rm -f "$tts_body"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy shizuoka-english-ai \
            --project shizuoka-english-ai \
            --source . \
            --region asia-northeast1 \
            --allow-unauthenticated \
            --min-instances 1 \
            --max-instances 10 \
            --concurrency 80 \
            --timeout 60 \
            --memory 512Mi \
            --set-env-vars ANTHROPIC_MODEL=claude-sonnet-4-6 \
            --update-secrets ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest

      - name: Production health, AI and TTS smoke test
        run: |
          API_URL="https://shizuoka-english-ai-1075707511474.asia-northeast1.run.app"

          health=""
          for attempt in 1 2 3 4 5; do
            if health=$(curl --fail --silent --show-error --max-time 15 "$API_URL/api/health"); then
              break
            fi
            sleep 3
          done
          echo "$health" | grep -q '"status":"ok"'
          echo "$health" | grep -q '"aiConfigured":true'
          echo "$health" | grep -q '"ttsProvider":"google-chirp3-hd"'

          chat=""
          for attempt in 1 2 3; do
            if chat=$(curl --fail --silent --show-error --max-time 50 \
              -X POST "$API_URL/api/chat" \
              -H 'Content-Type: application/json' \
              --data '{"message":"Hello!","history":[],"topic":"intro","aiStudentId":"emma_usa"}'); then
              if echo "$chat" | grep -q '"success":true' && echo "$chat" | grep -q '"route":"anthropic-resilient"'; then
                break
              fi
            fi
            sleep 3
          done
          echo "$chat" | grep -q '"success":true'
          echo "$chat" | grep -q '"route":"anthropic-resilient"'

          for student in \
            emma_usa \
            oliver_uk \
            liam_australia \
            chloe_canada \
            bence_hungary \
            zofia_poland \
            rahul_bangladesh \
            linh_vietnam \
            aung_myanmar; do
            tts_headers=$(mktemp)
            tts_audio=$(mktemp)
            curl --fail --silent --show-error --max-time 20 \
              -D "$tts_headers" \
              -o "$tts_audio" \
              -X POST "$API_URL/api/tts" \
              -H 'Content-Type: application/json' \
              --data "{\"text\":\"Hello. Nice to meet you.\",\"aiStudentId\":\"$student\",\"speakingRate\":0.95}"
            grep -qi 'content-type: audio/mpeg' "$tts_headers"
            grep -qi 'x-tts-provider: google-chirp3-hd' "$tts_headers"
            test "$(wc -c < "$tts_audio")" -gt 500
            rm -f "$tts_headers" "$tts_audio"
          done
