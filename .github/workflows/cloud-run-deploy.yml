name: Deploy production to Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloud-run-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Full QA and production build
        run: |
          npm run qa
          npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/1075707511474/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-actions-deploy@shizuoka-english-ai.iam.gserviceaccount.com
          project_id: shizuoka-english-ai

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: shizuoka-english-ai
          version: '>= 416.0.0'

      - name: Deploy to Cloud Run
        run: |
          BUILD_SHA="${GITHUB_SHA:0:12}"
          gcloud run deploy shizuoka-english-ai \
            --project shizuoka-english-ai \
            --source . \
            --region asia-northeast1 \
            --allow-unauthenticated \
            --min-instances 1 \
            --max-instances 10 \
            --concurrency 80 \
            --timeout 60 \
            --memory 512Mi \
            --update-env-vars ANTHROPIC_MODEL=claude-sonnet-5,SESSION_RETENTION_DAYS=1095,APP_VERSION=1.0.7,APP_BUILD="$BUILD_SHA" \
            --update-secrets ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest

      - name: Production health and AI smoke test
        run: |
          API_URL="https://shizuoka-english-ai-1075707511474.asia-northeast1.run.app"

          health=""
          for attempt in 1 2 3 4 5; do
            if health=$(curl --fail --silent --show-error --max-time 15 "$API_URL/api/health"); then
              break
            fi
            sleep 3
          done
          echo "$health" | grep -q '"status":"ok"'
          echo "$health" | grep -q '"aiConfigured":true'
          echo "$health" | grep -q '"model":"claude-sonnet-5"'
          echo "$health" | grep -q '"appVersion":"1.0.7"'
          echo "$health" | grep -q '"ttsProvider":"google-chirp3-hd"'
          echo "$health" | grep -q '"learningDataConfigured":true'
          echo "$health" | grep -q '"managementConfigured":true'

          chat=""
          for attempt in 1 2 3; do
            if chat=$(curl --fail --silent --show-error --max-time 50 \
              -X POST "$API_URL/api/chat" \
              -H 'Content-Type: application/json' \
              --data '{"message":"Hello!","history":[],"topic":"intro","aiStudentId":"emma_usa"}'); then
              if echo "$chat" | grep -q '"success":true' && echo "$chat" | grep -q '"route":"anthropic-resilient"'; then
                break
              fi
            fi
            sleep 3
          done
          echo "$chat" | grep -q '"success":true'
          echo "$chat" | grep -q '"route":"anthropic-resilient"'
          echo "$chat" | grep -q '"model":"claude-sonnet-5"'

          # A realistic five-minute research payload must pass Express JSON parsing.
          # The deliberately unknown learning code guarantees that this smoke test cannot write a session.
          python3 - <<'PY'
          import json,time
          now=int(time.time()*1000)
          history=[]
          for i in range(80):
              history.append({
                  'id':f'm{i}',
                  'sender':'child' if i%2 else 'ai',
                  'englishText':'I like soccer because it is fun. How about you?',
                  'japaneseText':'私はサッカーが好きです。楽しいからです。あなたはどうですか？',
                  'timestamp':now+i*1000,
              })
          payload={
              'sessionId':'production_payload_probe_12345678',
              'learningCode':'Z9Q7',
              'aiStudentId':'emma_usa',
              'topic':'favorites',
              'targetDurationMinutes':5,
              'startedAt':now,
              'endedAt':now+300000,
              'history':history,
          }
          open('/tmp/session-payload.json','w').write(json.dumps(payload,ensure_ascii=False))
          PY
          payload_status=$(curl --silent --show-error --max-time 20 \
            -o /tmp/session-payload-response.json \
            -w '%{http_code}' \
            -X POST "$API_URL/api/sessions" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/session-payload.json)
          test "$payload_status" = '401'
          grep -q 'LEARNING_CODE_NOT_FOUND' /tmp/session-payload-response.json

      - name: Production Google TTS voice check
        continue-on-error: true
        run: |
          API_URL="https://shizuoka-english-ai-1075707511474.asia-northeast1.run.app"
          for student in \
            emma_usa \
            oliver_uk \
            liam_australia \
            chloe_canada \
            bence_hungary \
            zofia_poland \
            rahul_bangladesh \
            linh_vietnam \
            aung_myanmar; do
            tts_headers=$(mktemp)
            tts_audio=$(mktemp)
            status=$(curl --silent --show-error --max-time 20 \
              -D "$tts_headers" \
              -o "$tts_audio" \
              -w '%{http_code}' \
              -X POST "$API_URL/api/tts" \
              -H 'Content-Type: application/json' \
              --data "{\"text\":\"Hello. Nice to meet you.\",\"aiStudentId\":\"$student\",\"speakingRate\":0.95}" || true)
            if [ "$status" != "200" ]; then
              echo "Google TTS is not active for $student yet (HTTP $status). Device TTS fallback remains available."
              cat "$tts_audio" || true
              exit 1
            fi
            grep -qi 'content-type: audio/mpeg' "$tts_headers"
            grep -qi 'x-tts-provider: google-chirp3-hd' "$tts_headers"
            grep -qi 'x-tts-effective-rate: 0.95' "$tts_headers"
            test "$(wc -c < "$tts_audio")" -gt 500
            rm -f "$tts_headers" "$tts_audio"
          done
