name: Deploy production to Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  statuses: write

concurrency:
  group: cloud-run-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Full QA and production build
        run: |
          npm run qa
          npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/1075707511474/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-actions-deploy@shizuoka-english-ai.iam.gserviceaccount.com
          project_id: shizuoka-english-ai

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: shizuoka-english-ai
          version: '>= 416.0.0'

      - name: Verify required production secrets and grant runtime access
        run: |
          RUNTIME_SA=$(gcloud run services describe shizuoka-english-ai \
            --project shizuoka-english-ai \
            --region asia-northeast1 \
            --format='value(spec.template.spec.serviceAccountName)')
          if [ -z "$RUNTIME_SA" ]; then
            PROJECT_NUMBER=$(gcloud projects describe shizuoka-english-ai --format='value(projectNumber)')
            RUNTIME_SA="${PROJECT_NUMBER}-compute@developer.gserviceaccount.com"
          fi
          test -n "$RUNTIME_SA"
          for secret in AZURE_SPEECH_KEY QUESTIONNAIRE_INGEST_SECRET; do
            gcloud secrets describe "$secret" \
              --project shizuoka-english-ai \
              --format='value(name)' >/dev/null
            gcloud secrets versions access latest \
              --secret="$secret" \
              --project shizuoka-english-ai >/dev/null
            gcloud secrets add-iam-policy-binding "$secret" \
              --project shizuoka-english-ai \
              --member="serviceAccount:${RUNTIME_SA}" \
              --role='roles/secretmanager.secretAccessor' \
              --quiet
          done

      - name: Pre-generate fixed Azure TTS assets
        run: |
          rm -rf runtime-static-tts
          export AZURE_SPEECH_REGION=japaneast
          export AZURE_SPEECH_KEY="$(gcloud secrets versions access latest \
            --secret=AZURE_SPEECH_KEY \
            --project=shizuoka-english-ai)"
          test -n "$AZURE_SPEECH_KEY"
          npx tsx scripts/generate-fixed-azure-tts.ts
          test "$(find runtime-static-tts -type f -name '*.mp3' | wc -l)" -ge 20
          unset AZURE_SPEECH_KEY

      - name: Deploy to Cloud Run
        run: |
          BUILD_SHA="${GITHUB_SHA:0:12}"
          gcloud run deploy shizuoka-english-ai \
            --project shizuoka-english-ai \
            --source . \
            --region asia-northeast1 \
            --allow-unauthenticated \
            --min-instances 0 \
            --max-instances 10 \
            --concurrency 80 \
            --timeout 60 \
            --memory 512Mi \
            --update-env-vars ANTHROPIC_MODEL=claude-sonnet-5,SESSION_RETENTION_DAYS=1095,APP_VERSION=1.0.7,APP_BUILD="$BUILD_SHA",AZURE_SPEECH_REGION=japaneast \
            --update-secrets ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest,AZURE_SPEECH_KEY=AZURE_SPEECH_KEY:latest,QUESTIONNAIRE_INGEST_SECRET=QUESTIONNAIRE_INGEST_SECRET:latest

      - name: Production health and AI smoke test
        run: |
          API_URL="https://shizuoka-english-ai-1075707511474.asia-northeast1.run.app"
          EXPECTED_BUILD="${GITHUB_SHA:0:12}"

          health=""
          for attempt in 1 2 3 4 5; do
            if health=$(curl --fail --silent --show-error --max-time 15 "$API_URL/api/health"); then
              break
            fi
            sleep 3
          done
          echo "$health" | grep -q '"status":"ok"'
          echo "$health" | grep -q '"aiConfigured":true'
          echo "$health" | grep -q '"model":"claude-sonnet-5"'
          echo "$health" | grep -q '"appVersion":"1.0.7"'
          echo "$health" | grep -q '"ttsProvider":"azure-speech"'
          echo "$health" | grep -q '"azureTtsConfigured":true'
          echo "$health" | grep -q '"learningDataConfigured":true'
          echo "$health" | grep -q '"managementConfigured":true'
          echo "$health" | grep -q "\"build\":\"${EXPECTED_BUILD}\""

          # Research Dashboard deployment contract: verify the exact deployed build,
          # the current seven-file UI, and that Phase analytics no longer injects
          # a second dashboard API request into the management page.
          management_html=""
          for attempt in 1 2 3; do
            if management_html=$(curl --fail --silent --show-error --max-time 20 "$API_URL/management"); then
              break
            fi
            sleep 2
          done
          grep -q '7 CSVを一括ZIP' <<<"$management_html"
          grep -q 'questionnaire-analysis.html' <<<"$management_html"
          grep -q 'restoreManagementSession' <<<"$management_html"
          grep -q 'researcher-readable.css' <<<"$management_html"
          if grep -q 'id="questionnaireSection"' <<<"$management_html"; then
            echo 'Questionnaire analysis must not be embedded in Research Dashboard.' >&2
            exit 1
          fi
          if grep -q '/api/management/questionnaire/statistics\|/api/management/questionnaire/descriptive\|/api/management/questionnaire/revision\|/api/management/questionnaire/analysis' <<<"$management_html"; then
            echo 'Questionnaire data requests must not be present in Research Dashboard HTML.' >&2
            exit 1
          fi
          dashboard_ref_count=$(printf '%s' "$management_html" | grep -o '/api/management/research.dashboard' | wc -l | tr -d ' ')
          test "$dashboard_ref_count" = '1'

          readable_css=$(curl --fail --silent --show-error --max-time 20 "$API_URL/researcher-readable.css")
          grep -q '.export-card p{font-size:15px!important' <<<"$readable_css"
          grep -q 'button,input,select,textarea{font-size:16px!important' <<<"$readable_css"

          questionnaire_html=""
          for attempt in 1 2 3; do
            if questionnaire_html=$(curl --fail --silent --show-error --max-time 20 "$API_URL/questionnaire-analysis.html"); then
              break
            fi
            sleep 2
          done
          grep -q 'Study 1 事前・事後質問紙分析' <<<"$questionnaire_html"
          grep -q '/api/management/questionnaire/analysis' <<<"$questionnaire_html"
          grep -q 'dataset=student_questionnaires' <<<"$questionnaire_html"
          grep -q 'Google Forms自動同期' <<<"$questionnaire_html"

          dashboard_probe=$(curl --silent --show-error --max-time 20 \
            -o /tmp/research-dashboard-auth-probe.json \
            -w '%{http_code}' \
            "$API_URL/api/management/research.dashboard?dataScope=main")
          test "$dashboard_probe" = '401'

          audit_probe=$(curl --silent --show-error --max-time 20 \
            -o /tmp/research-session-audit-auth-probe.json \
            -w '%{http_code}' \
            -X POST "$API_URL/api/management/research.session-audit" \
            -H 'Content-Type: application/json' \
            --data '{"filters":{"dataScope":"main"}}')
          test "$audit_probe" = '401'

          # Auto-sync must be configured in production. An unsigned probe must be
          # rejected with 401. A missing secret would return 503 and fail deploy.
          questionnaire_probe=$(curl --silent --show-error --max-time 20 \
            -o /tmp/questionnaire-auto-probe.json \
            -w '%{http_code}' \
            -X POST "$API_URL/api/questionnaire-auto/ingest" \
            -H 'Content-Type: application/json' \
            --data '{"formId":"probe","formResponseId":"probe","submittedAt":"2026-09-12T00:00:00.000Z","learningCode":"Z9Q7","answers":{}}')
          test "$questionnaire_probe" = '401'
          grep -q 'INVALID_QUESTIONNAIRE_SIGNATURE' /tmp/questionnaire-auto-probe.json

          chat=""
          for attempt in 1 2 3; do
            if chat=$(curl --fail --silent --show-error --max-time 50 \
              -X POST "$API_URL/api/chat" \
              -H 'Content-Type: application/json' \
              --data '{"message":"Hello!","history":[],"topic":"intro","aiStudentId":"emma_usa"}'); then
              if echo "$chat" | grep -q '"success":true' && echo "$chat" | grep -q '"route":"anthropic-resilient"'; then
                break
              fi
            fi
            sleep 3
          done
          echo "$chat" | grep -q '"success":true'
          echo "$chat" | grep -q '"route":"anthropic-resilient"'
          echo "$chat" | grep -q '"model":"claude-sonnet-5"'

          # This calls /api/chat only and cannot create or modify a Firestore research session.
          routine=""
          for attempt in 1 2 3; do
            if routine=$(curl --fail --silent --show-error --max-time 50 \
              -X POST "$API_URL/api/chat" \
              -H 'Content-Type: application/json' \
              --data '{"message":"I get up at seven. What do you do in the morning?","history":[{"id":"ai-start","sender":"ai","englishText":"Let\u0027s talk about our daily lives. What do you do in the morning?","timestamp":1}],"topic":"daily_routine","aiStudentId":"emma_usa"}'); then
              if echo "$routine" | grep -q '"success":true' && echo "$routine" | grep -q '"route":"anthropic-resilient"'; then
                break
              fi
            fi
            sleep 3
          done
          ROUTINE_JSON="$routine" python3 - <<'PY'
          import json, os
          data = json.loads(os.environ['ROUTINE_JSON'])
          assert data.get('success') is True, data
          assert data.get('_diagnostics', {}).get('route') == 'anthropic-resilient', data
          reply = str(data.get('data', {}).get('reply', '')).lower()
          assert reply.strip(), reply
          PY

          API_URL="$API_URL" node scripts/qa-production-persona-arrival.mjs
          API_URL="$API_URL" node scripts/qa-production-intro-conversation.mjs

          python3 - <<'PY'
          import json,time
          now=int(time.time()*1000)
          history=[]
          for i in range(80):
              history.append({
                  'id':f'm{i}',
                  'sender':'child' if i%2 else 'ai',
                  'englishText':'I like soccer because it is fun. How about you?',
                  'japaneseText':'私はサッカーが好きです。楽しいからです。あなたはどうですか？',
                  'timestamp':now+i*1000,
              })
          payload={
              'sessionId':'production_payload_probe_12345678',
              'learningCode':'Z9Q7',
              'aiStudentId':'emma_usa',
              'topic':'favorites',
              'targetDurationMinutes':5,
              'startedAt':now,
              'endedAt':now+300000,
              'history':history,
          }
          open('/tmp/session-payload.json','w').write(json.dumps(payload,ensure_ascii=False))
          PY
          payload_status=$(curl --silent --show-error --max-time 20 \
            -o /tmp/session-payload-response.json \
            -w '%{http_code}' \
            -X POST "$API_URL/api/sessions" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/session-payload.json)
          test "$payload_status" = '401'
          grep -q 'LEARNING_CODE_NOT_FOUND' /tmp/session-payload-response.json

      - name: Production Azure primary voice check
        run: |
          API_URL="https://shizuoka-english-ai-1075707511474.asia-northeast1.run.app"
          # Voice Profile v3 keeps 1.00 as the reviewed baseline while the
          # student-facing 0.75-1.25 control must change Azure's effective rate.
          for student in \
            emma_usa oliver_uk liam_australia minji_korea pavel_belarus \
            lukas_germany aina_malaysia dimas_indonesia bence_hungary yuting_taiwan \
            zofia_poland matas_lithuania ananya_india xinyi_china linh_vietnam \
            rahul_bangladesh nadeesha_srilanka suman_nepal amara_nigeria andrei_romania; do
            tts_headers=$(mktemp)
            tts_audio=$(mktemp)
            status=$(curl --silent --show-error --max-time 20 \
              -D "$tts_headers" \
              -o "$tts_audio" \
              -w '%{http_code}' \
              -X POST "$API_URL/api/tts" \
              -H 'Content-Type: application/json' \
              --data "{\"text\":\"Hello. Nice to meet you.\",\"aiStudentId\":\"$student\",\"speakingRate\":1.0}")
            test "$status" = "200"
            grep -qi 'content-type: audio/mpeg' "$tts_headers"
            grep -qi 'x-tts-provider: azure-speech' "$tts_headers"
            grep -qi 'x-tts-effective-rate: 1.00' "$tts_headers"
            test "$(wc -c < "$tts_audio")" -gt 500
            rm -f "$tts_headers" "$tts_audio"
          done

          for rate in 0.75 1.25; do
            tts_headers=$(mktemp)
            tts_audio=$(mktemp)
            status=$(curl --silent --show-error --max-time 20 \
              -D "$tts_headers" \
              -o "$tts_audio" \
              -w '%{http_code}' \
              -X POST "$API_URL/api/tts" \
              -H 'Content-Type: application/json' \
              --data "{\"text\":\"This is a speaking rate check.\",\"aiStudentId\":\"emma_usa\",\"speakingRate\":$rate}")
            test "$status" = "200"
            grep -qi 'content-type: audio/mpeg' "$tts_headers"
            grep -qi 'x-tts-provider: azure-speech' "$tts_headers"
            grep -qi "x-tts-effective-rate: $rate" "$tts_headers"
            test "$(wc -c < "$tts_audio")" -gt 500
            rm -f "$tts_headers" "$tts_audio"
          done

      - name: Mark Cloud Run deployment verified
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context=cloud-run-production \
            -f description='Cloud Run deploy and production smoke passed' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Mark Cloud Run deployment failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure \
            -f context=cloud-run-production \
            -f description='Cloud Run deploy or production smoke failed' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
