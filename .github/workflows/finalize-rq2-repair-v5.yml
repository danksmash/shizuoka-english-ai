name: Finalize RQ2 repair v5

on:
  push:
    branches:
      - feature/rq2-repair-v5-20260929b
    paths:
      - '.github/workflows/finalize-rq2-repair-v5.yml'
      - '.github/scripts/finalize-rq2-repair-v5.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[repair-final]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rq2-repair-v5-20260929b
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply compatibility fixes
        run: python3 .github/scripts/finalize-rq2-repair-v5.py
      - name: RQ2 QA
        run: npm run qa:research-rq2
      - name: RQ3 QA
        run: npm run qa:research-rq3
      - name: TypeScript check
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server/researchRq2Codebook.ts src/server/researchRq3Persistence.ts scripts/qa-research-rq3.ts
          git commit -m "fix: preserve legacy RQ2 runs and align RQ3 prompt metadata [repair-final]"
          git push origin HEAD:feature/rq2-repair-v5-20260929b
