name: Information density UI one-shot v4

on:
  push:
    branches:
      - codex/information-density-ui
    paths:
      - .github/workflows/information-density-one-shot-v4.yml

permissions:
  contents: write

jobs:
  validate-and-finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/information-density-ui
          fetch-depth: 0
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply audited information-density patch
        run: python3 scripts/patch-information-density-v4.py
      - name: Full QA
        run: npm run qa
      - name: Production build
        run: npm run build
      - name: Remove one-shot patch files
        run: git rm scripts/patch-information-density.py scripts/patch-information-density-v2.py scripts/patch-information-density-v3.py scripts/patch-information-density-v4.py .github/workflows/information-density-one-shot.yml .github/workflows/information-density-one-shot-v2.yml .github/workflows/information-density-one-shot-v3.yml .github/workflows/information-density-one-shot-v4.yml
      - name: Commit validated redesign
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/server/managementPage.ts scripts/qa-management-page.ts
          if git diff --cached --quiet; then
            echo "No validated changes to commit"
          else
            git commit -m "ui: enrich learner teacher and researcher dashboards"
            git push origin HEAD:codex/information-density-ui
          fi
