name: Codex fix research start-date scope

on:
  push:
    branches:
      - codex/fix-research-start-date-scope

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fix-research-start-date-scope
          fetch-depth: 0
      - name: Apply classification fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/server/researchDashboard.ts')
          text = p.read_text()
          old = "export type ResearchDataScope = 'main' | 'pilot_b' | 'test' | 'reserve';\nconst PILOT_B_OFFICIAL_DATES = new Set(['2026-09-09']);\nexport function researchDataScopeForRow(row: Record<string, unknown>): ResearchDataScope {\n  const storedClass = String(row.class_id || '');\n  const localDate = String(row.local_date || '');\n  if (storedClass === 'テスト') return 'test';\n  if (storedClass === '予備') return 'reserve';\n  if (storedClass === '5-PB' || storedClass === '6-PB') return PILOT_B_OFFICIAL_DATES.has(localDate) ? 'pilot_b' : 'test';\n  return 'main';\n}\n"
          new = "export type ResearchDataScope = 'main' | 'pilot_b' | 'test' | 'reserve';\nexport const MAIN_RESEARCH_START_DATE = '2026-09-17';\nconst PILOT_B_OFFICIAL_DATES = new Set(['2026-09-09']);\nexport function researchDataScopeForRow(row: Record<string, unknown>): ResearchDataScope {\n  const storedClass = String(row.class_id || '');\n  const localDate = String(row.local_date || '');\n  if (storedClass === 'テスト') return 'test';\n  if (storedClass === '予備') return 'reserve';\n  if (storedClass === '5-PB' || storedClass === '6-PB') return PILOT_B_OFFICIAL_DATES.has(localDate) ? 'pilot_b' : 'test';\n  if (/^[56]-[123]$/.test(storedClass)) return localDate >= MAIN_RESEARCH_START_DATE ? 'main' : 'test';\n  return 'test';\n}\n"
          if text.count(old) != 1:
              raise SystemExit('research scope block mismatch')
          p.write_text(text.replace(old, new, 1))
          Path('.github/workflows/codex-fix-research-start-date-scope.yml').unlink()
          PY
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Full QA
        run: npm run qa
      - name: Production build
        run: npm run build
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: keep pre-study sessions out of main research data"
          git push origin HEAD:codex/fix-research-start-date-scope
