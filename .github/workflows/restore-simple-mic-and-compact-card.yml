name: Restore simple microphone flow and compact dialogue card

on:
  push:
    paths:
      - '.github/workflows/restore-simple-mic-and-compact-card.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore setup screen before microphone preflight UI
        run: |
          git checkout bb0983d80fdf6af373f57978c1dcbed805e97d55 -- src/components/SetupScreen.tsx
      - name: Compact AI student card without losing speech speed control
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/components/AIStudentCard.tsx')
          s=p.read_text()
          s=s.replace("import { Volume2, Sparkles, Flag } from 'lucide-react';", "import { Volume2, Sparkles } from 'lucide-react';")
          s=s.replace("  latestCulturalNote,\n", "")
          marker="""      <div className=\"w-full bg-slate-50 border border-slate-200/80 rounded-2xl p-2.5 text-left\">\n        <div className=\"flex items-center gap-1 text-[10px] font-bold text-slate-500 uppercase tracking-wider\">\n          <Flag className=\"w-3 h-3 text-blue-600\" />\n          <span>{student.accentName}</span>\n        </div>\n        {latestCulturalNote && (\n          <p className=\"text-[10px] text-blue-800 bg-blue-50/80 p-1.5 rounded-lg mt-1.5 font-medium border border-blue-200/60\">\n            💡 {latestCulturalNote}\n          </p>\n        )}\n      </div>\n"""
          if marker not in s:
              raise SystemExit('Expected lower info block not found')
          s=s.replace(marker, """      <p className=\"text-[10px] text-slate-500 font-semibold leading-tight\">\n        {student.accentName}\n      </p>\n""")
          # Tighten vertical space while keeping avatar/profile/speed control readable.
          s=s.replace('rounded-3xl p-4 sm:p-5', 'rounded-3xl p-3.5 sm:p-4')
          s=s.replace('relative mt-5 mb-3', 'relative mt-4 mb-2')
          s=s.replace('w-28 h-28 sm:w-32 sm:h-32', 'w-24 h-24 sm:w-28 sm:h-28')
          s=s.replace('max-w-xs mb-3', 'max-w-xs mb-2')
          s=s.replace('<div className="mb-3">{getStatusBadge()}</div>', '<div className="mb-2">{getStatusBadge()}</div>')
          s=s.replace('rounded-2xl p-3 mb-3', 'rounded-2xl p-2.5 mb-2')
          p.write_text(s)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run qa:dialogue
      - run: npm run build
      - name: Verify microphone preflight is gone
        run: |
          ! grep -q "getUserMedia" src/components/SetupScreen.tsx
          ! grep -q "マイク・音声入力をテスト" src/components/SetupScreen.tsx
          grep -q "handleToggleRecording" src/App.tsx
          grep -q "recognition.start()" src/App.tsx
          grep -q 'min="0.75"' src/components/AIStudentCard.tsx
          grep -q 'max="1.25"' src/components/AIStudentCard.tsx
      - name: Commit production fix
        run: |
          git config user.name "danksmash"
          git config user.email "danksmash@gmail.com"
          git add src/components/SetupScreen.tsx src/components/AIStudentCard.tsx
          git commit -m "Restore simple click-to-speak flow and compact dialogue card"
          git push
