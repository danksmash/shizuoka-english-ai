name: Deploy ASR tablet preview

on:
  push:
    branches:
      - preview/asr-tablet-20260914

permissions:
  contents: read
  id-token: write

concurrency:
  group: asr-tablet-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Full QA and production build
        run: |
          npm run qa
          npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/1075707511474/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-actions-deploy@shizuoka-english-ai.iam.gserviceaccount.com
          project_id: shizuoka-english-ai

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: shizuoka-english-ai
          version: '>= 416.0.0'

      - name: Deploy isolated preview service
        run: |
          BUILD_SHA="${GITHUB_SHA:0:12}"
          gcloud run deploy shizuoka-english-ai-asr-preview \
            --project shizuoka-english-ai \
            --source . \
            --region asia-northeast1 \
            --allow-unauthenticated \
            --min-instances 0 \
            --max-instances 2 \
            --concurrency 20 \
            --timeout 60 \
            --memory 512Mi \
            --update-env-vars ANTHROPIC_MODEL=claude-sonnet-5,APP_VERSION=1.0.7-asr-preview,APP_BUILD="$BUILD_SHA",AZURE_SPEECH_REGION=japaneast \
            --update-secrets ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest,AZURE_SPEECH_KEY=AZURE_SPEECH_KEY:latest

      - name: Preview smoke and print URL
        run: |
          PREVIEW_URL=$(gcloud run services describe shizuoka-english-ai-asr-preview \
            --project shizuoka-english-ai \
            --region asia-northeast1 \
            --format='value(status.url)')
          echo "PREVIEW_URL=$PREVIEW_URL"
          test -n "$PREVIEW_URL"
          health=$(curl --fail --silent --show-error --max-time 20 "$PREVIEW_URL/api/health")
          echo "$health" | grep -q '"status":"ok"'
          echo "$health" | grep -q '"aiConfigured":true'
          echo "$health" | grep -q '"azureTtsConfigured":true'
          echo "$health" | grep -q '"learningDataConfigured":false'
          curl --fail --silent --show-error --max-time 20 "$PREVIEW_URL/" >/dev/null
