name: Apply and verify Pilot B ASR fix

on:
  push:
    branches:
      - fix/pilot-b-asr-lexicon-20260909
    paths:
      - 'scripts/apply-pilot-b-asr-fix.mjs'
      - '.github/workflows/apply-pilot-b-asr-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply Pilot B ASR patch
        run: |
          python3 - <<'PY'
          p='scripts/apply-pilot-b-asr-fix.mjs'
          s=open(p,encoding='utf-8').read()
          s=s.replace("recordResearchEvent('asr_contextual_correction', \\`${result.category || 'unknown'}:${result.candidate}\\`);", "recordResearchEvent('asr_contextual_correction', (result.category || 'unknown') + ':' + result.candidate);")
          open(p,'w',encoding='utf-8').write(s)
          PY
          node scripts/apply-pilot-b-asr-fix.mjs
      - name: Contextual ASR targeted QA
        run: npm run qa:contextual-asr
      - name: Full QA and production build
        run: |
          npm run qa
          npm run build
      - name: Commit verified implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/utils/contextualAsr.ts src/utils/speech.ts src/App.tsx src/dataContract.ts scripts/qa-contextual-asr.ts
          git commit -m 'fix: improve Pilot B ASR for local words and proper nouns'
          git push origin HEAD:fix/pilot-b-asr-lexicon-20260909
