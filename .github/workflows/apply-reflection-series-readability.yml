name: Apply reflection series readability fix
on:
  push:
    branches:
      - codex/fix-reflection-series-readability
permissions:
  contents: write
jobs:
  patch-test-commit:
    if: "!contains(github.event.head_commit.message, 'fix: improve reflection chart series readability')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fix-reflection-series-readability
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: python3 scripts/patch-reflection-series-readability.py
      - run: npm run qa
      - run: npm run build
      - name: Commit verified app changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "418982+github-actions[bot]@users.noreply.github.com"
          git add src/server/managementPage.ts scripts/qa-dashboard-data-sync.ts
          git commit -m "fix: improve reflection chart series readability"
          git push
