name: One-shot stage2 server patch
on:
  push:
    branches: [codex/reflection-ui-finalize]
    paths:
      - scripts/patch-stage2-server.py
      - .github/workflows/stage2-patch.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/reflection-ui-finalize
      - name: Apply server patch
        run: python3 scripts/patch-stage2-server.py
      - name: Commit patched server and remove one-shot files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/patch-stage2-server.py .github/workflows/stage2-patch.yml
          git add server.ts
          git commit -m "server: connect class and learner-code lifecycle APIs"
          git push origin HEAD:codex/reflection-ui-finalize
