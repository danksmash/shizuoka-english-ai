name: PR3 TTS provider attribution

on:
  push:
    branches:
      - codex/pr3-azure-primary
    paths:
      - '.github/workflows/pr3-tts-attribution.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/pr3-azure-primary
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Update TTS attribution only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/utils/speech.ts')
          s=p.read_text()
          s=s.replace(
            ' * Text to Speech with Google Cloud Chirp 3 HD as the primary voice.\n * The original device voice remains as a fallback so a TTS outage cannot stop a lesson.\n',
            ' * Text to Speech using the server-selected cloud provider.\n * Provider order: Azure Speech -> Google Chirp 3 HD -> device fallback.\n',1)
          s=s.replace(
            "  onProvider?: (provider: 'google-chirp3-hd' | 'device-fallback', effectiveRate: number) => void\n",
            "  onProvider?: (provider: 'azure-speech' | 'google-chirp3-hd' | 'device-fallback', effectiveRate: number) => void\n",1)
          s=s.replace(
            "      console.warn('Google Cloud TTS unavailable; using device TTS fallback:', error);",
            "      console.warn('Cloud TTS unavailable; using device TTS fallback:', error);",1)
          old="      onProvider?.('google-chirp3-hd', Number(response.headers.get('X-TTS-Effective-Rate') || rate));\n"
          new="      const cloudProvider = response.headers.get('X-TTS-Provider') === 'azure-speech' ? 'azure-speech' : 'google-chirp3-hd';\n      onProvider?.(cloudProvider, Number(response.headers.get('X-TTS-Effective-Rate') || rate));\n"
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Verify recognition logic untouched
        run: |
          git diff -- src/utils/speech.ts > /tmp/speech.diff
          if grep -E '^[-+].*(SpeechRecognition|recognition\.|\.onend|onresult|interimResults|continuous)' /tmp/speech.diff; then
            echo 'SpeechRecognition-related line changed.'
            exit 1
          fi
      - name: Full QA and build
        run: |
          npm ci --no-audit --no-fund
          npm run qa
          npm run build
      - name: Commit attribution fix
        run: |
          git config user.name danksmash
          git config user.email danksmash@gmail.com
          git add src/utils/speech.ts
          git commit -m 'fix: record actual Azure or Chirp TTS provider'
          git fetch origin codex/pr3-azure-primary
          git rebase origin/codex/pr3-azure-primary
          git push origin HEAD:codex/pr3-azure-primary
