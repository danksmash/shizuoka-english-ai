name: Apply public repair

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-public-repair.py'
      - '.github/workflows/apply-public-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply repair
        run: python3 scripts/apply-public-repair.py

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Production build with public API URL
        env:
          VITE_API_BASE_URL: https://shizuoka-english-ai-1075707511474.asia-northeast1.run.app
        run: npm run build

      - name: Verify repair invariants
        run: |
          set -e
          grep -q "VITE_API_BASE_URL" src/App.tsx
          ! grep -q "fetch('/api/chat'" src/App.tsx
          grep -q "Access-Control-Allow-Origin" server.ts
          grep -q "studentTranslationStatus" server.ts
          grep -q "日本語に訳せませんでした。" src/App.tsx
          grep -q "uniqueKeyPhrases" src/components/FeedbackScreen.tsx
          grep -q "max-w-\[220px\]" src/components/SetupScreen.tsx

      - name: Commit repaired application
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/utils/translation.ts src/components/FeedbackScreen.tsx src/components/SetupScreen.tsx server.ts .github/workflows/pages.yml
          git commit -m "fix: repair public AI connection and dialogue report" || exit 0
          git push
