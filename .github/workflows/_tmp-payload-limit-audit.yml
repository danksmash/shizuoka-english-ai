name: Temporary production payload limit audit
on:
  push:
    branches: [codex/research-final-privacy-completeness]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Verify large session payload behavior without writing
        shell: bash
        run: |
          set -euo pipefail
          API='https://shizuoka-english-ai-1075707511474.asia-northeast1.run.app'
          python3 - <<'PY'
          import json,time
          now=int(time.time()*1000)
          h=[]
          for i in range(20):
              h.append({'id':f'child-{i}','sender':'child','englishText':'I like soccer because it is fun. How about you?','japaneseText':'私はサッカーが好きです。楽しいからです。あなたはどうですか？','timestamp':now+i*1000,'wordCount':10})
              h.append({'id':f'ai-{i}','sender':'ai','englishText':'I like soccer too. I play with my friends after school.','japaneseText':'私もサッカーが好きです。放課後に友達と一緒にします。','timestamp':now+i*1000+500})
          p={'sessionId':'audit_session_payload_12345678','learningCode':'Z9Q7','aiStudentId':'emma_usa','topic':'favorites','targetDurationMinutes':5,'startedAt':now,'endedAt':now+300000,'history':h,'encounteredVocab':[],'systemEvents':[{'type':'mic_start','timestamp':now+i*1000} for i in range(20)]}
          raw=json.dumps(p,ensure_ascii=False).encode()
          print('PAYLOAD_BYTES='+str(len(raw)))
          open('payload.json','wb').write(raw)
          PY
          status=$(curl --silent --show-error -o response.txt -w '%{http_code}' -X POST "$API/api/sessions" -H 'Content-Type: application/json' --data-binary @payload.json)
          echo "HTTP_STATUS=$status"
          cat response.txt || true
          [[ "$status" == '413' ]]
          echo 'PRODUCTION_10KB_SESSION_LIMIT_CONFIRMED=YES'
