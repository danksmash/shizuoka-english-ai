name: Azure v2 post-rotation clean canary

on:
  push:
    branches:
      - codex/azure-voice-v2-golden-speed
    paths:
      - '.github/workflows/azure-v2-postrotation-clean-canary.yml'

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT: shizuoka-english-ai
  GCP_REGION: asia-northeast1
  CANARY_SERVICE: shizuoka-english-ai-voice-v2-postrotation

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/azure-voice-v2-golden-speed

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/1075707511474/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-actions-deploy@shizuoka-english-ai.iam.gserviceaccount.com
          project_id: shizuoka-english-ai

      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: shizuoka-english-ai

      - name: Deploy isolated canary with Secret Manager references only
        shell: bash
        run: |
          set -euo pipefail
          gcloud run deploy "$CANARY_SERVICE" \
            --project "$GCP_PROJECT" \
            --source . \
            --region "$GCP_REGION" \
            --allow-unauthenticated \
            --min-instances 0 \
            --max-instances 10 \
            --concurrency 40 \
            --timeout 60 \
            --memory 512Mi \
            --update-env-vars ANTHROPIC_MODEL=claude-sonnet-5,SESSION_RETENTION_DAYS=1095,APP_VERSION=azure-v2-postrotation,APP_BUILD="${GITHUB_SHA:0:12}" \
            --update-secrets ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest,AZURE_SPEECH_KEY=AZURE_SPEECH_KEY:latest
          URL=$(gcloud run services describe "$CANARY_SERVICE" --project "$GCP_PROJECT" --region "$GCP_REGION" --format='value(status.url)')
          test -n "$URL"
          case "$URL" in *shizuoka-english-ai-1075707511474.asia-northeast1.run.app*) echo 'Refusing production service'; exit 1;; esac
          echo "CANARY_URL=$URL" >> "$GITHUB_ENV"

      - name: Verify Claude and 20 Azure personas
        shell: bash
        run: |
          set -euo pipefail
          health=$(curl --fail --silent --max-time 30 "$CANARY_URL/api/health")
          echo "$health" | grep -q '"status":"ok"'
          echo "$health" | grep -q '"azureTtsConfigured":true'
          chat=$(curl --fail --silent --max-time 50 -X POST "$CANARY_URL/api/chat" -H 'Content-Type: application/json' --data '{"message":"Hello!","history":[],"topic":"intro","aiStudentId":"emma_usa"}')
          echo "$chat" | grep -q '"success":true'
          personas=(emma_usa oliver_uk liam_australia minji_korea pavel_belarus lukas_germany aina_malaysia dimas_indonesia bence_hungary yuting_taiwan zofia_poland matas_lithuania ananya_india xinyi_china linh_vietnam rahul_bangladesh nadeesha_srilanka suman_nepal amara_nigeria andrei_romania)
          for p in "${personas[@]}"; do
            h=$(mktemp); a=$(mktemp)
            code=$(curl --silent --max-time 30 -D "$h" -o "$a" -w '%{http_code}' -X POST "$CANARY_URL/api/tts" -H 'Content-Type: application/json' --data "{\"text\":\"Hello! Nice to meet you.\",\"aiStudentId\":\"$p\",\"speakingRate\":1.0}")
            test "$code" = 200
            grep -qi 'x-tts-provider: azure-speech' "$h"
            grep -qi 'x-tts-effective-rate: 1.00' "$h"
            test "$(wc -c < "$a")" -gt 500
          done

      - name: Run 70-user isolated headroom check
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/v2post && mkdir -p /tmp/v2post
          personas=(emma_usa oliver_uk liam_australia minji_korea pavel_belarus lukas_germany aina_malaysia dimas_indonesia bence_hungary yuting_taiwan zofia_poland matas_lithuania ananya_india xinyi_china linh_vietnam rahul_bangladesh nadeesha_srilanka suman_nepal amara_nigeria andrei_romania)
          for i in $(seq 1 70); do
            p=${personas[$(( (i-1) % 20 ))]}
            (
              start=$(date +%s%3N)
              code=$(curl --silent --max-time 40 -o "/tmp/v2post/$i.mp3" -w '%{http_code}' -X POST "$CANARY_URL/api/tts" -H 'Content-Type: application/json' --data "{\"text\":\"Hello! Nice to meet you. What do you like?\",\"aiStudentId\":\"$p\",\"speakingRate\":1.0}")
              end=$(date +%s%3N)
              echo "$i,$p,$code,$((end-start)),$(wc -c < /tmp/v2post/$i.mp3)" > "/tmp/v2post/$i.csv"
            ) &
          done
          wait
          cat /tmp/v2post/*.csv | sort -t, -k1,1n > /tmp/v2post/results.csv
          python3 - <<'PY'
          import csv
          rows=list(csv.reader(open('/tmp/v2post/results.csv')))
          assert len(rows)==70, len(rows)
          codes=[r[2] for r in rows]
          assert all(c=='200' for c in codes), {c:codes.count(c) for c in set(codes)}
          sizes=[int(r[4]) for r in rows]
          assert min(sizes)>500
          lats=sorted(int(r[3]) for r in rows)
          p95=lats[max(0,int(len(lats)*0.95)-1)]
          print(f'70/70 success, 429=0, p95={p95}ms, max={max(lats)}ms')
          PY

      - name: Delete isolated canary
        if: always()
        shell: bash
        run: |
          gcloud run services delete "$CANARY_SERVICE" --project "$GCP_PROJECT" --region "$GCP_REGION" --quiet || true
