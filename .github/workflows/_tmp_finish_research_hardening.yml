name: Temporary finish research hardening
on:
  push:
    branches: [codex/research-data-hardening]
permissions:
  contents: write
jobs:
  finish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/research-data-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply final integrity patch
        run: python3 scripts/_tmp_finish_research_hardening.py
      - name: Full QA and production build
        run: |
          npm run qa
          npm run build
      - name: Commit code only
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/App.tsx src/server/persistence.ts src/server/researchExport.ts scripts/qa-research-integrated.ts
          git commit -m "fix: complete research identity and longitudinal safeguards"
          git push origin HEAD:codex/research-data-hardening
