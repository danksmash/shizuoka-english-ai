name: Production acceptance test

on:
  push:
    branches:
      - codex/production-acceptance

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - name: Public production acceptance
        shell: bash
        run: |
          set -euo pipefail
          API='https://shizuoka-english-ai-1075707511474.asia-northeast1.run.app'
          PAGES='https://danksmash.github.io/shizuoka-english-ai/'

          echo '[1] Health/configuration'
          health=$(curl -fsS --max-time 20 "$API/api/health")
          echo "$health" | grep -q '"status":"ok"'
          echo "$health" | grep -q '"aiConfigured":true'
          echo "$health" | grep -q '"ttsProvider":"google-chirp3-hd"'
          echo "$health" | grep -q '"learningDataConfigured":true'
          echo "$health" | grep -q '"managementConfigured":true'

          echo '[2] GitHub Pages and management UI delivery'
          pages=$(curl -fsSL --max-time 20 "$PAGES")
          echo "$pages" | grep -q '<div id="root"></div>'
          mgmt=$(curl -fsSL --max-time 20 "$API/management")
          echo "$mgmt" | grep -q 'teacherDashboard'
          echo "$mgmt" | grep -q 'researchDashboard'
          echo "$mgmt" | grep -q 'codeManagement'

          echo '[3] Anthropic production dialogue'
          chat=$(curl -fsS --max-time 50 -X POST "$API/api/chat" -H 'Content-Type: application/json' --data '{"message":"Hello! I like soccer. How about you?","history":[],"topic":"favorites","aiStudentId":"emma_usa"}')
          echo "$chat" | grep -q '"success":true'
          echo "$chat" | grep -q '"route":"anthropic-resilient"'
          echo "$chat" | grep -q '"isFallback":false'

          echo '[4] Google Chirp 3 HD - all 9 personas'
          for student in emma_usa oliver_uk liam_australia chloe_canada bence_hungary zofia_poland rahul_bangladesh linh_vietnam aung_myanmar; do
            headers=$(mktemp)
            audio=$(mktemp)
            status=$(curl -sS --max-time 25 -D "$headers" -o "$audio" -w '%{http_code}' -X POST "$API/api/tts" -H 'Content-Type: application/json' --data "{\"text\":\"Hello. Nice to meet you.\",\"aiStudentId\":\"$student\",\"speakingRate\":0.95}")
            test "$status" = '200'
            grep -qi 'content-type: audio/mpeg' "$headers"
            grep -qi 'x-tts-provider: google-chirp3-hd' "$headers"
            test "$(wc -c < "$audio")" -gt 500
            rm -f "$headers" "$audio"
          done

          echo '[5] Four-character learner-code contract'
          status3=$(curl -sS -o /tmp/code3.json -w '%{http_code}' -X POST "$API/api/student/resolve" -H 'Content-Type: application/json' --data '{"learningCode":"A7M"}')
          test "$status3" = '400'
          grep -q 'INVALID_LEARNING_CODE' /tmp/code3.json
          status5=$(curl -sS -o /tmp/code5.json -w '%{http_code}' -X POST "$API/api/student/resolve" -H 'Content-Type: application/json' --data '{"learningCode":"A7M45"}')
          test "$status5" = '400'
          grep -q 'INVALID_LEARNING_CODE' /tmp/code5.json

          echo '[6] Unknown valid-format learner code rejected without data disclosure'
          found_unknown=0
          for code in Z9Z9 Q8Q8 X7X7 V6V6; do
            status=$(curl -sS -o /tmp/unknown.json -w '%{http_code}' -X POST "$API/api/student/history" -H 'Content-Type: application/json' --data "{\"learningCode\":\"$code\"}")
            if [ "$status" = '401' ] && grep -q 'LEARNING_CODE_NOT_FOUND' /tmp/unknown.json; then
              found_unknown=1
              break
            fi
          done
          test "$found_unknown" = '1'

          echo '[7] Management APIs require authentication'
          s1=$(curl -sS -o /tmp/mgmt_sessions.json -w '%{http_code}' "$API/api/management/sessions")
          test "$s1" = '401'
          grep -q 'UNAUTHORIZED' /tmp/mgmt_sessions.json
          s2=$(curl -sS -o /tmp/research.csv -w '%{http_code}' "$API/api/management/research.csv")
          test "$s2" = '401'
          grep -q 'UNAUTHORIZED' /tmp/research.csv
          s3=$(curl -sS -o /tmp/codes.json -w '%{http_code}' "$API/api/management/student-codes")
          test "$s3" = '401'
          grep -q 'UNAUTHORIZED' /tmp/codes.json

          echo '[8] Invalid management credentials rejected'
          login_status=$(curl -sS -o /tmp/login.json -w '%{http_code}' -X POST "$API/api/management/login" -H 'Content-Type: application/json' --data '{"username":"acceptance-invalid-user","password":"acceptance-invalid-password"}')
          test "$login_status" = '401'
          grep -q 'INVALID_CREDENTIALS' /tmp/login.json

          echo 'PRODUCTION ACCEPTANCE: PASS (public and unauthenticated security paths)'

# rerun after production fix
