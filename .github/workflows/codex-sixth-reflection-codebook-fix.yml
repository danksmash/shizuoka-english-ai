name: Codex verify sixth CSV codebook consistency

on:
  push:
    branches:
      - codex/research-sixth-reflection-csv

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/research-sixth-reflection-csv
          fetch-depth: 0
      - name: Align codebook export and dashboard count
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); text=p.read_text(); count=text.count(old)
              if count != 1: raise SystemExit(f'{path}: expected one match, got {count}')
              p.write_text(text.replace(old,new,1))

          replace_once(
            'server.ts',
            "    const lessonReflectionRowCount=buildResearchLessonReflectionRows(lessonReflections,normalizeFormalResearchExportQuery(req.query)).length;\n    res.setHeader('Cache-Control','no-store');return res.json({...dashboard,lessonReflectionRowCount});",
            "    const lessonReflectionRowCount=buildResearchLessonReflectionRows(lessonReflections,normalizeFormalResearchExportQuery(req.query)).length;\n    const lessonCodebookCount=buildResearchLessonReflectionCodebookRows().length;\n    const exportFiles=dashboard.exportFiles.map((file:any)=>file.dataset==='codebook'?{...file,rowCount:Number(file.rowCount||0)+lessonCodebookCount}:file);\n    res.setHeader('Cache-Control','no-store');return res.json({...dashboard,exportFiles,lessonReflectionRowCount});"
          )

          replace_once(
            'server.ts',
            "    const allowed=['sessions','utterances','expressions','personas','codebook'] as const;",
            "    if(requested==='codebook'){\n      const datasets=buildResearchExportDataSets([]);\n      const rows=[...datasets.codebook,...buildResearchLessonReflectionCodebookRows()];\n      const csv=serializeResearchCsv(rows,'codebook');\n      res.setHeader('Content-Type','text/csv; charset=utf-8');res.setHeader('Content-Disposition','attachment; filename=\"codebook.csv\"');res.setHeader('Cache-Control','no-store');return res.send(csv);\n    }\n    const allowed=['sessions','utterances','expressions','personas','codebook'] as const;"
          )

          replace_once(
            'scripts/qa-research-lesson-reflection-bundle.ts',
            "assert.ok(server.includes('buildResearchLessonReflectionCodebookRows()'), 'bundle codebook must include lesson Reflection definitions');",
            "assert.ok(server.includes('buildResearchLessonReflectionCodebookRows()'), 'bundle codebook must include lesson Reflection definitions');\nassert.ok(server.includes(\"requested==='codebook'\"), 'individual codebook.csv must include sixth-file definitions too');\nassert.ok(server.includes(\"file.dataset==='codebook'\"), 'dashboard codebook row count must include sixth-file definitions');"
          )

          Path('.github/workflows/codex-sixth-reflection-codebook-fix.yml').unlink()
          PY
      - run: npm ci --no-audit --no-fund
      - name: Full QA
        run: npm run qa
      - name: Production build
        run: npm run build
      - name: Commit verified integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: keep six-file research codebook consistent"
          git push origin HEAD:codex/research-sixth-reflection-csv
