name: Apply dialogue fixes

on:
  push:
    paths:
      - 'scripts/apply-dialogue-fixes.mjs'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply audited fixes
        run: node scripts/apply-dialogue-fixes.mjs
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/components/DialogueView.tsx src/utils/speech.ts server.ts
          git diff --cached --check
          git commit -m "fix: tighten microphone, translation, and dialogue flow"
          git push origin HEAD:main
