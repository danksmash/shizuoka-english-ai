name: Study 1 roster 145 migration

on:
  push:
    branches:
      - fix/study1-roster-145-20260911
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: shizuoka-english-ai

jobs:
  migrate-and-audit:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/1075707511474/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-actions-deploy@shizuoka-english-ai.iam.gserviceaccount.com
          project_id: shizuoka-english-ai

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: shizuoka-english-ai

      - name: Apply hashed 169-ID roster mapping and audit 145 Study 1 pupils
        shell: bash
        run: |
          set -euo pipefail
          export ACCESS_TOKEN="$(gcloud auth print-access-token)"
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';

          const project = process.env.PROJECT_ID;
          const token = process.env.ACCESS_TOKEN;
          const base = `https://firestore.googleapis.com/v1/projects/${project}/databases/(default)/documents`;
          const mapping = JSON.parse(fs.readFileSync('.github/study1-roster-169-hashed.json','utf8'));
          const expectedStudy = new Map([['5-1',26],['5-2',25],['5-3',25],['6-1',34],['6-2',35]]);

          const fieldString = (f, key) => f?.[key]?.stringValue || '';
          const fieldBool = (f, key) => f?.[key]?.booleanValue;
          const fieldInt = (f, key) => {
            const raw = f?.[key]?.integerValue ?? f?.[key]?.doubleValue;
            const n = Number(raw);
            return Number.isInteger(n) ? n : null;
          };
          const sha = (s) => crypto.createHash('sha256').update(String(s)).digest('hex');
          if (!Array.isArray(mapping) || mapping.length !== 169) throw new Error(`INVALID_MAPPING_SIZE:${mapping?.length}`);
          if (new Set(mapping.map(r=>r.h)).size !== 169) throw new Error('DUPLICATE_MAPPING_HASH');

          async function listStudents() {
            let pageToken = '';
            const docs = [];
            do {
              const url = new URL(`${base}/students`);
              url.searchParams.set('pageSize','1000');
              if (pageToken) url.searchParams.set('pageToken',pageToken);
              const res = await fetch(url, {headers:{Authorization:`Bearer ${token}`}});
              if (!res.ok) throw new Error(`LIST_STUDENTS_${res.status}:${await res.text()}`);
              const json = await res.json();
              docs.push(...(json.documents || []));
              pageToken = json.nextPageToken || '';
            } while (pageToken);
            return docs;
          }

          async function patchRosterDoc(docName, expected) {
            const url = new URL(`https://firestore.googleapis.com/v1/${docName}`);
            for (const field of ['classId','attendanceNumber','updatedAt']) url.searchParams.append('updateMask.fieldPaths', field);
            const fields = {
              classId: {stringValue: expected.c},
              updatedAt: {stringValue: new Date().toISOString()},
            };
            if (expected.a !== null) fields.attendanceNumber = {integerValue:String(expected.a)};
            const res = await fetch(url, {
              method:'PATCH',
              headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'},
              body:JSON.stringify({fields}),
            });
            if (!res.ok) throw new Error(`PATCH_STUDENT_${res.status}:${await res.text()}`);
          }

          function activeRows(docs) {
            const grouped = new Map();
            for (const doc of docs) {
              const f = doc.fields || {};
              const studentId = fieldString(f,'studentId');
              if (!studentId || fieldBool(f,'active') === false) continue;
              const row = {
                name:doc.name,
                studentId,
                researchId:fieldString(f,'researchId'),
                classId:fieldString(f,'classId'),
                attendanceNumber:fieldInt(f,'attendanceNumber'),
                updatedAt:fieldString(f,'updatedAt'),
              };
              const current = grouped.get(studentId);
              if (!current || row.updatedAt > current.updatedAt) grouped.set(studentId,row);
            }
            return [...grouped.values()];
          }

          let docs = await listStudents();
          const docsByHash = new Map();
          for (const doc of docs) {
            const sid = fieldString(doc.fields || {},'studentId');
            if (!sid) continue;
            const h = sha(sid);
            const list = docsByHash.get(h) || [];
            list.push(doc);
            docsByHash.set(h,list);
          }

          const missing = mapping.filter(row=>!docsByHash.has(row.h));
          if (missing.length) throw new Error(`MAPPED_STUDENTS_NOT_FOUND:${missing.length}`);
          let changedStudents = 0;
          for (const expected of mapping) {
            const targetDocs = docsByHash.get(expected.h) || [];
            let studentChanged = false;
            for (const doc of targetDocs) {
              const f = doc.fields || {};
              const currentClass = fieldString(f,'classId');
              const currentAttendance = fieldInt(f,'attendanceNumber');
              const attendanceMatches = expected.a === null ? currentAttendance === null : currentAttendance === expected.a;
              if (currentClass !== expected.c || !attendanceMatches) {
                await patchRosterDoc(doc.name, expected);
                studentChanged = true;
              }
            }
            if (studentChanged) changedStudents += 1;
          }
          console.log(`Roster mappings applied/changed: ${changedStudents}`);

          docs = await listStudents();
          const active = activeRows(docs);
          const activeByHash = new Map(active.map(r=>[sha(r.studentId),r]));
          for (const expected of mapping) {
            const actual = activeByHash.get(expected.h);
            if (!actual) throw new Error('MAPPED_STUDENT_NOT_ACTIVE');
            if (actual.classId !== expected.c) throw new Error(`MAPPED_CLASS_MISMATCH:${expected.c}`);
            if (expected.a !== null && actual.attendanceNumber !== expected.a) throw new Error(`MAPPED_ATTENDANCE_MISMATCH:${expected.c}:${expected.a}`);
            if (expected.a === null && actual.attendanceNumber !== null) throw new Error(`NONMAIN_ATTENDANCE_NOT_EMPTY:${expected.c}`);
          }

          const mappedActive = mapping.map(row=>activeByHash.get(row.h));
          const researchIds = mappedActive.map(r=>r.researchId).filter(Boolean);
          if (researchIds.length !== 169 || new Set(researchIds).size !== 169) throw new Error('RESEARCH_ID_169_NOT_UNIQUE');

          let studyTotal = 0;
          for (const [classId,count] of expectedStudy) {
            const rows = mappedActive.filter(r=>r.classId===classId);
            studyTotal += rows.length;
            const attendance = rows.map(r=>r.attendanceNumber).sort((a,b)=>(a??999)-(b??999));
            const expectedAttendance = Array.from({length:count},(_,i)=>i+1);
            const attendanceOk = JSON.stringify(attendance) === JSON.stringify(expectedAttendance);
            const classResearch = rows.map(r=>r.researchId).filter(Boolean);
            const researchUnique = classResearch.length === count && new Set(classResearch).size === count;
            console.log(`${classId}: active=${rows.length}/${count} attendance=${attendanceOk?'OK':'NG'} research_id=${researchUnique?'OK':'NG'}`);
            if (rows.length !== count) throw new Error(`ROSTER_COUNT_MISMATCH_${classId}`);
            if (!attendanceOk) throw new Error(`ATTENDANCE_MISMATCH_${classId}`);
            if (!researchUnique) throw new Error(`RESEARCH_ID_MISMATCH_${classId}`);
          }
          if (studyTotal !== 145) throw new Error(`TOTAL_STUDY_ROSTER_MISMATCH:${studyTotal}`);
          const reserves = mappedActive.filter(r=>r.classId==='予備').length;
          const tests = mappedActive.filter(r=>r.classId==='テスト').length;
          if (reserves !== 14) throw new Error(`RESERVE_GUEST_COUNT_MISMATCH:${reserves}`);
          if (tests !== 10) throw new Error(`TEST_COUNT_MISMATCH:${tests}`);
          const sixThree = active.filter(r=>r.classId==='6-3').length;
          if (sixThree !== 0) throw new Error(`UNEXPECTED_6_3_STUDENTS:${sixThree}`);
          console.log(`Non-main: reserve/guest=${reserves}, test=${tests}`);
          console.log('STUDY1_PRODUCTION_ROSTER_145_PASS');
          NODE
