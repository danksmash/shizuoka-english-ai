name: Fix speech rate default
on:
  push:
    paths:
      - '.github/workflows/fix-speech-rate-default.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set classroom default to 1.00
        run: |
          python -c "from pathlib import Path; p=Path('src/App.tsx'); s=p.read_text(); old='const [speechRate, setSpeechRate] = useState<number>(0.9);'; new='const [speechRate, setSpeechRate] = useState<number>(1.0);'; assert old in s, 'speechRate default not found'; p.write_text(s.replace(old,new,1))"
          grep -q "useState<number>(1.0)" src/App.tsx
          grep -q "onInput={(e) => updateSpeechRate" src/components/AIStudentCard.tsx
          grep -q 'min="0.75"' src/components/AIStudentCard.tsx
          grep -q 'max="1.25"' src/components/AIStudentCard.tsx
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run qa:dialogue
      - run: npm run build
      - name: Commit production fix
        run: |
          rm -f .github/workflows/fix-speech-rate-default.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx .github/workflows/fix-speech-rate-default.yml
          git commit -m "Set speech speed default to 1.00 and verify slider"
          git push
