name: One-time fallback code cleanup

on:
  push:
    paths:
      - '.github/workflows/one-time-fallback-code-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove unused conversation fallback implementation
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('src/utils/feedbackFallback.ts')
          s = p.read_text(encoding='utf-8')

          old_import = "import { AIStudentProfile, FeedbackData, VisualVocabularyItem, ChatMessage, DialogueTopic } from '../types';"
          new_import = "import { AIStudentProfile, FeedbackData, VisualVocabularyItem, ChatMessage } from '../types';"
          if old_import not in s:
              raise SystemExit('feedbackFallback.ts: expected import line not found')
          s = s.replace(old_import, new_import, 1)

          pattern = r"\nexport interface LocalDialogueResponse[\s\S]*?\n/\*\*\n \* Generates dynamic feedback strictly based on real conversation history"
          replacement = "\n/**\n * Generates dynamic feedback strictly based on real conversation history"
          s2, count = re.subn(pattern, replacement, s, count=1)
          if count != 1:
              raise SystemExit('feedbackFallback.ts: local conversation fallback block not found')
          p.write_text(s2, encoding='utf-8')

      - name: Verify no local dialogue generator remains
        run: |
          ! grep -R "generateLocalStudentDialogueReply\|LocalDialogueResponse\|PERSONA_CULTURE_MAP" -n src server.ts

      - name: Commit cleanup and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/one-time-fallback-code-cleanup.yml
          git add src/utils/feedbackFallback.ts .github/workflows/one-time-fallback-code-cleanup.yml
          git diff --cached --check
          git commit -m "refactor: remove dead conversation fallback engine"
          git push
