name: One-time comparison production audit 2026-10-06

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-comparison-production-audit-20261006.yml'

permissions:
  contents: read
  id-token: write

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/1075707511474/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-actions-deploy@shizuoka-english-ai.iam.gserviceaccount.com
          project_id: shizuoka-english-ai

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: shizuoka-english-ai
          version: '>= 416.0.0'

      - name: Audit comparison metadata and today's sessions
        shell: bash
        run: |
          set -euo pipefail
          export ACCESS_TOKEN="$(gcloud auth print-access-token)"
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request, collections
          token=os.environ['ACCESS_TOKEN']
          root='https://firestore.googleapis.com/v1/projects/shizuoka-english-ai/databases/(default)/documents'
          def val(v):
              if not isinstance(v,dict): return None
              if 'stringValue' in v:return v['stringValue']
              if 'booleanValue' in v:return bool(v['booleanValue'])
              if 'integerValue' in v:return int(v['integerValue'])
              if 'doubleValue' in v:return float(v['doubleValue'])
              if 'timestampValue' in v:return v['timestampValue']
              if 'nullValue' in v:return None
              return None
          def docs(collection):
              out=[]; page=''
              while True:
                  url=f'{root}/{collection}?pageSize=1000'+(('&pageToken='+urllib.parse.quote(page)) if page else '')
                  req=urllib.request.Request(url,headers={'Authorization':'Bearer '+token})
                  with urllib.request.urlopen(req,timeout=30) as r:data=json.load(r)
                  out.extend(data.get('documents',[])); page=data.get('nextPageToken','')
                  if not page:return out
          students=[]
          for d in docs('students'):
              f={k:val(v) for k,v in d.get('fields',{}).items()}
              if f.get('classId') in ('6-C1','6-C1-R'): students.append(f)
          pupils=[s for s in students if s.get('classId')=='6-C1']
          reserve=[s for s in students if s.get('classId')=='6-C1-R']
          formal=[s for s in pupils if s.get('formalStudyParticipant') is True]
          starts=collections.Counter(str(s.get('studyStartDate') or '') for s in pupils)
          conditions=collections.Counter(str(s.get('schoolCondition') or '') for s in pupils)
          sites=collections.Counter(str(s.get('studySiteId') or '') for s in pupils)
          sessions=[]
          for d in docs('sessions'):
              f={k:val(v) for k,v in d.get('fields',{}).items()}
              if f.get('classId')=='6-C1' and f.get('localDate')=='2026-10-06': sessions.append(f)
          research_ids=set(str(s.get('researchId') or '') for s in pupils if s.get('researchId'))
          session_rids=[str(s.get('researchId') or '') for s in sessions]
          linked=sum(1 for rid in session_rids if rid in research_ids)
          start_dates={str(s.get('researchId') or ''):str(s.get('studyStartDate') or '') for s in pupils}
          formal_by_rid={str(s.get('researchId') or ''):s.get('formalStudyParticipant') is True for s in pupils}
          condition_by_rid={str(s.get('researchId') or ''):str(s.get('schoolCondition') or '') for s in pupils}
          classified_main=0; classified_test=0
          for sess in sessions:
              rid=str(sess.get('researchId') or '')
              if formal_by_rid.get(rid) and condition_by_rid.get(rid)=='comparison':
                  sd=start_dates.get(rid,'')
                  if not sd or '2026-10-06'>=sd: classified_main+=1
                  else: classified_test+=1
              else: classified_test+=1
          print(f'AUDIT_6C1 pupils={len(pupils)} reserve={len(reserve)} formal={len(formal)} active={sum(1 for s in pupils if s.get("active") is not False)}')
          print('AUDIT_6C1_START_DATES '+json.dumps(starts,ensure_ascii=False,sort_keys=True))
          print('AUDIT_6C1_CONDITIONS '+json.dumps(conditions,ensure_ascii=False,sort_keys=True))
          print('AUDIT_6C1_SITES '+json.dumps(sites,ensure_ascii=False,sort_keys=True))
          print(f'AUDIT_2026_10_06 sessions={len(sessions)} linked_to_6C1_roster={linked} classified_main={classified_main} classified_test={classified_test}')
          if len(pupils)!=28 or len(reserve)!=1:
              raise SystemExit('ROSTER_COUNT_MISMATCH')
          PY
