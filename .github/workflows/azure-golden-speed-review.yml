name: Azure Golden Speed voice review

on:
  push:
    branches:
      - codex/azure-voice-v2-golden-speed
    paths:
      - '.github/workflows/azure-golden-speed-review.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  review-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GCP_PROJECT: shizuoka-english-ai
      GCP_REGION: asia-northeast1
      CANARY_SERVICE: shizuoka-english-ai-voice-review
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/azure-voice-v2-golden-speed
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Full QA and production build
        run: |
          npm ci --no-audit --no-fund
          npm run qa
          npm run build

      - name: Verify protected areas unchanged from main
        run: |
          git fetch origin main:refs/remotes/origin/main
          git diff --exit-code origin/main -- src/components src/data/curriculum.ts src/dataContract.ts src/server/persistence.ts src/server/auth.ts src/utils/security.ts
          if git diff origin/main -- src/utils/speech.ts | grep -E '^[-+].*(SpeechRecognition|webkitSpeechRecognition|\.onend|onresult|interimResults|continuous)'; then
            echo 'SpeechRecognition-protected lines changed.'
            exit 1
          fi

      - name: Verify exact Gate 4 Golden Speed implementation
        run: |
          npx tsx scripts/qa-azure-primary.ts
          ! grep -E '<prosody[[:space:]]+rate=' src/server/azureTts.ts
          ! grep -q 'ratePercent' src/server/azureTts.ts
          grep -q 'AZURE_GOLDEN_EFFECTIVE_RATE = 1.0' src/server/azureTts.ts

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/1075707511474/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-actions-deploy@shizuoka-english-ai.iam.gserviceaccount.com
          project_id: shizuoka-english-ai

      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: shizuoka-english-ai
          version: '>= 416.0.0'

      - name: Deploy isolated review canary
        run: |
          gcloud run deploy "$CANARY_SERVICE" \
            --project "$GCP_PROJECT" --source . --region "$GCP_REGION" \
            --allow-unauthenticated --min-instances 0 --max-instances 3 \
            --concurrency 40 --timeout 60 --memory 512Mi \
            --update-env-vars ANTHROPIC_MODEL=claude-sonnet-5,SESSION_RETENTION_DAYS=1095,APP_VERSION=voice-review,APP_BUILD="${GITHUB_SHA:0:12}" \
            --update-secrets ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest,AZURE_SPEECH_KEY=AZURE_SPEECH_KEY:latest
          URL=$(gcloud run services describe "$CANARY_SERVICE" --project "$GCP_PROJECT" --region "$GCP_REGION" --format='value(status.url)')
          test -n "$URL"
          case "$URL" in *shizuoka-english-ai-1075707511474.asia-northeast1.run.app*) echo 'Refusing production service'; exit 1;; esac
          echo "CANARY_URL=$URL" >> "$GITHUB_ENV"
          echo "Review canary: $URL"

      - name: Health and Claude smoke
        run: |
          health=''
          for i in 1 2 3 4 5 6; do health=$(curl --fail --silent --max-time 20 "$CANARY_URL/api/health") && break || sleep 4; done
          echo "$health" | grep -q '"status":"ok"'
          echo "$health" | grep -q '"ttsProvider":"azure-speech"'
          echo "$health" | grep -q '"azureTtsConfigured":true'
          chat=$(curl --fail --silent --max-time 50 -X POST "$CANARY_URL/api/chat" -H 'Content-Type: application/json' --data '{"message":"Hello!","history":[],"topic":"intro","aiStudentId":"emma_usa"}')
          echo "$chat" | grep -q '"success":true'

      - name: Verify all 20 voices at Golden Speed
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/voice-review
          personas=(emma_usa oliver_uk liam_australia minji_korea pavel_belarus lukas_germany aina_malaysia dimas_indonesia bence_hungary yuting_taiwan zofia_poland matas_lithuania ananya_india xinyi_china linh_vietnam rahul_bangladesh nadeesha_srilanka suman_nepal amara_nigeria andrei_romania)
          for student in "${personas[@]}"; do
            headers="/tmp/voice-review/${student}.headers"
            audio="/tmp/voice-review/${student}.mp3"
            status=$(curl --silent --max-time 25 -D "$headers" -o "$audio" -w '%{http_code}' -X POST "$CANARY_URL/api/tts" -H 'Content-Type: application/json' --data "{\"text\":\"Hello! Nice to meet you. I'm happy to talk with you today.\",\"aiStudentId\":\"$student\",\"speakingRate\":0.75}")
            test "$status" = 200
            grep -qi 'x-tts-provider: azure-speech' "$headers"
            grep -qi 'x-tts-effective-rate: 1.00' "$headers"
            test "$(wc -c < "$audio")" -gt 500
            file "$audio" | grep -qi 'MPEG'
          done
          test "$(find /tmp/voice-review -name '*.mp3' | wc -l)" -eq 20
          echo '20/20 Azure Golden Speed MP3 checks passed.'

      - name: Upload 20-voice listening package
        uses: actions/upload-artifact@v4
        with:
          name: azure-golden-speed-20-voice-review
          path: /tmp/voice-review/*.mp3
          retention-days: 7

      - name: Keep canary for human Chromebook review
        run: |
          echo "CANARY_URL=$CANARY_URL"
          echo 'Canary intentionally remains deployed until human listening is complete.'
