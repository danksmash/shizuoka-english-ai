name: Audit class 1 round 3 ASR aggregate 20261002

on:
  push:
    branches:
      - 'audit/class1-round3-20261002'
    paths:
      - '.github/workflows/audit-class1-round3-asr-aggregate-20261002.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/1075707511474/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-actions-deploy@shizuoka-english-ai.iam.gserviceaccount.com
          project_id: shizuoka-english-ai
      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: shizuoka-english-ai
          version: '>= 416.0.0'
      - name: Aggregate indicators only
        env:
          GOOGLE_CLOUD_PROJECT: shizuoka-english-ai
          FIRESTORE_DATABASE_ID: '(default)'
        run: |
          sed -i "s/\['1','3'\]/['5-1','5-3']/g; s/dateCounts\['1'\]/dateCounts['5-1']/g; s/dateCounts\['3'\]/dateCounts['5-3']/g; s/class_id==='1'/class_id==='5-1'/g" scripts/audit-class1-round3-20261002.ts
          npx tsx scripts/audit-class1-round3-20261002.ts > /tmp/audit.log
          node <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('/tmp/audit.log','utf8');
          const j=JSON.parse(s.split('CLASS1_ROUND3_AUDIT_BEGIN')[1].split('CLASS1_ROUND3_AUDIT_END')[0]);
          const rows=j.target_class1?.per_session||[];
          const tokens=['google','tonight','dot','minecraft'];
          const tokenStats={};
          for(const token of tokens){
            let total=0, sessions=0, maxInSession=0; const people=new Set();
            for(const r of rows){
              const joined=(r.child_texts||[]).join(' ').toLowerCase();
              const n=(joined.match(new RegExp('\\b'+token+'\\b','g'))||[]).length;
              if(n){total+=n;sessions++;maxInSession=Math.max(maxInSession,n);people.add(r.participant);}
            }
            tokenStats[token]={total_occurrences:total,sessions_with_token:sessions,participants_with_token:people.size,max_occurrences_one_session:maxInSession};
          }
          const repeat={sessions_ge_1:rows.filter(r=>r.exact_repeat_turns>=1).length,sessions_ge_2:rows.filter(r=>r.exact_repeat_turns>=2).length,sessions_ge_3:rows.filter(r=>r.exact_repeat_turns>=3).length,max_one_session:Math.max(0,...rows.map(r=>r.exact_repeat_turns||0))};
          console.log(JSON.stringify({tokenStats,repeat},null,2));
          NODE
