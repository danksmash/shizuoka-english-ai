name: Temporary read-only study schedule audit 20261001

on:
  push:
    branches:
      - analysis-20260929b
    paths:
      - '.github/workflows/read-study-schedule-20261001.yml'

permissions:
  contents: read
  id-token: write

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/1075707511474/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-actions-deploy@shizuoka-english-ai.iam.gserviceaccount.com
          project_id: shizuoka-english-ai
      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: shizuoka-english-ai
      - name: Read 5-3 study schedule
        shell: bash
        run: |
          mkdir -p schedule-output
          TOKEN=$(gcloud auth print-access-token)
          curl -fsSL -H "Authorization: Bearer $TOKEN" "https://firestore.googleapis.com/v1/projects/shizuoka-english-ai/databases/%28default%29/documents/study_schedules/5-3" > schedule-output/5-3.json
      - uses: actions/upload-artifact@v4
        with:
          name: study-schedule-5-3-20261001
          path: schedule-output/5-3.json
          retention-days: 1
