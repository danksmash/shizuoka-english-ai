name: Gate 9 - Azure primary full regression

on:
  push:
    branches:
      - codex/pr3-azure-primary
    paths:
      - '.github/workflows/azure-speech-gate9.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  gate9:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CANARY_SERVICE: shizuoka-english-ai-gate9-canary
      GCP_PROJECT: shizuoka-english-ai
      GCP_REGION: asia-northeast1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/pr3-azure-primary
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install and full regression
        run: |
          npm ci --no-audit --no-fund
          npx tsx scripts/qa-azure-primary.ts
          npm run qa
          npm run build
      - name: Verify protected areas and device fallback
        run: |
          git fetch origin main:refs/remotes/origin/main
          git diff --exit-code origin/main -- src/components src/data/curriculum.ts src/dataContract.ts src/server/persistence.ts src/server/auth.ts src/utils/security.ts
          if git diff origin/main -- src/utils/speech.ts | grep -E '^[-+].*(SpeechRecognition|webkitSpeechRecognition|\.onend|onresult|interimResults|continuous)'; then
            echo 'SpeechRecognition-protected lines changed.'
            exit 1
          fi
          grep -q "onProvider?.('device-fallback'" src/utils/speech.ts
          grep -q "speakStudentVoiceLocal" src/utils/speech.ts
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/1075707511474/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-actions-deploy@shizuoka-english-ai.iam.gserviceaccount.com
          project_id: shizuoka-english-ai
      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: shizuoka-english-ai
          version: '>= 416.0.0'
      - name: Allow Cloud Run runtime to access Azure secret
        run: |
          gcloud secrets add-iam-policy-binding AZURE_SPEECH_KEY \
            --project "$GCP_PROJECT" \
            --member='serviceAccount:1075707511474-compute@developer.gserviceaccount.com' \
            --role='roles/secretmanager.secretAccessor' >/dev/null
      - name: Deploy isolated Gate 9 canary
        run: |
          gcloud run deploy "$CANARY_SERVICE" \
            --project "$GCP_PROJECT" --source . --region "$GCP_REGION" \
            --allow-unauthenticated --min-instances 0 --max-instances 10 \
            --concurrency 80 --timeout 60 --memory 512Mi \
            --update-env-vars ANTHROPIC_MODEL=claude-sonnet-5,SESSION_RETENTION_DAYS=1095,APP_VERSION=gate9-canary,APP_BUILD="${GITHUB_SHA:0:12}" \
            --update-secrets ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest,AZURE_SPEECH_KEY=AZURE_SPEECH_KEY:latest
          URL=$(gcloud run services describe "$CANARY_SERVICE" --project "$GCP_PROJECT" --region "$GCP_REGION" --format='value(status.url)')
          test -n "$URL"
          case "$URL" in *shizuoka-english-ai-1075707511474.asia-northeast1.run.app*) exit 1;; esac
          echo "CANARY_URL=$URL" >> "$GITHUB_ENV"
      - name: Health and Claude smoke
        run: |
          health=''
          for i in 1 2 3 4 5 6; do health=$(curl --fail --silent --max-time 20 "$CANARY_URL/api/health") && break || sleep 4; done
          echo "$health" | grep -q '"status":"ok"'
          echo "$health" | grep -q '"ttsProvider":"azure-speech"'
          echo "$health" | grep -q '"azureTtsConfigured":true'
          chat=$(curl --fail --silent --max-time 50 -X POST "$CANARY_URL/api/chat" -H 'Content-Type: application/json' --data '{"message":"Hello!","history":[],"topic":"intro","aiStudentId":"emma_usa"}')
          echo "$chat" | grep -q '"success":true'
          echo "$chat" | grep -q '"route":"anthropic-resilient"'
      - name: Azure primary all 20 personas
        run: |
          for student in emma_usa oliver_uk liam_australia minji_korea pavel_belarus lukas_germany aina_malaysia dimas_indonesia bence_hungary yuting_taiwan zofia_poland matas_lithuania ananya_india xinyi_china linh_vietnam rahul_bangladesh nadeesha_srilanka suman_nepal amara_nigeria andrei_romania; do
            h=$(mktemp); a=$(mktemp)
            status=$(curl --silent --max-time 20 -D "$h" -o "$a" -w '%{http_code}' -X POST "$CANARY_URL/api/tts" -H 'Content-Type: application/json' --data "{\"text\":\"Hello. Nice to meet you.\",\"aiStudentId\":\"$student\",\"speakingRate\":0.95}")
            test "$status" = 200
            grep -qi 'x-tts-provider: azure-speech' "$h"
            test "$(wc -c < "$a")" -gt 500
            rm -f "$h" "$a"
          done
      - name: Verify Azure to Chirp fallback
        run: |
          gcloud run services update "$CANARY_SERVICE" --project "$GCP_PROJECT" --region "$GCP_REGION" --update-env-vars AZURE_SPEECH_REGION=invalid-region >/dev/null
          sleep 5
          URL=$(gcloud run services describe "$CANARY_SERVICE" --project "$GCP_PROJECT" --region "$GCP_REGION" --format='value(status.url)')
          h=$(mktemp); a=$(mktemp)
          status=$(curl --silent --max-time 25 -D "$h" -o "$a" -w '%{http_code}' -X POST "$URL/api/tts" -H 'Content-Type: application/json' --data '{"text":"Hello. Nice to meet you.","aiStudentId":"emma_usa","speakingRate":0.95}')
          test "$status" = 200
          grep -qi 'x-tts-provider: google-chirp3-hd' "$h"
          grep -qi 'x-tts-fallback-from: azure-speech' "$h"
          test "$(wc -c < "$a")" -gt 500
      - name: Remove Gate 9 canary
        if: always()
        run: gcloud run services delete "$CANARY_SERVICE" --project "$GCP_PROJECT" --region "$GCP_REGION" --quiet || true
