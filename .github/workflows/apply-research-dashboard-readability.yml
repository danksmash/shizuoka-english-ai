      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Full QA
        run: npm run qa
      - name: Production build
        run: npm run build
      - name: Real Chrome researcher dashboard QA
        shell: bash
        run: |
          npm install --no-save --package-lock=false playwright-core@1.55.0 >/dev/null 2>&1
          npx tsx -e "import fs from 'node:fs'; import { managementPageHtml } from './src/server/managementPage.ts'; fs.writeFileSync('/tmp/research-dashboard.html', managementPageHtml());"
          cat > /tmp/research-browser-qa.mjs <<'JS'
          import fs from 'node:fs';
          import { chromium } from 'playwright-core';
          const candidates=['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium','/usr/bin/chromium-browser'];
          const executablePath=candidates.find(fs.existsSync); if(!executablePath) throw new Error('Chrome executable not found');
          const sample={success:true,metrics:{participantCount:128,totalSessions:384,childUtteranceCount:9842,meanChildWordsPerMinute:18.4,completeRate:98.7,latestAt:'2026-09-03 14:32:00'},filters:{personas:['emma_usa','oliver_uk','liam_australia','chloe_canada','bence_hungary','zofia_poland','rahul_bangladesh','linh_vietnam','aung_myanmar']},charts:{aggregation:'daily',daily:[{date:'2026-09-01',sessions:45,mean_child_words_per_minute:17.2,reflection_conveyed:3.1,reflection_understood:3.2,reflection_culture:3.0},{date:'2026-09-02',sessions:52,mean_child_words_per_minute:19.1,reflection_conveyed:3.4,reflection_understood:3.5,reflection_culture:3.3}],personas:[{label:'Emma Johnson',value:45},{label:'Rahul Hasan',value:30}]},dataQuality:[{label:'complete',value:379}],systemQuality:[{label:'AI応答失敗',value:0},{label:'マイクエラー',value:1},{label:'TTSフォールバック',value:0}],topExpressions:[{expression:'surfing',count:5,source:'persona'}],recentSessions:[],exportFiles:[{dataset:'sessions',fileName:'sessions.csv',contains:'session data',analysisUse:'analysis',rowCount:384},{dataset:'utterances',fileName:'utterances.csv',contains:'utterances',analysisUse:'analysis',rowCount:1000},{dataset:'expressions',fileName:'expressions.csv',contains:'expressions',analysisUse:'analysis',rowCount:300},{dataset:'personas',fileName:'personas.csv',contains:'personas',analysisUse:'analysis',rowCount:9},{dataset:'codebook',fileName:'codebook.csv',contains:'variables',analysisUse:'analysis',rowCount:180}]};
          const filtered=structuredClone(sample);filtered.metrics={...sample.metrics,totalSessions:120,meanChildWordsPerMinute:12.3};
          const browser=await chromium.launch({headless:true,executablePath,args:['--no-sandbox']});
          for(const viewport of [{width:1920,height:1080},{width:1536,height:900},{width:1366,height:900},{width:1024,height:900},{width:768,height:900},{width:390,height:844}]){
            const page=await browser.newPage({viewport});
            await page.addInitScript(({sample,filtered})=>{window.fetch=async(url)=>{const s=String(url);const data=s.includes('/api/health')?{appVersion:'1.0.7',build:'test'}:s.includes('/api/management/login')?{role:'researcher'}:s.includes('/api/management/research.dashboard')&&s.includes('grade=5')?filtered:sample;return {ok:true,status:200,json:async()=>data};};},{sample,filtered});
            await page.goto('file:///tmp/research-dashboard.html');
            await page.fill('#u','researcher');await page.fill('#p','test');await page.click('#loginBtn');await page.waitForTimeout(250);
            const overflow=await page.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth);if(overflow>1)throw new Error(`horizontal overflow ${overflow}px at ${viewport.width}`);
            if(await page.locator('[data-nav]').count())throw new Error('removed top navigation buttons are still present');
            if(await page.locator('#chartCircle').count())throw new Error('circle graph still present');
            if((await page.locator('#mWordsPerMinute').textContent())!=='18.4')throw new Error('words/min top metric mismatch');
            if(await page.locator('#chartWords .svg-value').count()<2)throw new Error('words/min graph numeric labels missing');
            if(await page.locator('#chartReflection .svg-value').count()<3)throw new Error('reflection graph numeric labels missing');
            const grade=await page.locator('#grade option').allTextContents();if(JSON.stringify(grade)!==JSON.stringify(['すべて','５年','６年','テスト','予備']))throw new Error('grade options mismatch '+JSON.stringify(grade));
            const classes=await page.locator('#classId option').allTextContents();if(JSON.stringify(classes)!==JSON.stringify(['すべて','１組','２組','３組','テスト','予備']))throw new Error('class options mismatch '+JSON.stringify(classes));
            const label=await page.locator('#labelCondition option').allTextContents();if(JSON.stringify(label)!==JSON.stringify(['すべて','表示あり','表示なし']))throw new Error('label condition options mismatch '+JSON.stringify(label));
            const topics=await page.locator('#topic option').allTextContents();if(topics.length!==6)throw new Error('all five themes plus all must be present');
            const font=Number.parseFloat(await page.locator('#chartDaily .svg-label').first().evaluate(el=>getComputedStyle(el).fontSize));if(font<12)throw new Error('graph label font too small '+font);
            const filterFont=Number.parseFloat(await page.locator('.filters label').first().evaluate(el=>getComputedStyle(el).fontSize));if(filterFont<13)throw new Error('filter label font too small '+filterFont);
            const expression=await page.locator('#topExpressions').textContent();if(!expression?.includes('surfing')||!expression.includes('プロフィール辞書')||expression.includes('(persona)'))throw new Error('child expression source wording mismatch');
            await page.selectOption('#grade','5');await page.waitForTimeout(350);if((await page.locator('#mWordsPerMinute').textContent())!=='12.3')throw new Error('filter change did not refresh dashboard immediately');
            const badButtons=await page.locator('button:visible').evaluateAll((els)=>els.filter(el=>{const r=el.getBoundingClientRect();return r.left<-1||r.right>window.innerWidth+1}).map(el=>el.textContent));if(badButtons.length)throw new Error('button overflow '+JSON.stringify(badButtons));
            await page.close();
          }
          await browser.close();console.log('Real Chrome researcher dashboard readability/filter QA: PASS');
          JS
          node /tmp/research-browser-qa.mjs
      - name: Verify student app protected files unchanged
        shell: bash
        run: |
          git diff origin/main -- src/App.tsx src/components src/utils/speech.ts src/data/curriculum.ts src/assets/images | cat
          test -z "$(git diff --name-only origin/main -- src/App.tsx src/components src/utils/speech.ts src/data/curriculum.ts src/assets/images)"
      - name: Commit validated changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No code changes to commit"
            exit 0
          fi
          git config user.name "danksmash"
          git config user.email "danksmash@gmail.com"
          git add src/server/researchDashboard.ts src/server/managementPage.ts scripts/qa-dashboard-data-sync.ts scripts/qa-research-export-complete.ts
          git commit -m "fix: improve researcher dashboard readability and filters"
          git push origin HEAD:codex/research-dashboard-readability-filters
