name: Azure remaining 15 voice review

on:
  push:
    branches:
      - codex/azure-voice-v2-golden-speed
    paths:
      - 'scripts/azure-voice-remaining15-review.mjs'
      - '.github/workflows/azure-remaining15-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/azure-voice-v2-golden-speed
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate remaining 15 comparison audio
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: japaneast
        run: node scripts/azure-voice-remaining15-review.mjs
      - name: Validate package
        run: |
          test -f azure-remaining15-review/index.html
          test -f azure-remaining15-review/manifest.json
          test "$(find azure-remaining15-review/audio -name '*.mp3' | wc -l)" -eq 30
          node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('azure-remaining15-review/manifest.json')); if(m.rows.length!==30) process.exit(1); for(const r of m.rows){if(!fs.existsSync('azure-remaining15-review/'+r.file)) throw new Error(r.file)}"
      - name: Upload review package
        uses: actions/upload-artifact@v4
        with:
          name: azure-remaining15-review
          path: azure-remaining15-review/
          retention-days: 7
