name: Temporary research v3 compatibility verification
on:
  push:
    branches:
      - codex/research-integrated-data-v3
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/research-integrated-data-v3
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: python3 scripts/_fix_research_v3_compat.py
      - run: npm ci
      - run: npm run qa
      - run: npm run build
      - run: rm -f scripts/_fix_research_v3_compat.py .github/workflows/_tmp-research-v3-compat.yml
      - name: Commit verified compatibility fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: preserve research dashboard export compatibility"
          git push origin codex/research-integrated-data-v3
