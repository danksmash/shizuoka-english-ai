name: Implement Reflection teacher filter alignment

on:
  push:
    branches:
      - fix/reflection-teacher-filter-alignment-20260910
    paths:
      - '.github/workflows/implement-reflection-teacher-filter-alignment.yml'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reflection-teacher-filter-alignment-20260910
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Apply filter alignment
        shell: bash
        run: |
          set -euo pipefail
          cat > src/server/reflectionTeacherModel.ts <<'EOF'
          import type { ReflectionRecord } from './reflectionPersistence';

          export interface TeacherRosterStudent {
            studentId: string;
            learningId: string;
            classId: string;
            attendanceNumber: number | '';
            active: boolean;
          }

          export type ReflectionTeacherDataScope = 'all' | 'main' | 'pilot_b' | 'test' | 'reserve';
          export type ReflectionTeacherGrade = 'all' | '5' | '6';
          export type ReflectionTeacherClassNumber = 'all' | '1' | '2' | '3';
          type ConcreteDataScope = Exclude<ReflectionTeacherDataScope, 'all'>;
          type ConcreteGrade = Exclude<ReflectionTeacherGrade, 'all'> | '';
          type ConcreteClassNumber = Exclude<ReflectionTeacherClassNumber, 'all'> | '';

          export interface TeacherReflectionFilterQuery {
            dataScope?: unknown;
            grade?: unknown;
            classNumber?: unknown;
            // Backward compatibility for an older cached teacher bundle.
            classId?: unknown;
          }

          export interface TeacherReflectionStudentRow {
            learningId: string;
            classId: string;
            dataScope: ConcreteDataScope;
            grade: ConcreteGrade;
            classNumber: ConcreteClassNumber;
            attendanceNumber: number | '';
            status: 'submitted' | 'draft' | 'missing';
            reflectionCharCount: number;
            todayGoal: string;
            goalRating: number | null;
            selfRegulationRating: number | null;
            reflectionText: string;
            updatedAt: string;
          }

          export interface TeacherReflectionDashboard {
            localDate: string;
            dataScope: ReflectionTeacherDataScope;
            grade: ReflectionTeacherGrade;
            classNumber: ReflectionTeacherClassNumber;
            // Retained for compatibility with a previously deployed client.
            classId: string;
            classes: string[];
            counts: { total: number; submitted: number; draft: number; missing: number };
            students: TeacherReflectionStudentRow[];
          }

          export function reflectionDataScopeForClassId(value: unknown): ConcreteDataScope {
            const classId = typeof value === 'string' ? value.trim() : '';
            if (classId === '5-PB' || classId === '6-PB') return 'pilot_b';
            if (classId === 'テスト') return 'test';
            if (classId === '予備') return 'reserve';
            return 'main';
          }

          export function reflectionGradeForClassId(value: unknown): ConcreteGrade {
            const classId = typeof value === 'string' ? value.trim() : '';
            if (classId.startsWith('5-')) return '5';
            if (classId.startsWith('6-')) return '6';
            return '';
          }

          export function reflectionClassNumberForClassId(value: unknown): ConcreteClassNumber {
            const classId = typeof value === 'string' ? value.trim() : '';
            const match = classId.match(/^[56]-([123])$/);
            return match ? match[1] as ConcreteClassNumber : '';
          }

          function safeDate(value: unknown, fallback: string): string {
            const text = typeof value === 'string' ? value.trim() : '';
            return /^\d{4}-\d{2}-\d{2}$/.test(text) ? text : fallback;
          }

          function safeClass(value: unknown): string {
            return typeof value === 'string' ? value.trim().slice(0, 40) : '';
          }

          function normalizeFilters(value: TeacherReflectionFilterQuery | string | undefined) {
            const query: TeacherReflectionFilterQuery = typeof value === 'string' ? { classId: value } : (value || {});
            const legacyClassId = safeClass(query.classId);
            const rawScope = typeof query.dataScope === 'string' ? query.dataScope.trim() : '';
            const rawGrade = typeof query.grade === 'string' ? query.grade.trim() : '';
            const rawClassNumber = typeof query.classNumber === 'string' ? query.classNumber.trim() : '';
            const dataScope: ReflectionTeacherDataScope = ['all','main','pilot_b','test','reserve'].includes(rawScope)
              ? rawScope as ReflectionTeacherDataScope
              : legacyClassId ? 'all' : 'main';
            const grade: ReflectionTeacherGrade = ['5','6'].includes(rawGrade) ? rawGrade as ReflectionTeacherGrade : 'all';
            const classNumber: ReflectionTeacherClassNumber = ['1','2','3'].includes(rawClassNumber) ? rawClassNumber as ReflectionTeacherClassNumber : 'all';
            return { dataScope, grade, classNumber, legacyClassId };
          }

          function membershipMatches(classId: string, filters: ReturnType<typeof normalizeFilters>): boolean {
            if (filters.legacyClassId) return classId === filters.legacyClassId;
            if (filters.dataScope !== 'all' && reflectionDataScopeForClassId(classId) !== filters.dataScope) return false;
            if (filters.grade !== 'all' && reflectionGradeForClassId(classId) !== filters.grade) return false;
            if (filters.classNumber !== 'all' && reflectionClassNumberForClassId(classId) !== filters.classNumber) return false;
            return true;
          }

          function legacySixPartText(record: ReflectionRecord): string {
            const parts: Array<[string, string]> = [
              ['できたこと', record.achievements],
              ['使ったことば', record.languageUsed],
              ['授業中に考えていたこと', record.thinking],
              ['困ったこと・工夫', record.difficultyStrategy],
              ['言葉や文化について気づいたこと', record.languageCultureAwareness],
              ['次に頑張りたいこと', record.nextGoal],
            ];
            return parts.filter(([, text]) => text).map(([label, text]) => `【${label}】\n${text}`).join('\n\n');
          }

          function visibleReflectionText(record: ReflectionRecord | undefined): string {
            if (!record) return '';
            return record.reflectionText || legacySixPartText(record);
          }

          export function buildTeacherReflectionDashboard(
            roster: TeacherRosterStudent[],
            records: ReflectionRecord[],
            requestedDate: unknown,
            requestedFilters: TeacherReflectionFilterQuery | string | undefined,
            today: string,
          ): TeacherReflectionDashboard {
            const localDate = safeDate(requestedDate, today);
            const filters = normalizeFilters(requestedFilters);
            const activeRoster = roster.filter((student) => student.active && student.learningId && student.classId);
            const classes = Array.from(new Set(activeRoster.map((student) => student.classId))).sort((a, b) => a.localeCompare(b, 'ja'));
            const selectedRoster = activeRoster.filter((student) => membershipMatches(student.classId, filters));
            const allowedStudentIds = new Set(selectedRoster.map((student) => student.studentId));
            const recordsByStudent = new Map<string, ReflectionRecord>();
            for (const record of records) {
              if (record.localDate !== localDate || !allowedStudentIds.has(record.studentId)) continue;
              const current = recordsByStudent.get(record.studentId);
              if (!current || record.updatedAt > current.updatedAt) recordsByStudent.set(record.studentId, record);
            }
            const students: TeacherReflectionStudentRow[] = selectedRoster.map((student): TeacherReflectionStudentRow => {
              const record = recordsByStudent.get(student.studentId);
              const status: TeacherReflectionStudentRow['status'] = record?.status === 'submitted' ? 'submitted' : record ? 'draft' : 'missing';
              return {
                learningId: student.learningId,
                classId: student.classId,
                dataScope: reflectionDataScopeForClassId(student.classId),
                grade: reflectionGradeForClassId(student.classId),
                classNumber: reflectionClassNumberForClassId(student.classId),
                attendanceNumber: student.attendanceNumber,
                status,
                reflectionCharCount: record?.reflectionCharCount || 0,
                todayGoal: record?.todayGoal || '',
                goalRating: record?.goalRating ?? null,
                selfRegulationRating: record?.selfRegulationRating ?? null,
                reflectionText: visibleReflectionText(record),
                updatedAt: record?.updatedAt || '',
              };
            }).sort((a, b) => a.classId.localeCompare(b.classId, 'ja') || Number(a.attendanceNumber || 999) - Number(b.attendanceNumber || 999) || a.learningId.localeCompare(b.learningId));
            return {
              localDate,
              dataScope: filters.dataScope,
              grade: filters.grade,
              classNumber: filters.classNumber,
              classId: filters.legacyClassId,
              classes,
              counts: {
                total: students.length,
                submitted: students.filter((row) => row.status === 'submitted').length,
                draft: students.filter((row) => row.status === 'draft').length,
                missing: students.filter((row) => row.status === 'missing').length,
              },
              students,
            };
          }

          function csvCell(value: unknown): string {
            let text = String(value ?? '').replace(/\r\n/g, '\n').replace(/\r/g, '\n');
            if (/^\s*[=+\-@]/.test(text)) text = `'${text}`;
            return `"${text.replace(/"/g, '""')}"`;
          }

          export function serializeTeacherReflectionCsv(
            roster: TeacherRosterStudent[],
            records: ReflectionRecord[],
            requestedDate: unknown,
            requestedFilters: TeacherReflectionFilterQuery | string | undefined,
          ): string {
            const filters = normalizeFilters(requestedFilters);
            const dateText = typeof requestedDate === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(requestedDate) ? requestedDate : '';
            const rosterByStudent = new Map(roster.map((student) => [student.studentId, student]));
            const rows = records
              .filter((record) => membershipMatches(record.classId, filters) && (!dateText || record.localDate === dateText))
              .sort((a, b) => a.localDate.localeCompare(b.localDate) || a.classId.localeCompare(b.classId, 'ja') || (rosterByStudent.get(a.studentId)?.learningId || '').localeCompare(rosterByStudent.get(b.studentId)?.learningId || ''));
            const headers = [
              'local_date', 'class_id', 'data_scope', 'grade_level', 'class_number', 'learning_id', 'attendance_number', 'status', 'today_goal',
              'goal_rating', 'self_regulation_rating', 'reflection_text', 'reflection_char_count',
              'revision', 'created_at', 'updated_at', 'submitted_at',
              'achievements', 'language_used', 'thinking', 'difficulty_strategy', 'language_culture_awareness', 'next_goal',
            ];
            const lines = [headers.map(csvCell).join(',')];
            for (const record of rows) {
              const rosterStudent = rosterByStudent.get(record.studentId);
              lines.push([
                record.localDate,
                record.classId,
                reflectionDataScopeForClassId(record.classId),
                reflectionGradeForClassId(record.classId),
                reflectionClassNumberForClassId(record.classId),
                rosterStudent?.learningId || record.learningId,
                rosterStudent?.attendanceNumber || '',
                record.status,
                record.todayGoal,
                record.goalRating ?? '',
                record.selfRegulationRating ?? '',
                visibleReflectionText(record),
                record.reflectionCharCount,
                record.revision,
                record.createdAt,
                record.updatedAt,
                record.submittedAt,
                record.achievements,
                record.languageUsed,
                record.thinking,
                record.difficultyStrategy,
                record.languageCultureAwareness,
                record.nextGoal,
              ].map(csvCell).join(','));
            }
            return `\uFEFF${lines.join('\r\n')}\r\n`;
          }

          export function buildTeacherStudentHistory(
            roster: TeacherRosterStudent[],
            records: ReflectionRecord[],
            learningId: string,
          ): { learningId: string; classId: string; dataScope: ConcreteDataScope; grade: ConcreteGrade; classNumber: ConcreteClassNumber; attendanceNumber: number | ''; history: Array<Omit<ReflectionRecord, 'studentId' | 'researchId' | 'classId' | 'learningId'>> } | null {
            const normalized = learningId.trim().toUpperCase();
            const student = roster.find((row) => row.active && row.learningId === normalized);
            if (!student) return null;
            const history = records
              .filter((record) => record.studentId === student.studentId)
              .sort((a, b) => b.localDate.localeCompare(a.localDate))
              .map(({ studentId: _studentId, researchId: _researchId, classId: _classId, learningId: _learningId, ...safe }) => safe);
            return {
              learningId: student.learningId,
              classId: student.classId,
              dataScope: reflectionDataScopeForClassId(student.classId),
              grade: reflectionGradeForClassId(student.classId),
              classNumber: reflectionClassNumberForClassId(student.classId),
              attendanceNumber: student.attendanceNumber,
              history,
            };
          }
          EOF

          cat > src/reflection/reflectionTeacherApi.ts <<'EOF'
          const CONFIGURED_API_BASE = (import.meta.env.VITE_API_BASE_URL || '').replace(/\/$/, '');
          const apiUrl = (path: string) => `${CONFIGURED_API_BASE}${path}`;

          export type TeacherDataScope = 'all' | 'main' | 'pilot_b' | 'test' | 'reserve';
          export type TeacherGrade = 'all' | '5' | '6';
          export type TeacherClassNumber = 'all' | '1' | '2' | '3';
          type ConcreteDataScope = Exclude<TeacherDataScope, 'all'>;
          type ConcreteGrade = Exclude<TeacherGrade, 'all'> | '';
          type ConcreteClassNumber = Exclude<TeacherClassNumber, 'all'> | '';

          export interface TeacherDashboardStudent {
            learningId: string;
            classId: string;
            dataScope: ConcreteDataScope;
            grade: ConcreteGrade;
            classNumber: ConcreteClassNumber;
            attendanceNumber: number | '';
            status: 'submitted' | 'draft' | 'missing';
            reflectionCharCount: number;
            todayGoal: string;
            goalRating: number | null;
            selfRegulationRating: number | null;
            reflectionText: string;
            updatedAt: string;
          }

          export interface TeacherDashboardResponse {
            localDate: string;
            dataScope: TeacherDataScope;
            grade: TeacherGrade;
            classNumber: TeacherClassNumber;
            classId: string;
            classes: string[];
            counts: { total: number; submitted: number; draft: number; missing: number };
            students: TeacherDashboardStudent[];
          }

          export interface TeacherHistoryRecord {
            reflectionId: string;
            localDate: string;
            todayGoal: string;
            goalRating: number | null;
            selfRegulationRating: number | null;
            reflectionText: string;
            reflectionCharCount: number;
            status: 'draft' | 'submitted';
            revision: number;
            createdAt: string;
            updatedAt: string;
            submittedAt: string;
            achievements: string;
            languageUsed: string;
            thinking: string;
            difficultyStrategy: string;
            languageCultureAwareness: string;
            nextGoal: string;
          }

          export interface TeacherStudentHistoryResponse {
            learningId: string;
            classId: string;
            dataScope: ConcreteDataScope;
            grade: ConcreteGrade;
            classNumber: ConcreteClassNumber;
            attendanceNumber: number | '';
            history: TeacherHistoryRecord[];
          }

          async function post<T>(path: string, body: Record<string, unknown> = {}): Promise<T> {
            const response = await fetch(apiUrl(path), {
              method: 'POST', credentials: 'include', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok || data?.success === false) {
              const error = new Error(data?.error || `HTTP_${response.status}`) as Error & { code?: string; status?: number };
              error.code = data?.error; error.status = response.status; throw error;
            }
            return data as T;
          }

          export function teacherShouldRedirectToApiOrigin(): string {
            if (!CONFIGURED_API_BASE) return '';
            try {
              const target = new URL(CONFIGURED_API_BASE);
              return target.origin !== window.location.origin ? `${target.origin}/reflection/teacher` : '';
            } catch { return ''; }
          }

          export async function teacherLogin(username: string, password: string): Promise<void> { await post('/api/reflection/teacher/login', { username, password }); }
          export async function teacherLogout(): Promise<void> { await post('/api/reflection/teacher/logout'); }
          export async function teacherMe(): Promise<{ username: string; role: string }> {
            const data = await post<{ success: true; user: { username: string; role: string } }>('/api/reflection/teacher/me');
            return data.user;
          }
          export async function teacherDashboard(localDate: string, dataScope: TeacherDataScope, grade: TeacherGrade, classNumber: TeacherClassNumber): Promise<TeacherDashboardResponse> {
            const data = await post<{ success: true } & TeacherDashboardResponse>('/api/reflection/teacher/dashboard', { localDate, dataScope, grade, classNumber });
            return data;
          }
          export async function teacherStudentHistory(learningId: string): Promise<TeacherStudentHistoryResponse> {
            const data = await post<{ success: true; student: TeacherStudentHistoryResponse }>('/api/reflection/teacher/student', { learningId });
            return data.student;
          }
          export async function teacherExportCsv(localDate: string, dataScope: TeacherDataScope, grade: TeacherGrade, classNumber: TeacherClassNumber): Promise<void> {
            const response = await fetch(apiUrl('/api/reflection/teacher/export.csv'), {
              method: 'POST', credentials: 'include', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ localDate, dataScope, grade, classNumber }),
            });
            if (!response.ok) throw new Error(`HTTP_${response.status}`);
            const blob = await response.blob();
            const href = URL.createObjectURL(blob);
            const anchor = document.createElement('a');
            anchor.href = href;
            anchor.download = `my-english-growth-reflections-${localDate || 'all'}.csv`;
            document.body.appendChild(anchor); anchor.click(); anchor.remove(); URL.revokeObjectURL(href);
          }
          EOF

          cat > src/reflection/ReflectionTeacherApp.tsx <<'EOF'
          import React, { useEffect, useState } from 'react';
          import { BarChart3, CalendarDays, CheckCircle2, Clock3, Download, FileText, LogOut, RefreshCw, Search, Users, XCircle } from 'lucide-react';
          import {
            teacherDashboard, teacherExportCsv, teacherLogin, teacherLogout, teacherMe, teacherShouldRedirectToApiOrigin, teacherStudentHistory,
            type TeacherClassNumber, type TeacherDashboardResponse, type TeacherDataScope, type TeacherGrade, type TeacherStudentHistoryResponse,
          } from './reflectionTeacherApi';

          const today = () => new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Tokyo' });
          const scopeLabel = (scope: string) => ({ main:'本研究', pilot_b:'Pilot B', test:'テスト', reserve:'予備' } as Record<string,string>)[scope] || scope;
          const membershipLabel = (value: { dataScope: string; grade: string; classNumber: string }) => {
            const scope = scopeLabel(value.dataScope);
            const school = value.grade ? `${value.grade}年${value.classNumber ? `${value.classNumber}組` : ''}` : '';
            return school ? `${scope}・${school}` : scope;
          };

          function legacySixPartText(record: TeacherStudentHistoryResponse['history'][number]): string {
            const parts: Array<[string, string]> = [
              ['できたこと', record.achievements], ['使ったことば', record.languageUsed], ['授業中に考えていたこと', record.thinking],
              ['困ったこと・工夫', record.difficultyStrategy], ['言葉や文化について気づいたこと', record.languageCultureAwareness], ['次に頑張りたいこと', record.nextGoal],
            ];
            return parts.filter(([, value]) => value).map(([label, value]) => `【${label}】\n${value}`).join('\n\n');
          }

          function Login({ onDone }: { onDone: () => void }) {
            const [username, setUsername] = useState(''); const [password, setPassword] = useState(''); const [busy, setBusy] = useState(false); const [error, setError] = useState('');
            const submit = async (event: React.FormEvent) => {
              event.preventDefault(); setBusy(true); setError('');
              try { await teacherLogin(username, password); onDone(); }
              catch (e: any) { setError(e?.code === 'TEACHER_ONLY' ? '教師用アカウントでログインしてください。' : e?.code === 'TOO_MANY_LOGIN_ATTEMPTS' ? 'ログイン試行回数が多すぎます。時間をおいてください。' : 'ユーザー名またはパスワードを確認してください。'); }
              finally { setBusy(false); }
            };
            return <div className="megt-login-page"><form className="megt-login-card" onSubmit={submit}><div className="megt-logo"><BarChart3 /></div><h1>My English Growth</h1><h2>教師用 振り返り一覧</h2><p>児童の振り返り状況と学びの記録を確認します。</p><label>ユーザー名<input value={username} onChange={(e) => setUsername(e.target.value)} autoComplete="username" autoFocus /></label><label>パスワード<input type="password" value={password} onChange={(e) => setPassword(e.target.value)} autoComplete="current-password" /></label>{error && <div className="megt-error">{error}</div>}<button className="megt-primary" disabled={busy}>{busy ? '確認しています…' : 'ログイン'}</button></form></div>;
          }

          function StatusChip({ status }: { status: 'submitted' | 'draft' | 'missing' }) {
            if (status === 'submitted') return <span className="megt-chip submitted"><CheckCircle2 />提出済み</span>;
            if (status === 'draft') return <span className="megt-chip draft"><Clock3 />下書き</span>;
            return <span className="megt-chip missing"><XCircle />未入力</span>;
          }

          function StudentPanel({ student, onClose }: { student: TeacherStudentHistoryResponse; onClose: () => void }) {
            return <div className="megt-panel-backdrop" onClick={onClose}><aside className="megt-panel" onClick={(e) => e.stopPropagation()}><button className="megt-close" onClick={onClose} aria-label="閉じる">×</button><div className="megt-panel-head"><div><span>{membershipLabel(student)}</span><h2>{student.learningId}</h2><p>{student.attendanceNumber ? `出席番号 ${student.attendanceNumber}` : '出席番号未設定'}</p></div><BarChart3 /></div>{student.history.length === 0 ? <p className="megt-muted">振り返りはまだありません。</p> : <div className="megt-history">{student.history.map((record) => { const text = record.reflectionText || legacySixPartText(record); return <article key={record.reflectionId}><div className="megt-history-date"><b>{record.localDate}</b><StatusChip status={record.status === 'submitted' ? 'submitted' : 'draft'} /><span>{record.reflectionCharCount}文字</span></div><h3>今日のめあて</h3><p>{record.todayGoal || '—'}</p><div className="megt-rating-summary"><span>めあて {record.goalRating ?? '—'}/5</span><span>考え・工夫 {record.selfRegulationRating ?? '—'}/5</span></div><h3>今日の振り返り</h3><p>{text || '—'}</p></article>; })}</div>}</aside></div>;
          }

          export default function ReflectionTeacherApp() {
            const [mode, setMode] = useState<'checking' | 'login' | 'ready'>('checking');
            const [user, setUser] = useState(''); const [localDate, setLocalDate] = useState(today);
            const [dataScope, setDataScope] = useState<TeacherDataScope>('main'); const [grade, setGrade] = useState<TeacherGrade>('all'); const [classNumber, setClassNumber] = useState<TeacherClassNumber>('all');
            const [data, setData] = useState<TeacherDashboardResponse | null>(null); const [loading, setLoading] = useState(false); const [error, setError] = useState('');
            const [selected, setSelected] = useState<TeacherStudentHistoryResponse | null>(null); const [search, setSearch] = useState('');

            const checkAuth = async () => { try { const me = await teacherMe(); setUser(me.username); setMode('ready'); } catch { setMode('login'); } };
            const load = async (date = localDate, scope = dataScope, g = grade, room = classNumber) => {
              setLoading(true); setError('');
              try { setData(await teacherDashboard(date, scope, g, room)); }
              catch (e: any) { if (e?.status === 401) setMode('login'); else setError('振り返り一覧を読み込めませんでした。'); }
              finally { setLoading(false); }
            };
            useEffect(() => { const redirect = teacherShouldRedirectToApiOrigin(); if (redirect) { window.location.replace(redirect); return; } void checkAuth(); }, []);
            useEffect(() => { if (mode === 'ready') void load(); }, [mode, localDate, dataScope, grade, classNumber]);

            if (mode === 'checking') return <div className="megt-loading"><BarChart3 /><p>教師画面を読み込んでいます…</p></div>;
            if (mode === 'login') return <Login onDone={() => void checkAuth()} />;

            const filtered = (data?.students || []).filter((row) => !search.trim() || row.learningId.includes(search.trim().toUpperCase()));
            const openStudent = async (learningId: string) => { try { setSelected(await teacherStudentHistory(learningId)); } catch { setError('児童の履歴を読み込めませんでした。'); } };
            const logout = async () => { try { await teacherLogout(); } finally { setUser(''); setData(null); setMode('login'); } };
            const exportCsv = async () => { try { await teacherExportCsv(localDate, dataScope, grade, classNumber); } catch { setError('CSVを書き出せませんでした。'); } };

            return <div className="megt-app"><header className="megt-header"><div className="megt-brand"><div className="megt-logo"><BarChart3 /></div><div><h1>My English Growth</h1><p>教師用 振り返りダッシュボード</p></div></div><div className="megt-user"><span>{user}</span><button onClick={logout}><LogOut />ログアウト</button></div></header>
              <main className="megt-main"><section className="megt-toolbar">
                <label><CalendarDays />日付<input type="date" value={localDate} onChange={(e) => setLocalDate(e.target.value)} /></label>
                <label><FileText />データ区分<select value={dataScope} onChange={(e) => setDataScope(e.target.value as TeacherDataScope)}><option value="main">本研究</option><option value="pilot_b">Pilot B</option><option value="test">テスト</option><option value="reserve">予備</option><option value="all">すべて</option></select></label>
                <label><Users />学年<select value={grade} onChange={(e) => setGrade(e.target.value as TeacherGrade)}><option value="all">すべて</option><option value="5">5年</option><option value="6">6年</option></select></label>
                <label><Users />学級<select value={classNumber} onChange={(e) => setClassNumber(e.target.value as TeacherClassNumber)}><option value="all">すべて</option><option value="1">1組</option><option value="2">2組</option><option value="3">3組</option></select></label>
                <label className="megt-search"><Search />ID検索<input value={search} onChange={(e) => setSearch(e.target.value)} placeholder="例：6RSX" maxLength={8} /></label><button className="megt-secondary" onClick={() => void load()} disabled={loading}><RefreshCw />更新</button><button className="megt-export" onClick={exportCsv}><Download />CSV</button></section>
