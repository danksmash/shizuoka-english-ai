                <section className="megt-table-card"><div className="megt-table-head"><div><FileText /><h2>{data?.localDate || localDate} の振り返り</h2></div><p>文字数と自己評価は、児童の学びを振り返るための補助情報です。</p></div><div className="megt-table-scroll"><table><thead><tr><th>所属</th><th>出席</th><th>ID</th><th>状況</th><th>文字数</th><th>今日のめあて</th><th>自己評価</th><th>今日の振り返り</th></tr></thead><tbody>{filtered.map((row) => <tr key={`${row.classId}-${row.learningId}`} onClick={() => void openStudent(row.learningId)} tabIndex={0} onKeyDown={(e) => { if (e.key === 'Enter') void openStudent(row.learningId); }}><td>{membershipLabel(row)}</td><td>{row.attendanceNumber || '—'}</td><td><b>{row.learningId}</b></td><td><StatusChip status={row.status} /></td><td>{row.reflectionCharCount || '—'}</td><td>{row.todayGoal || '—'}</td><td>{row.goalRating ?? '—'} / {row.selfRegulationRating ?? '—'}</td><td>{row.reflectionText || '—'}</td></tr>)}</tbody></table>{!loading && filtered.length === 0 && <div className="megt-empty">該当する児童はいません。</div>}</div></section>
              </main>{selected && <StudentPanel student={selected} onClose={() => setSelected(null)} />}</div>;
          }
