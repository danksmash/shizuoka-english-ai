name: Questionnaire production smoke

on:
  workflow_run:
    workflows:
      - Deploy production to Cloud Run
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Verify questionnaire production surface and auth guards
        run: |
          set -euo pipefail
          API_URL="https://shizuoka-english-ai-1075707511474.asia-northeast1.run.app"

          # Research Dashboard and questionnaire analysis are separate production surfaces.
          # Both HTML pages are public shells; all questionnaire data/actions remain behind researcher auth.
          management=""
          questionnaire=""
          for attempt in 1 2 3 4 5; do
            if management=$(curl --fail --silent --show-error --max-time 20 "$API_URL/management") \
              && questionnaire=$(curl --fail --silent --show-error --max-time 20 "$API_URL/questionnaire-analysis.html"); then
              break
            fi
            sleep 3
          done
          grep -q 'questionnaire-analysis.html' <<<"$management"
          if grep -q 'id="questionnaireSection"' <<<"$management"; then
            echo 'Questionnaire analysis is still embedded in Research Dashboard.' >&2
            exit 1
          fi
          grep -q 'Study 1 3時点質問紙分析' <<<"$questionnaire"
          grep -q '/api/management/questionnaire/analysis' <<<"$questionnaire"
          grep -q 'student_questionnaires' <<<"$questionnaire"
          grep -q 'Mid N' <<<"$questionnaire"
          grep -q '試験的LMM分析（研究者用）' <<<"$questionnaire"
          grep -q '/api/management/questionnaire/lmm-trial' <<<"$questionnaire"
          grep -q 'Google Forms自動同期' <<<"$questionnaire"
          grep -q 'setInterval(pollRevision,30000)' <<<"$questionnaire"
          if grep -q 'id="qCsvFile"' <<<"$questionnaire"; then
            echo 'Unexpected manual questionnaire CSV file input is visible.' >&2
            exit 1
          fi
          if grep -q 'id="qImportBtn"' <<<"$questionnaire"; then
            echo 'Unexpected manual questionnaire CSV import button is visible.' >&2
            exit 1
          fi
          if grep -q 'id="qWave"' <<<"$questionnaire"; then
            echo 'Unexpected manual questionnaire wave selector is visible.' >&2
            exit 1
          fi
          if grep -q 'Google Forms回答CSV' <<<"$questionnaire"; then
            echo 'Unexpected manual questionnaire CSV label is visible.' >&2
            exit 1
          fi

          # All researcher questionnaire operations must reject an unauthenticated caller.
          analysis_status=$(curl --silent --show-error --max-time 20 \
            -o /tmp/questionnaire-analysis.json \
            -w '%{http_code}' \
            -X POST "$API_URL/api/management/questionnaire/analysis" \
            -H 'Content-Type: application/json' \
            --data '{}')
          test "$analysis_status" = '401'
          grep -q '"error":"UNAUTHORIZED"' /tmp/questionnaire-analysis.json

          stats_status=$(curl --silent --show-error --max-time 20 \
            -o /tmp/questionnaire-stats.json \
            -w '%{http_code}' \
            -X POST "$API_URL/api/management/questionnaire/statistics" \
            -H 'Content-Type: application/json' \
            --data '{}')
          test "$stats_status" = '401'
          grep -q '"error":"UNAUTHORIZED"' /tmp/questionnaire-stats.json

          lmm_status=$(curl --silent --show-error --max-time 20 \
            -o /tmp/questionnaire-lmm.json \
            -w '%{http_code}' \
            -X POST "$API_URL/api/management/questionnaire/lmm-trial" \
            -H 'Content-Type: application/json' \
            --data '{}')
          test "$lmm_status" = '401'
          grep -q '"error":"UNAUTHORIZED"' /tmp/questionnaire-lmm.json

          # Manual CSV import remains as a protected emergency fallback API, but it is
          # intentionally no longer exposed in the normal researcher dashboard UI.
          import_status=$(curl --silent --show-error --max-time 20 \
            -o /tmp/questionnaire-import.json \
            -w '%{http_code}' \
            -X POST "$API_URL/api/management/questionnaire/import" \
            -H 'Content-Type: application/json' \
            --data '{}')
          test "$import_status" = '401'
          grep -q '"error":"UNAUTHORIZED"' /tmp/questionnaire-import.json

          export_status=$(curl --silent --show-error --max-time 20 \
            -o /tmp/questionnaire-export.json \
            -w '%{http_code}' \
            "$API_URL/api/management/research.csv?dataset=student_questionnaires")
          test "$export_status" = '401'
          grep -q '"error":"UNAUTHORIZED"' /tmp/questionnaire-export.json

          revision_status=$(curl --silent --show-error --max-time 20 \
            -o /tmp/questionnaire-revision.json \
            -w '%{http_code}' \
            -X POST "$API_URL/api/management/questionnaire/revision" \
            -H 'Content-Type: application/json' \
            --data '{}')
          test "$revision_status" = '401'
          grep -q '"error":"UNAUTHORIZED"' /tmp/questionnaire-revision.json

          # The Apps Script-facing ingest route is public by necessity, but it must
          # be configured with the shared secret and reject an unsigned request.
          auto_status=$(curl --silent --show-error --max-time 20 \
            -o /tmp/questionnaire-auto.json \
            -w '%{http_code}' \
            -X POST "$API_URL/api/questionnaire-auto/ingest" \
            -H 'Content-Type: application/json' \
            --data '{"formId":"probe","formResponseId":"probe","submittedAt":"2026-09-12T00:00:00.000Z","learningCode":"Z9Q7","answers":{}}')
          test "$auto_status" = '401'
          grep -q '"error":"INVALID_QUESTIONNAIRE_SIGNATURE"' /tmp/questionnaire-auto.json

          echo 'QUESTIONNAIRE PRODUCTION SMOKE PASS: dedicated analysis page present; Research Dashboard detached; auto-sync UI present; protected routes reject unauthenticated/unsigned access; no writes performed.'
