name: Temporary fix interrupted session classification
on:
  push:
    branches: [codex/research-checkpoint-status]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/research-checkpoint-status
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: python3 scripts/_tmp_fix_checkpoint_status.py
      - name: Full QA and production build
        run: |
          npm run qa
          npm run build
      - name: Commit code only
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/server/researchExport.ts scripts/qa-research-integrated.ts
          git commit -m "fix: distinguish interrupted research sessions"
          git push origin HEAD:codex/research-checkpoint-status
