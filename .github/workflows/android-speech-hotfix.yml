name: Android Speech Recognition Hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-speech-hotfix.yml'
      - 'scripts/_android_speech_hotfix.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch only Web Speech result handling
        run: python3 scripts/_android_speech_hotfix.py

      - name: Verify patch scope
        run: |
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "src/utils/speech.ts"
          grep -q "event.resultIndex" src/utils/speech.ts
          grep -q "let finalizedTranscript = ''" src/utils/speech.ts

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Full QA
        run: npm run qa

      - name: Production build
        env:
          VITE_API_BASE_URL: https://shizuoka-english-ai-1075707511474.asia-northeast1.run.app
        run: npm run build

      - name: Commit tested hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/utils/speech.ts
          git commit -m "fix: prevent duplicate interim speech on Android"
          git push origin HEAD:main
