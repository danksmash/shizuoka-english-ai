name: Apply AI reflection 4-point UI

on:
  push:
    branches:
      - fix/ai-reflection-4point-ui-20260911
    paths:
      - scripts/_patch_ai_reflection_legend.py
      - .github/workflows/_apply-ai-reflection-ui.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout UI branch
        uses: actions/checkout@v4
        with:
          ref: fix/ai-reflection-4point-ui-20260911
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Patch readable dashboard legend
        run: python3 scripts/_patch_ai_reflection_legend.py
      - name: Run full QA and production build
        run: |
          npm run qa
          npm run build
      - name: Remove one-off helpers
        run: |
          rm scripts/_patch_ai_reflection_legend.py
          rm .github/workflows/_apply-ai-reflection-ui.yml
      - name: Commit verified UI
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: switch AI reflection to four-point scale'
          git push origin HEAD:fix/ai-reflection-4point-ui-20260911
