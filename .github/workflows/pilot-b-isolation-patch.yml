name: Pilot B isolation patch
on:
  push:
    branches: [codex/pilot-b-isolation]
permissions:
  contents: write
jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/pilot-b-isolation
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply minimal Pilot B isolation support
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) Research Dashboard UI: add one Pilot B class filter.
          p = Path('src/server/managementPage.ts')
          s = p.read_text()
          old = '<option value="test">テスト</option><option value="reserve">予備</option></select></label>'
          new = '<option value="test">テスト</option><option value="reserve">予備</option><option value="pilotb">Pilot B</option></select></label>'
          if old not in s:
              raise SystemExit('managementPage Pilot B insertion point not found')
          p.write_text(s.replace(old, new, 1))

          # 2) Shared dashboard/CSV filter: classId=pilotb means either 5-PB or 6-PB.
          p = Path('src/server/researchDashboard.ts')
          s = p.read_text()
          old = "  if (classId === 'reserve') return storedClass === '予備';\n  if (['1','2','3'].includes(classId)) return storedClass.endsWith(`-${classId}`);"
          new = "  if (classId === 'reserve') return storedClass === '予備';\n  if (classId === 'pilotb') return storedClass === '5-PB' || storedClass === '6-PB';\n  if (['1','2','3'].includes(classId)) return storedClass.endsWith(`-${classId}`);"
          if old not in s:
              raise SystemExit('researchDashboard class filter insertion point not found')
          p.write_text(s.replace(old, new, 1))

          # 3) Allow researcher-side class lifecycle helpers to retain Pilot B IDs.
          p = Path('src/server/persistence.ts')
          s = p.read_text()
          old = "if (!/^(?:5-[123]|6-[123]|テスト|予備)$/.test(cid)) throw new Error('INVALID_CLASS_ID');"
          new = "if (!/^(?:5-[123]|6-[123]|5-PB|6-PB|テスト|予備)$/.test(cid)) throw new Error('INVALID_CLASS_ID');"
          if old not in s:
              raise SystemExit('persistence class validation insertion point not found')
          p.write_text(s.replace(old, new, 1))

          # 4) Keep the Pilot B isolation QA in the normal regression suite.
          p = Path('package.json')
          s = p.read_text()
          old = '&& npm run qa:dashboard && npm run qa:research-export'
          new = '&& npm run qa:dashboard && npm run qa:pilot-b && npm run qa:research-export'
          if old not in s:
              raise SystemExit('package qa chain insertion point not found')
          s = s.replace(old, new, 1)
          old = '    "qa:dashboard": "tsx scripts/qa-dashboard-data-sync.ts",\n'
          new = '    "qa:dashboard": "tsx scripts/qa-dashboard-data-sync.ts",\n    "qa:pilot-b": "tsx scripts/qa-pilot-b-isolation.ts",\n'
          if old not in s:
              raise SystemExit('package qa script insertion point not found')
          p.write_text(s.replace(old, new, 1))

          # 5) UI regression: Pilot B must stay visible as a dedicated research filter.
          p = Path('scripts/qa-dashboard-data-sync.ts')
          s = p.read_text()
          old = "assert.ok(pageSource.includes('５年') && pageSource.includes('６年') && pageSource.includes('１組') && pageSource.includes('２組') && pageSource.includes('３組'));"
          new = old + "\nassert.ok(pageSource.includes('<option value=\"pilotb\">Pilot B</option>'), 'Pilot B class filter must remain available');"
          if old not in s:
              raise SystemExit('dashboard QA insertion point not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Install dependencies
        run: npm ci
      - name: Full regression QA
        run: npm run qa
      - name: Production build
        run: npm run build
      - name: Commit verified patch and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/pilot-b-isolation-patch.yml
          git add src/server/managementPage.ts src/server/researchDashboard.ts src/server/persistence.ts scripts/qa-dashboard-data-sync.ts scripts/qa-pilot-b-isolation.ts package.json
          git commit -m 'research: isolate Pilot B from Study 1 data'
          git push
