name: TTS observability production-like canary

on:
  push:
    branches:
      - fix/tts-provider-observability-20260909
    paths:
      - '.github/workflows/tts-observability-canary.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PROJECT: shizuoka-english-ai
      REGION: asia-northeast1
      SERVICE: shizuoka-english-ai-tts-observability-canary
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/1075707511474/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-actions-deploy@shizuoka-english-ai.iam.gserviceaccount.com
          project_id: shizuoka-english-ai
      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: shizuoka-english-ai
          version: '>= 416.0.0'

      - name: Deploy isolated canary with production TTS settings
        run: |
          set -euo pipefail
          RUNTIME_SA=$(gcloud run services describe shizuoka-english-ai --project "$PROJECT" --region "$REGION" --format='value(spec.template.spec.serviceAccountName)')
          if [ -z "$RUNTIME_SA" ]; then
            PROJECT_NUMBER=$(gcloud projects describe "$PROJECT" --format='value(projectNumber)')
            RUNTIME_SA="${PROJECT_NUMBER}-compute@developer.gserviceaccount.com"
          fi
          BUILD_SHA="${GITHUB_SHA:0:12}"
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT" \
            --source . \
            --region "$REGION" \
            --allow-unauthenticated \
            --service-account "$RUNTIME_SA" \
            --min-instances 1 \
            --max-instances 3 \
            --concurrency 80 \
            --timeout 60 \
            --memory 512Mi \
            --update-env-vars APP_VERSION=tts-observability-canary,APP_BUILD="$BUILD_SHA",AZURE_SPEECH_REGION=japaneast \
            --update-secrets AZURE_SPEECH_KEY=AZURE_SPEECH_KEY:latest
          CANARY_URL=$(gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format='value(status.url)')
          test -n "$CANARY_URL"
          case "$CANARY_URL" in
            *shizuoka-english-ai-1075707511474.asia-northeast1.run.app*) echo 'Refusing production endpoint'; exit 1;;
          esac
          echo "CANARY_URL=$CANARY_URL" >> "$GITHUB_ENV"

      - name: Verify CORS exposure from GitHub Pages origin
        run: |
          set -euo pipefail
          H=$(mktemp)
          code=$(curl --silent --show-error --max-time 20 -D "$H" -o /dev/null -w '%{http_code}' \
            -X OPTIONS "$CANARY_URL/api/tts" \
            -H 'Origin: https://danksmash.github.io' \
            -H 'Access-Control-Request-Method: POST')
          test "$code" = '204'
          grep -qi 'access-control-allow-origin: https://danksmash.github.io' "$H"
          grep -qi 'access-control-expose-headers:.*x-tts-provider' "$H"
          grep -qi 'access-control-expose-headers:.*x-tts-fallback-from' "$H"
          grep -qi 'access-control-expose-headers:.*x-tts-fallback-reason' "$H"
          grep -qi 'access-control-expose-headers:.*x-tts-latency-ms' "$H"
          rm -f "$H"
          echo 'CORS provider metadata exposure: PASS'

      - name: Run 3 waves x 35 simultaneous real TTS requests
        env:
          ORIGIN: https://danksmash.github.io
        run: |
          node --input-type=module <<'NODE'
          const url = process.env.CANARY_URL;
          const origin = process.env.ORIGIN;
          const personas = [
            'emma_usa','oliver_uk','liam_australia','minji_korea','pavel_belarus',
            'lukas_germany','aina_malaysia','dimas_indonesia','bence_hungary','yuting_taiwan',
            'zofia_poland','matas_lithuania','ananya_india','xinyi_china','linh_vietnam',
            'rahul_bangladesh','nadeesha_srilanka','suman_nepal','amara_nigeria','andrei_romania'
          ];
          const results = [];
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          const percentile = (xs, q) => {
            if (!xs.length) return null;
            const a=[...xs].sort((x,y)=>x-y);
            return Math.round(a[Math.min(a.length-1,Math.max(0,Math.ceil(q*a.length)-1))]);
          };
          async function requestTts(wave, index) {
            const persona = personas[(wave * 7 + index) % personas.length];
            const started = performance.now();
            try {
              const response = await fetch(`${url}/api/tts`, {
                method:'POST',
                headers:{'Content-Type':'application/json','Origin':origin},
                body:JSON.stringify({text:`Hello. Nice to meet you. This is classroom test ${wave + 1}.`,aiStudentId:persona,speakingRate:1.0}),
                signal:AbortSignal.timeout(12000),
              });
              const audio = await response.arrayBuffer();
              results.push({
                wave,index,persona,status:response.status,bytes:audio.byteLength,
                provider:response.headers.get('x-tts-provider') || 'not_observed',
                fallbackFrom:response.headers.get('x-tts-fallback-from') || '',
                fallbackReason:response.headers.get('x-tts-fallback-reason') || '',
                serverLatency:Number(response.headers.get('x-tts-latency-ms') || 0),
                elapsed:Math.round(performance.now()-started),
              });
            } catch (error) {
              results.push({wave,index,persona,status:0,bytes:0,provider:'request_error',fallbackFrom:'',fallbackReason:error instanceof Error?error.message:String(error),serverLatency:0,elapsed:Math.round(performance.now()-started)});
            }
          }
          for (let wave=0; wave<3; wave++) {
            await Promise.all(Array.from({length:35},(_,i)=>requestTts(wave,i)));
            if (wave < 2) await sleep(8000);
          }
          const counts = key => Object.fromEntries([...new Set(results.map(r=>r[key]))].map(v=>[String(v),results.filter(r=>r[key]===v).length]));
          const azure = results.filter(r=>r.provider==='azure-speech').length;
          const chirp = results.filter(r=>r.provider==='google-chirp3-hd').length;
          const errors = results.filter(r=>r.status!==200 || r.bytes<500 || r.provider==='request_error' || r.provider==='not_observed');
          const report = {
            requests:results.length,
            azure, chirp,
            azurePercent:Math.round(azure/results.length*10000)/100,
            providerCounts:counts('provider'),
            fallbackReasonCounts:counts('fallbackReason'),
            httpStatusCounts:counts('status'),
            serverLatencyP50Ms:percentile(results.filter(r=>r.serverLatency>0).map(r=>r.serverLatency),.5),
            serverLatencyP95Ms:percentile(results.filter(r=>r.serverLatency>0).map(r=>r.serverLatency),.95),
            serverLatencyP99Ms:percentile(results.filter(r=>r.serverLatency>0).map(r=>r.serverLatency),.99),
            clientElapsedP95Ms:percentile(results.map(r=>r.elapsed),.95),
            invalidRequests:errors.length,
          };
          console.log('TTS_CANARY_REPORT='+JSON.stringify(report));
          if (results.length !== 105) throw new Error(`expected 105 results, got ${results.length}`);
          if (errors.length) throw new Error(`invalid TTS results: ${JSON.stringify(errors.slice(0,5))}`);
          NODE

      - name: Remove isolated canary
        if: always()
        continue-on-error: true
        run: gcloud run services delete "$SERVICE" --project "$PROJECT" --region "$REGION" --quiet || true
