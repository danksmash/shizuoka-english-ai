name: Apply Reflection goal autosave

on:
  push:
    branches:
      - fix/reflection-goal-autosave-20260910
    paths:
      - '.github/workflows/reflection-goal-autosave-apply.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply_verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply source patch
        run: python3 scripts/apply-reflection-goal-autosave.py
      - name: Reflection QA
        run: npm run qa:reflection
      - name: Full QA and production builds
        run: |
          npm run qa
          npm run build
          npm run build:pages
      - name: Commit verified source changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/reflection/ReflectionApp.tsx src/reflection/reflectionApi.ts scripts/qa-reflection-module.ts
          git diff --cached --check
          git commit -m 'fix: harden automatic saving of lesson goals'
          git push origin HEAD:fix/reflection-goal-autosave-20260910
