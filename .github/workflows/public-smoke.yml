name: Public smoke verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/public-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Cloud Run CORS and AI dialogue
        shell: bash
        run: |
          set -euo pipefail
          API='https://shizuoka-english-ai-1075707511474.asia-northeast1.run.app'

          ready=0
          for i in $(seq 1 24); do
            if curl -fsS -D /tmp/cors.headers -o /dev/null -X OPTIONS \
              -H 'Origin: https://danksmash.github.io' \
              -H 'Access-Control-Request-Method: POST' \
              -H 'Access-Control-Request-Headers: Content-Type' \
              "$API/api/chat" \
              && grep -qi '^access-control-allow-origin: https://danksmash.github.io' /tmp/cors.headers; then
              ready=1
              break
            fi
            sleep 10
          done
          test "$ready" = 1

          translated=0
          for i in $(seq 1 12); do
            if curl -fsS "$API/api/chat" \
              -H 'Origin: https://danksmash.github.io' \
              -H 'Content-Type: application/json' \
              --data '{"message":"How are you?","history":[],"topic":"intro","studentName":"5・6年生","aiStudentId":"emma_usa"}' \
              -o /tmp/howareyou.json; then
              if python3 - <<'PY'
          import json, re
          d=json.load(open('/tmp/howareyou.json', encoding='utf-8'))
          x=d.get('data') or {}
          t=str(x.get('studentJapaneseTranslation',''))
          assert d.get('success') is True
          assert x.get('studentTranslationStatus') == 'translated'
          assert re.search(r'[ぁ-んァ-ヶ一-龠]', t)
          assert t != '日本語に訳せませんでした。'
          assert str(x.get('reply','')).strip().endswith('?')
          PY
              then
                translated=1
                break
              fi
            fi
            sleep 5
          done
          test "$translated" = 1

          incomplete=0
          for i in $(seq 1 8); do
            if curl -fsS "$API/api/chat" \
              -H 'Origin: https://danksmash.github.io' \
              -H 'Content-Type: application/json' \
              --data '{"message":"I like","history":[],"topic":"favorites","studentName":"5・6年生","aiStudentId":"emma_usa"}' \
              -o /tmp/incomplete.json; then
              if python3 - <<'PY'
          import json
          d=json.load(open('/tmp/incomplete.json', encoding='utf-8'))
          x=d.get('data') or {}
          assert d.get('success') is True
          assert x.get('studentTranslationStatus') == 'incomplete'
          assert x.get('studentJapaneseTranslation') == '日本語に訳せませんでした。'
          PY
              then
                incomplete=1
                break
              fi
            fi
            sleep 5
          done
          test "$incomplete" = 1

      - name: Verify published Pages bundle points to Cloud Run
        shell: bash
        run: |
          set -euo pipefail
          PAGE='https://danksmash.github.io/shizuoka-english-ai/'
          TARGET='shizuoka-english-ai-1075707511474.asia-northeast1.run.app'
          ok=0
          for i in $(seq 1 24); do
            html=$(curl -fsSL "$PAGE" || true)
            js=$(printf '%s' "$html" | grep -oE 'src="\./assets/[^"]+\.js"' | head -n1 | cut -d'"' -f2 || true)
            if [ -n "$js" ]; then
              asset="${PAGE}${js#./}"
              if curl -fsSL "$asset" | grep -q "$TARGET"; then
                ok=1
                break
              fi
            fi
            sleep 10
          done
          test "$ok" = 1
