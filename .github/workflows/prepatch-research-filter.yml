name: Normalize researcher filter block
on:
  push:
    branches:
      - codex/research-dashboard-readability-filters
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize fixed filter choices
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/server/researchDashboard.ts')
          s=p.read_text()
          old="""    filters:{
                classes:uniqueSorted(all.sessions,'class_id'), grades:uniqueSorted(all.sessions,'grade_level'), personas:uniqueSorted(all.sessions,'persona_id'),
                circles:uniqueSorted(all.sessions,'accent_circle'), labelConditions:uniqueSorted(all.sessions,'persona_label_condition'), topics:uniqueSorted(all.sessions,'topic'),
              },"""
          new="""    filters:{
                classes:['1','2','3','test','reserve'], grades:['5','6','test','reserve'], personas:AI_STUDENTS_LIST.map((persona)=>persona.id),
                circles:['Inner','Outer','Expanding'], labelConditions:['shown','hidden'], topics:['intro','favorites','shizuoka_culture','talents','free'],
              },"""
          if new in s:
              print('already normalized')
          elif old in s:
              p.write_text(s.replace(old,new,1))
          else:
              # whitespace-insensitive fallback for the exact filters object
              import re
              pattern=r"    filters:\{\n\s*classes:uniqueSorted\(all\.sessions,'class_id'\), grades:uniqueSorted\(all\.sessions,'grade_level'\), personas:uniqueSorted\(all\.sessions,'persona_id'\),\n\s*circles:uniqueSorted\(all\.sessions,'accent_circle'\), labelConditions:uniqueSorted\(all\.sessions,'persona_label_condition'\), topics:uniqueSorted\(all\.sessions,'topic'\),\n\s*\},"
              s2,n=re.subn(pattern,new,s,count=1)
              if n!=1: raise SystemExit('filter block not found')
              p.write_text(s2)
          PY
          if git diff --quiet; then exit 0; fi
          git config user.name "danksmash"
          git config user.email "danksmash@gmail.com"
          git add src/server/researchDashboard.ts
          git commit -m "chore: normalize researcher filter choices"
          git push origin HEAD:codex/research-dashboard-readability-filters
