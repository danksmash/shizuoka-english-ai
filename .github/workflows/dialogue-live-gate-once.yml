name: One-time live dialogue gate

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  dialogue-live:
    if: github.head_ref == 'fix/formalize-six-dialogue-topics'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/1075707511474/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-actions-deploy@shizuoka-english-ai.iam.gserviceaccount.com
          project_id: shizuoka-english-ai

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: shizuoka-english-ai
          version: '>= 416.0.0'

      - name: Deploy isolated branch canary without research persistence
        run: |
          RUNTIME_SA=$(gcloud run services describe shizuoka-english-ai \
            --project shizuoka-english-ai \
            --region asia-northeast1 \
            --format='value(spec.template.spec.serviceAccountName)')
          if [ -z "$RUNTIME_SA" ]; then
            PROJECT_NUMBER=$(gcloud projects describe shizuoka-english-ai --format='value(projectNumber)')
            RUNTIME_SA="${PROJECT_NUMBER}-compute@developer.gserviceaccount.com"
          fi
          test -n "$RUNTIME_SA"
          gcloud run deploy shizuoka-english-ai-dialogue-canary \
            --project shizuoka-english-ai \
            --source . \
            --region asia-northeast1 \
            --allow-unauthenticated \
            --service-account "$RUNTIME_SA" \
            --min-instances 0 \
            --max-instances 1 \
            --concurrency 10 \
            --timeout 60 \
            --memory 512Mi \
            --update-env-vars ANTHROPIC_MODEL=claude-sonnet-5,APP_VERSION=dialogue-canary,APP_BUILD="${GITHUB_SHA:0:12}" \
            --update-secrets ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest

      - name: Verify persistence disabled and natural direct answers
        run: |
          CANARY_URL=$(gcloud run services describe shizuoka-english-ai-dialogue-canary \
            --project shizuoka-english-ai \
            --region asia-northeast1 \
            --format='value(status.url)')
          test -n "$CANARY_URL"
          health=$(curl --fail --silent --show-error --max-time 20 "$CANARY_URL/api/health")
          echo "$health" | grep -q '"aiConfigured":true'
          echo "$health" | grep -q '"learningDataConfigured":false'
          CANARY_URL="$CANARY_URL" python3 - <<'PY'
          import json, os, urllib.request

          url = os.environ['CANARY_URL'].rstrip('/') + '/api/chat'

          def ask(topic, message, starter):
              payload = {
                  'message': message,
                  'history': [{
                      'id': 'ai-start',
                      'sender': 'ai',
                      'englishText': starter,
                      'timestamp': 1,
                  }],
                  'topic': topic,
                  'aiStudentId': 'emma_usa',
              }
              req = urllib.request.Request(
                  url,
                  data=json.dumps(payload).encode(),
                  headers={'Content-Type': 'application/json'},
                  method='POST',
              )
              with urllib.request.urlopen(req, timeout=50) as response:
                  data = json.load(response)
              assert data.get('success') is True, (topic, data.get('error'))
              assert data.get('_diagnostics', {}).get('route') == 'anthropic-resilient', topic
              reply = str(data.get('data', {}).get('reply', '')).strip()
              assert reply, topic
              assert len(reply.split()) <= 24, (topic, reply)
              return reply.lower()

          routine_start = 'I usually get up at seven. What time do you get up?'
          reply = ask('daily_routine', 'What time do you get up?', routine_start)
          assert 'seven' in reply or '7' in reply, reply

          reply = ask('daily_routine', 'What time do you go to bed?', routine_start)
          assert 'eleven' in reply or '11' in reply, reply

          reply = ask('daily_routine', 'Do you help your family?', routine_start)
          assert any(word in reply for word in ['yes', 'cook', 'clean']), reply

          reply = ask('intro', 'How old are you?', "Hi! I'm Emma from California. What's your name?")
          assert '20' in reply or 'twenty' in reply, reply

          reply = ask('favorites', 'What do you like?', 'I like surfing and games. What do you like?')
          assert any(word in reply for word in ['surf', 'game', 'strawber', 'burger']), reply

          reply = ask('shizuoka_culture', 'What do you like about Shizuoka?', 'I like Shizuoka. What do you like about Shizuoka?')
          assert any(word in reply for word in ['shizuoka', 'strawber', 'fuji']), reply

          reply = ask('talents', 'Can you surf?', 'I can surf. What can you do?')
          assert any(word in reply for word in ['yes', 'surf', 'can']), reply

          reply = ask('free', 'Do you like games?', 'We can talk about anything. What do you like?')
          assert any(word in reply for word in ['yes', 'game']), reply

          print('LIVE DIALOGUE GATE PASS: daily_routine direct answers + five-topic regression')
          PY

      - name: Remove isolated canary service
        if: always()
        run: |
          gcloud run services delete shizuoka-english-ai-dialogue-canary \
            --project shizuoka-english-ai \
            --region asia-northeast1 \
            --quiet || true
