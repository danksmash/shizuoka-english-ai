name: Apply persona/reflection visual fix
on:
  push:
    branches:
      - codex/fix-persona-overflow-reflection-labels-v2
permissions:
  contents: write
jobs:
  patch-test-commit:
    if: "!contains(github.event.head_commit.message, 'fix: prevent persona clipping and reflection label overlap')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fix-persona-overflow-reflection-labels-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: python3 scripts/patch-persona-reflection-visuals.py
      - run: npm run qa
      - run: npm run build
      - name: Commit verified app changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server/managementPage.ts scripts/qa-dashboard-data-sync.ts
          git commit -m "fix: prevent persona clipping and reflection label overlap"
          git push
