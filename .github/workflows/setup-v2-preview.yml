name: Setup v2 branch preview

on:
  push:
    branches:
      - codex/setup-main-reference-5x4

permissions:
  contents: read

jobs:
  verify-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Full QA
        run: npm run qa

      - name: Production build
        env:
          VITE_API_BASE_URL: https://shizuoka-english-ai-1075707511474.asia-northeast1.run.app
          VITE_PERSONA_LABEL_CONDITION: shown
        run: npm run build

      - name: Install Playwright and Chromium for visual QA
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/setup-v2-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/setup-v2-preview.log
          exit 1

      - name: Capture fully decoded reference screenshots
        run: |
          mkdir -p setup-v2-screenshots
          node <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1672, height: 941 } });
            await page.addInitScript(() => {
              window.sessionStorage.setItem('ai-exchange-learning-id', '6RSX');
            });
            await page.route('**/api/health', async (route) => {
              await route.fulfill({
                status: 200,
                contentType: 'application/json',
                body: JSON.stringify({ status: 'ok', learningDataConfigured: true }),
              });
            });

            for (const [width, height] of [[1672, 941], [1366, 768], [1280, 720]]) {
              await page.setViewportSize({ width, height });
              await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
              await page.getByRole('heading', { name: /会話するAI留学生をえらぼう/ }).waitFor();
              await page.getByRole('button', { name: /インドネシア Dimas Pratama/ }).click();
              await page.waitForFunction(() => {
                const images = Array.from(document.images);
                return images.length >= 21 && images.every((img) => img.complete && img.naturalWidth > 0);
              }, null, { timeout: 20000 });
              await page.evaluate(async () => {
                await Promise.all(Array.from(document.images).map((img) => img.decode().catch(() => undefined)));
              });
              await page.screenshot({ path: `setup-v2-screenshots/setup-${width}x${height}.png` });
            }

            await browser.close();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: setup-v2-screenshots
          path: setup-v2-screenshots/*.png
          if-no-files-found: error
