name: UI fixes one-shot
on:
  push:
    branches:
      - codex/ui-fixes-20260828
    paths:
      - .github/workflows/ui-fixes-one-shot.yml
permissions:
  contents: write
jobs:
  validate-and-finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/ui-fixes-20260828
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply audited fixes
        run: |
          python3 scripts/final-ui-fixes.py
          rm scripts/final-ui-fixes.py
          rm .github/workflows/ui-fixes-one-shot.yml
      - name: Full QA
        run: npm run qa
      - name: Production build
        run: npm run build
      - name: Commit validated fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: polish report, farewell and management dashboards"
          git push origin HEAD:codex/ui-fixes-20260828
