name: Temporary final research privacy and completeness
on:
  push:
    branches:
      - codex/research-final-privacy-completeness
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/research-final-privacy-completeness
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: python3 scripts/_apply_research_final_patch.py
      - run: npm ci
      - run: npm run qa
      - run: npm run build
      - run: rm -f scripts/_apply_research_final_patch.py .github/workflows/_tmp-research-final.yml
      - name: Commit verified final research safeguards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: preserve incomplete sessions and strengthen research anonymization"
          git push origin codex/research-final-privacy-completeness
