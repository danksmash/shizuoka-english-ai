name: Minji younger Azure voice preview - round 3

on:
  push:
    branches:
      - canary/minji-zofia-younger-voice-preview
    paths:
      - 'src/data/azureVoiceProfiles.ts'
      - '.github/workflows/minji-zofia-voice-preview.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  generate-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROJECT_ID: shizuoka-english-ai
      REGION: asia-northeast1
      SERVICE: shizuoka-english-ai-voice-preview
      OUT_DIR: voice-preview-artifacts
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          ref: canary/minji-zofia-younger-voice-preview
          fetch-depth: 0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/1075707511474/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-actions-deploy@shizuoka-english-ai.iam.gserviceaccount.com
          project_id: shizuoka-english-ai

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: shizuoka-english-ai

      - name: Build and generate Minji listening package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"

          RUNTIME_SA=$(gcloud run services describe shizuoka-english-ai \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format='value(spec.template.spec.serviceAccountName)')
          if [ -z "$RUNTIME_SA" ]; then
            PROJECT_NUMBER=$(gcloud projects describe "$PROJECT_ID" --format='value(projectNumber)')
            RUNTIME_SA="${PROJECT_NUMBER}-compute@developer.gserviceaccount.com"
          fi
          test -n "$RUNTIME_SA"

          cat > "$OUT_DIR/README.txt" <<'EOF'
          Minji Azure voice age-fit comparison - round 3
          ==============================================
          Production remains unchanged while these clips are reviewed.
          Zofia is already selected as en-GB-LibbyNeural and is not regenerated here.
          All clips use Azure default speaking rate (effective rate 1.00).

          Reference
            Minji current: en-US-EmmaMultilingualNeural

          Candidate A - explicit child voice
            Minji: en-US-AnaNeural

          Candidate B - youthful female comparison
            Minji: en-US-AshleyNeural

          Candidate C - youthful female comparison
            Minji: en-US-CoraNeural

          Suggested listening criteria:
          - closer in timbre/brightness to EmmaMultilingual than the round-2 Korean voices
          - younger impression without sounding implausibly small-child-like for a 21-year-old persona
          - friendly university-student quality
          - clear English for Grade 5-6 learners
          - natural questions and sentence endings
          EOF

          variants=(
            '00_reference|en-US-EmmaMultilingualNeural'
            '01_candidate_A_child|en-US-AnaNeural'
            '02_candidate_B|en-US-AshleyNeural'
            '03_candidate_C|en-US-CoraNeural'
          )

          generate_clip() {
            local base_url="$1"
            local text="$2"
            local output="$3"
            local payload headers status
            payload=$(python3 -c 'import json,sys; print(json.dumps({"text":sys.argv[1],"aiStudentId":"minji_korea","speakingRate":1.0}))' "$text")
            headers=$(mktemp)
            status=$(curl --silent --show-error --max-time 30 \
              -D "$headers" \
              -o "$output" \
              -w '%{http_code}' \
              -X POST "$base_url/api/tts" \
              -H 'Content-Type: application/json' \
              --data "$payload")
            test "$status" = '200'
            grep -qi 'content-type: audio/mpeg' "$headers"
            grep -qi 'x-tts-provider: azure-speech' "$headers"
            grep -qi 'x-tts-effective-rate: 1.00' "$headers"
            test "$(wc -c < "$output")" -gt 500
            rm -f "$headers"
          }

          for item in "${variants[@]}"; do
            IFS='|' read -r label minji_voice <<< "$item"
            mkdir -p "$OUT_DIR/$label/minji"

            BUILD_SHA="${GITHUB_SHA:0:12}"
            gcloud run deploy "$SERVICE" \
              --project "$PROJECT_ID" \
              --source . \
              --region "$REGION" \
              --allow-unauthenticated \
              --service-account "$RUNTIME_SA" \
              --min-instances 0 \
              --max-instances 1 \
              --concurrency 10 \
              --timeout 60 \
              --memory 512Mi \
              --set-env-vars AZURE_SPEECH_REGION=japaneast,APP_VERSION=voice-preview,APP_BUILD="$BUILD_SHA",AZURE_VOICE_PREVIEW_MODE=1,AZURE_MINJI_PREVIEW_VOICE="$minji_voice",AZURE_ZOFIA_PREVIEW_VOICE=en-GB-LibbyNeural \
              --set-secrets AZURE_SPEECH_KEY=AZURE_SPEECH_KEY:latest

            URL=$(gcloud run services describe "$SERVICE" \
              --project "$PROJECT_ID" \
              --region "$REGION" \
              --format='value(status.url)')
            test -n "$URL"

            generate_clip "$URL" "Hi! I'm Minji from South Korea. What's your name?" "$OUT_DIR/$label/minji/01_intro.mp3"
            generate_clip "$URL" "I like music and Korean food. What food do you like?" "$OUT_DIR/$label/minji/02_favorites.mp3"
            generate_clip "$URL" "That sounds interesting! Can you tell me more?" "$OUT_DIR/$label/minji/03_followup.mp3"
          done

          find "$OUT_DIR" -type f -name '*.mp3' -print0 | sort -z | xargs -0 sha256sum > "$OUT_DIR/sha256.txt"
          test "$(find "$OUT_DIR" -type f -name '*.mp3' | wc -l)" -eq 12
          echo 'MINJI_VOICE_PREVIEW_GENERATION_PASS clips=12'

      - name: Delete temporary preview service
        if: always()
        run: |
          gcloud run services delete "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --quiet || true

      - name: Upload listening package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minji-younger-voice-preview-round3
          path: voice-preview-artifacts/
          if-no-files-found: warn
          retention-days: 14
