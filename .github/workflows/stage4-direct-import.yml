name: Stage 4 direct persona import

on:
  push:
    branches:
      - codex/stage4-unified-persona-images
    paths:
      - stage4_personas_q85.tar.gz

permissions:
  contents: write

jobs:
  import-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: codex/stage4-unified-persona-images
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate archive paths and extract
        shell: bash
        run: |
          set -euo pipefail
          test -f stage4_personas_q85.tar.gz
          if tar -tzf stage4_personas_q85.tar.gz | grep -Eq '(^/|(^|/)\.\.(/|$))'; then
            echo 'Unsafe archive path detected.' >&2
            exit 1
          fi
          rm -rf /tmp/stage4-personas
          mkdir -p /tmp/stage4-personas
          tar -xzf stage4_personas_q85.tar.gz -C /tmp/stage4-personas

      - name: Verify and copy the 20 real WebP files
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/stage4-import.mjs <<'EOF'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import sharp from 'sharp';

          const expected = [
            'emma_usa.webp',
            'oliver_uk.webp',
            'liam_australia.webp',
            'minji_korea.webp',
            'pavel_belarus.webp',
            'lukas_germany.webp',
            'aina_malaysia.webp',
            'dimas_indonesia.webp',
            'bence_hungary.webp',
            'yuting_taiwan.webp',
            'zofia_poland.webp',
            'matas_lithuania.webp',
            'ananya_india.webp',
            'xinyi_china.webp',
            'linh_vietnam.webp',
            'rahul_bangladesh.webp',
            'nadeesha_srilanka.webp',
            'suman_nepal.webp',
            'amara_nigeria.webp',
            'andrei_romania.webp',
          ];

          function walk(dir) {
            const out = [];
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const p = path.join(dir, entry.name);
              if (entry.isDirectory()) out.push(...walk(p));
              else out.push(p);
            }
            return out;
          }

          const root = '/tmp/stage4-personas';
          const files = walk(root);
          const byBase = new Map();
          for (const p of files) {
            const base = path.basename(p);
            if (!byBase.has(base)) byBase.set(base, []);
            byBase.get(base).push(p);
          }

          fs.mkdirSync('src/assets/personas', { recursive: true });
          const hashes = new Set();
          let totalBytes = 0;

          for (const name of expected) {
            const matches = byBase.get(name) ?? [];
            if (matches.length !== 1) throw new Error(`${name}: expected exactly one file, found ${matches.length}`);
            const src = matches[0];
            const stat = fs.statSync(src);
            if (stat.size < 20_000) throw new Error(`${name}: suspiciously small (${stat.size} bytes)`);
            const meta = await sharp(src).metadata();
            if (meta.format !== 'webp') throw new Error(`${name}: expected WebP, got ${meta.format}`);
            if (meta.width !== 1120 || meta.height !== 1400) throw new Error(`${name}: expected 1120x1400, got ${meta.width}x${meta.height}`);
            const data = fs.readFileSync(src);
            const hash = crypto.createHash('sha256').update(data).digest('hex');
            if (hashes.has(hash)) throw new Error(`${name}: duplicate binary image detected`);
            hashes.add(hash);
            totalBytes += stat.size;
            fs.copyFileSync(src, path.join('src/assets/personas', name));
          }

          if (hashes.size !== 20) throw new Error(`expected 20 unique images, got ${hashes.size}`);
          if (totalBytes < 1_000_000 || totalBytes > 5_000_000) {
            throw new Error(`unexpected total image size: ${totalBytes} bytes`);
          }
          console.log(`Verified and copied 20 WebP files (${totalBytes} bytes total).`);
          EOF
          node /tmp/stage4-import.mjs

      - name: Write final image mapping
        shell: bash
        run: |
          cat > src/data/studentImages.ts <<'EOF'
          import emmaImg from '../assets/personas/emma_usa.webp';
          import oliverImg from '../assets/personas/oliver_uk.webp';
          import liamImg from '../assets/personas/liam_australia.webp';
          import minjiImg from '../assets/personas/minji_korea.webp';
          import pavelImg from '../assets/personas/pavel_belarus.webp';
          import lukasImg from '../assets/personas/lukas_germany.webp';
          import ainaImg from '../assets/personas/aina_malaysia.webp';
          import dimasImg from '../assets/personas/dimas_indonesia.webp';
          import benceImg from '../assets/personas/bence_hungary.webp';
          import yutingImg from '../assets/personas/yuting_taiwan.webp';
          import zofiaImg from '../assets/personas/zofia_poland.webp';
          import matasImg from '../assets/personas/matas_lithuania.webp';
          import ananyaImg from '../assets/personas/ananya_india.webp';
          import xinyiImg from '../assets/personas/xinyi_china.webp';
          import linhImg from '../assets/personas/linh_vietnam.webp';
          import rahulImg from '../assets/personas/rahul_bangladesh.webp';
          import nadeeshaImg from '../assets/personas/nadeesha_srilanka.webp';
          import sumanImg from '../assets/personas/suman_nepal.webp';
          import amaraImg from '../assets/personas/amara_nigeria.webp';
          import andreiImg from '../assets/personas/andrei_romania.webp';
          import chloeImg from '../assets/images/chloe_can.jpg';
          import aungImg from '../assets/images/aung_mya.jpg';

          export const STUDENT_AVATAR_MAP: Record<string, string> = {
            emma_usa: emmaImg,
            oliver_uk: oliverImg,
            liam_aus: liamImg,
            liam_australia: liamImg,
            minji_korea: minjiImg,
            pavel_belarus: pavelImg,
            lukas_germany: lukasImg,
            aina_malaysia: ainaImg,
            dimas_indonesia: dimasImg,
            bence_hun: benceImg,
            bence_hungary: benceImg,
            yuting_taiwan: yutingImg,
            zofia_pol: zofiaImg,
            zofia_poland: zofiaImg,
            matas_lithuania: matasImg,
            ananya_india: ananyaImg,
            xinyi_china: xinyiImg,
            linh_vie: linhImg,
            linh_vietnam: linhImg,
            rahul_ban: rahulImg,
            rahul_bangladesh: rahulImg,
            nadeesha_srilanka: nadeeshaImg,
            suman_nepal: sumanImg,
            amara_nigeria: amaraImg,
            andrei_romania: andreiImg,
            chloe_can: chloeImg,
            chloe_canada: chloeImg,
            aung_mya: aungImg,
            aung_myanmar: aungImg,
          };
          EOF

      - name: Strengthen permanent persona QA
        shell: bash
        run: |
          cat > scripts/qa-20-persona-setup.ts <<'EOF'
          import assert from 'node:assert/strict';
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          import sharp from 'sharp';
          import { AI_STUDENTS_MASTER_LIST, TARGET_20_AI_STUDENT_IDS } from '../src/data/curriculum';

          const setup = fs.readFileSync('src/components/SetupScreen.tsx', 'utf8');
          assert.ok(setup.includes('会話するAI留学生をえらぼう（全20名）'), 'setup heading must show 20 personas');
          assert.ok(setup.includes('TARGET_20_AI_STUDENT_IDS'), 'setup must derive visible personas from research target IDs');
          assert.equal(TARGET_20_AI_STUDENT_IDS.length, 20);
          for (const id of TARGET_20_AI_STUDENT_IDS) {
            assert.ok(AI_STUDENTS_MASTER_LIST.some((p) => p.id === id), `missing target persona ${id}`);
          }

          const avatarSource = fs.readFileSync('src/data/studentImages.ts', 'utf8');
          assert.equal(avatarSource.includes('.b64'), false, 'Base64 avatar assets must not be used');
          assert.equal(avatarSource.includes('atob('), false, 'Base64 decoding must not be used');
          assert.equal(avatarSource.includes('STUDENT_AVATAR_SPRITE_MAP'), false, 'sprite avatar mapping must not be used');

          const targetFiles = [
            'emma_usa.webp', 'oliver_uk.webp', 'liam_australia.webp', 'minji_korea.webp',
            'pavel_belarus.webp', 'lukas_germany.webp', 'aina_malaysia.webp', 'dimas_indonesia.webp',
            'bence_hungary.webp', 'yuting_taiwan.webp', 'zofia_poland.webp', 'matas_lithuania.webp',
            'ananya_india.webp', 'xinyi_china.webp', 'linh_vietnam.webp', 'rahul_bangladesh.webp',
            'nadeesha_srilanka.webp', 'suman_nepal.webp', 'amara_nigeria.webp', 'andrei_romania.webp',
          ];

          const forbiddenOldTargetImports = [
            '../assets/images/emma_usa.jpg', '../assets/images/oliver_uk.jpg', '../assets/images/liam_aus.jpg',
            '../assets/images/bence_hun.jpg', '../assets/images/zofia_pol.jpg', '../assets/images/rahul_ban.jpg',
            '../assets/images/linh_vie.jpg',
          ];
          for (const oldPath of forbiddenOldTargetImports) {
            assert.equal(avatarSource.includes(oldPath), false, `target persona must not use old JPG: ${oldPath}`);
          }

          const hashes = new Set<string>();
          let totalBytes = 0;
          for (const file of targetFiles) {
            const p = `src/assets/personas/${file}`;
            assert.ok(fs.existsSync(p), `missing unified persona image: ${file}`);
            assert.ok(avatarSource.includes(`../assets/personas/${file}`), `studentImages.ts must import ${file}`);
            const stat = fs.statSync(p);
            assert.ok(stat.size >= 20_000, `${file} is suspiciously small: ${stat.size} bytes`);
            const meta = await sharp(p).metadata();
            assert.equal(meta.format, 'webp', `${file} must be WebP`);
            assert.equal(meta.width, 1120, `${file} width must be 1120`);
            assert.equal(meta.height, 1400, `${file} height must be 1400`);
            const hash = crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');
            assert.equal(hashes.has(hash), false, `duplicate target image detected: ${file}`);
            hashes.add(hash);
            totalBytes += stat.size;
          }
          assert.equal(hashes.size, 20, 'all 20 target persona images must be unique');
          assert.ok(totalBytes >= 1_000_000 && totalBytes <= 5_000_000, `unexpected total persona size: ${totalBytes}`);

          for (const id of TARGET_20_AI_STUDENT_IDS) {
            assert.ok(avatarSource.includes(`${id}:`), `missing avatar mapping for target persona ${id}`);
          }

          console.log(`20-person unified WebP QA: PASS (${totalBytes} bytes, no Base64/sprite reconstruction)`);
          EOF

      - name: Full QA and production build
        run: |
          npm run qa
          npm run build

      - name: Remove one-shot inputs and workflow
        shell: bash
        run: |
          rm -f stage4_personas_q85.tar.gz
          rm -f .github/workflows/stage4-direct-import.yml

      - name: Commit verified final Stage 4 changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          echo 'Files to commit:'
          git diff --cached --name-status
          test -n "$(git diff --cached --name-only)"
          git commit -m 'feat: unify 20 persona images as WebP'
          git push origin HEAD:codex/stage4-unified-persona-images
