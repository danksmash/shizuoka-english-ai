name: Temporary Reflection goal3/600 patch

on:
  push:
    branches:
      - codex/reflection-goal3-600-fullprevious
    paths:
      - '.github/workflows/tmp-reflection-goal3-600-patch.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/reflection-goal3-600-fullprevious
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply canonical Reflection limits, layout and previous-text fit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          # Pupil UI
          p = Path('src/reflection/ReflectionApp.tsx')
          s = p.read_text()
          s = replace_once(s,
              "import React, { useCallback, useEffect, useMemo, useRef, useState } from 'react';",
              "import React, { useCallback, useEffect, useLayoutEffect, useMemo, useRef, useState } from 'react';",
              'React useLayoutEffect import')
          s = replace_once(s,
              "const draftKey = (token: string) => `my-english-growth-draft-four-point-${tokyoDate()}-${token.slice(0, 16)}`;",
              "const GOAL_MAX_CHARS = 150;\nconst REFLECTION_MAX_CHARS = 600;\nconst draftKey = (token: string) => `my-english-growth-draft-goal150-reflection600-${tokyoDate()}-${token.slice(0, 16)}`;\nconst limitCharacters = (value: string, max: number) => [...value].slice(0, max).join('');",
              'character limits and draft namespace')
          s = replace_once(s,
              "    todayGoal: typeof row.todayGoal === 'string' ? row.todayGoal : '',\n    goalRating: rating(row.goalRating),\n    communicationRating: rating(row.communicationRating),\n    reflectionText: typeof row.reflectionText === 'string' ? row.reflectionText : '',",
              "    todayGoal: typeof row.todayGoal === 'string' ? limitCharacters(row.todayGoal, GOAL_MAX_CHARS) : '',\n    goalRating: rating(row.goalRating),\n    communicationRating: rating(row.communicationRating),\n    reflectionText: typeof row.reflectionText === 'string' ? limitCharacters(row.reflectionText, REFLECTION_MAX_CHARS) : '',",
              'local draft limits')
          marker = "const formatDate = (value: string) => {\n  if (!value) return '';\n  const date = new Date(`${value}T00:00:00`);\n  return Number.isNaN(date.getTime()) ? value : date.toLocaleDateString('ja-JP', { month: 'numeric', day: 'numeric', weekday: 'short' });\n};"
          addition = marker + "\n\nfunction AutoFitPreviousReflection({ text }: { text: string }) {\n  const textRef = useRef<HTMLParagraphElement>(null);\n  const fitText = useCallback(() => {\n    const element = textRef.current;\n    if (!element) return;\n    element.style.removeProperty('font-size');\n    element.style.removeProperty('line-height');\n    const computed = window.getComputedStyle(element);\n    const maxFontSize = Number.parseFloat(computed.fontSize) || 16;\n    const lineHeight = Number.parseFloat(computed.lineHeight);\n    const lineHeightRatio = Number.isFinite(lineHeight) && lineHeight > 0 ? lineHeight / maxFontSize : 1.55;\n    const apply = (fontSize: number) => {\n      element.style.setProperty('font-size', `${fontSize}px`, 'important');\n      element.style.setProperty('line-height', String(lineHeightRatio), 'important');\n      return element.scrollHeight <= element.clientHeight + 1;\n    };\n    if (apply(maxFontSize)) return;\n    let low = 9;\n    let high = maxFontSize;\n    let best = low;\n    apply(low);\n    for (let index = 0; index < 12; index += 1) {\n      const middle = (low + high) / 2;\n      if (apply(middle)) { best = middle; low = middle; }\n      else high = middle;\n    }\n    apply(best);\n  }, [text]);\n\n  useLayoutEffect(() => {\n    const element = textRef.current;\n    if (!element) return;\n    let frame = window.requestAnimationFrame(fitText);\n    const observer = new ResizeObserver(() => {\n      window.cancelAnimationFrame(frame);\n      frame = window.requestAnimationFrame(fitText);\n    });\n    observer.observe(element.parentElement || element);\n    return () => { window.cancelAnimationFrame(frame); observer.disconnect(); };\n  }, [fitText]);\n\n  return <p ref={textRef} className=\"meg-previous-summary\" data-auto-fit=\"true\">{text}</p>;\n}"
          s = replace_once(s, marker, addition, 'auto-fit previous component')
          s = replace_once(s,
              "  const previous = bootstrap.previous;\n  const previousFull = displayReflectionText(previous);\n  const previousSummary = previousFull.length > 300 ? `${previousFull.slice(0, 300)}…` : previousFull;\n  const previousChars = [...previousSummary.replace(/…$/, '')].length;",
              "  const previous = bootstrap.previous;\n  const previousFull = displayReflectionText(previous);\n  const previousChars = [...previousFull].length;",
              'full previous reflection')
          s = replace_once(s,
              "            {previousSummary ? <p className=\"meg-previous-summary\">{previousSummary}</p> : <p className=\"meg-muted\">前回の振り返りはまだありません。</p>}\n            {previousSummary && <div className=\"meg-field-count\">{previousChars} / 300</div>}",
              "            {previousFull ? <AutoFitPreviousReflection text={previousFull} /> : <p className=\"meg-muted\">前回の振り返りはまだありません。</p>}\n            {previousFull && <div className=\"meg-field-count\">{previousChars} / {REFLECTION_MAX_CHARS}</div>}",
              'previous reflection JSX')
          s = replace_once(s,
              "          <textarea value={draft.todayGoal} onChange={(e) => setDraft((current) => ({ ...current, todayGoal: e.target.value.slice(0, 1000) }))} onBlur={() => void flushGoalAutosave()} placeholder=\"前回の振り返りも思い出して、今日のめあてを自分の言葉で書きましょう。\" />\n          <div className=\"meg-field-count\">{goalChars} / 300</div>",
              "          <div className=\"meg-goal-input\">\n            <textarea rows={3} maxLength={GOAL_MAX_CHARS} value={draft.todayGoal} onChange={(e) => setDraft((current) => ({ ...current, todayGoal: limitCharacters(e.target.value, GOAL_MAX_CHARS) }))} onBlur={() => void flushGoalAutosave()} placeholder=\"前回の振り返りも思い出して、今日のめあてを自分の言葉で書きましょう。\" />\n            <div className=\"meg-field-count\">{goalChars} / {GOAL_MAX_CHARS}</div>\n          </div>",
              'three-line 150-char goal')
          s = replace_once(s,
              "            <textarea value={draft.reflectionText} onChange={(e) => setDraft((current) => ({ ...current, reflectionText: e.target.value.slice(0, 12000) }))} placeholder=\"今日の学習を振り返って、できたこと、わかったこと、つたえられたこと、聞けたこと、学び方を工夫したこと、考えていたこと、くふうしたこと、気づいたこと、次にがんばりたいことなどから、自分が大切だと思うことを書きましょう。\" />\n            <div className=\"meg-field-count\">{reflectionChars} / 300</div>",
              "            <textarea maxLength={REFLECTION_MAX_CHARS} value={draft.reflectionText} onChange={(e) => setDraft((current) => ({ ...current, reflectionText: limitCharacters(e.target.value, REFLECTION_MAX_CHARS) }))} placeholder=\"今日の学習を振り返って、できたこと、わかったこと、つたえられたこと、聞けたこと、学び方を工夫したこと、考えていたこと、くふうしたこと、気づいたこと、次にがんばりたいことなどから、自分が大切だと思うことを書きましょう。\" />\n            <div className=\"meg-field-count\">{reflectionChars} / {REFLECTION_MAX_CHARS}</div>",
              '600-char reflection')
          p.write_text(s)

          # CSS: goal has exactly three input rows; right total height remains fixed and reflection absorbs the added two rows.
          p = Path('src/reflection/reflection-b.css')
          s = p.read_text()
          s = replace_once(s,
              '.meg-entry-right{grid-template-rows:minmax(100px,.4fr) auto minmax(235px,1.4fr)}',
              '.meg-entry-right{grid-template-rows:auto auto minmax(0,1fr)}',
              'right row sizing')
          s = replace_once(s,
              'overflow:auto;margin:0!important;padding:0!important;border:0!important;background:transparent!important;color:#17233d!important;font-size:clamp(16.5px,1.08vw,18.5px)!important;',
              'overflow:hidden;margin:0!important;padding:0!important;border:0!important;background:transparent!important;color:#17233d!important;font-size:clamp(16.5px,1.08vw,18.5px)!important;',
              'previous overflow')
          old_goal = '.meg-entry-goal textarea{flex:1;min-height:0;width:100%;box-sizing:border-box;resize:none;border:1px solid #cbd3de;border-radius:12px;background:#fff;color:#17233d;outline:none;padding:10px 14px;font:inherit;font-size:clamp(16.5px,1.08vw,18.5px);font-weight:500;line-height:1.65}\n.meg-entry-goal textarea:focus{border-color:#60a6ef;box-shadow:0 0 0 3px rgba(49,136,231,.12)}'
          new_goal = '.meg-goal-input{flex:none;display:flex;flex-direction:column;border:1px solid #cbd3de;border-radius:12px;background:#fff;overflow:hidden}\n.meg-entry-goal textarea{display:block;width:100%;box-sizing:border-box;resize:none;border:0;background:#fff;color:#17233d;outline:none;padding:10px 14px 4px;font:inherit;font-size:clamp(16.5px,1.08vw,18.5px);font-weight:500;line-height:1.65}\n.meg-entry-goal textarea:focus{box-shadow:inset 0 0 0 2px #60a6ef}\n.meg-goal-input .meg-field-count{padding:0 9px 6px;margin-top:0}'
          s = replace_once(s, old_goal, new_goal, 'goal input wrapper')
          s = replace_once(s,
              '.meg-entry-goal{padding:8px 10px 6px;background:linear-gradient(180deg,#e9fae8 0 49px,#fff 49px)}.meg-entry-goal .meg-section-title{padding-bottom:6px}.meg-entry-goal textarea{font-size:16px;padding:8px 10px}',
              '.meg-entry-goal{padding:8px 10px 6px;background:linear-gradient(180deg,#e9fae8 0 49px,#fff 49px)}.meg-entry-goal .meg-section-title{padding-bottom:6px}.meg-entry-goal textarea{font-size:16px;padding:8px 10px 3px}.meg-goal-input .meg-field-count{padding-bottom:5px}',
              'compact goal')
          s = replace_once(s,
              '.meg-entry-previous .meg-previous-summary{font-size:16px!important;line-height:1.55!important}',
              '.meg-entry-previous .meg-previous-summary{font-size:16px!important;line-height:1.55!important;overflow:hidden!important}',
              'compact previous overflow')
          p.write_text(s)

          # Server-enforced limits, counted as Unicode characters.
          p = Path('src/server/reflectionPersistence.ts')
          s = p.read_text()
          s = replace_once(s,
              "const DEVICE_COLLECTION = 'reflection_devices';\nconst REFLECTION_COLLECTION = 'lesson_reflections';",
              "const DEVICE_COLLECTION = 'reflection_devices';\nconst REFLECTION_COLLECTION = 'lesson_reflections';\nconst GOAL_MAX_CHARS = 150;\nconst REFLECTION_MAX_CHARS = 600;",
              'server limit constants')
          s = replace_once(s,
              "return typeof value === 'string' ? value.replace(/\\r\\n/g, '\\n').trim().slice(0, maxLength) : '';",
              "return typeof value === 'string' ? [...value.replace(/\\r\\n/g, '\\n').trim()].slice(0, maxLength).join('') : '';",
              'Unicode character limit')
          s = s.replace('cleanText(row.reflectionText, 12000)', 'cleanText(row.reflectionText, REFLECTION_MAX_CHARS)')
          s = s.replace('cleanText(row.todayGoal, 1000)', 'cleanText(row.todayGoal, GOAL_MAX_CHARS)')
          s = s.replace("cleanText(input.reflectionText, 12000)", 'cleanText(input.reflectionText, REFLECTION_MAX_CHARS)')
          s = s.replace('cleanText(input.todayGoal, 1000)', 'cleanText(input.todayGoal, GOAL_MAX_CHARS)')
          if '12000' in s or 'cleanText(row.todayGoal, 1000)' in s or 'cleanText(input.todayGoal, 1000)' in s:
              raise SystemExit('obsolete Reflection character limits remain in persistence')
          p.write_text(s)

          # Static QA guards.
          p = Path('scripts/qa-reflection-module.ts')
          s = p.read_text()
          s = replace_once(s,
              "requireText(css, 'grid-template-rows:minmax(100px,.4fr) auto minmax(235px,1.4fr)', 'right goal/reflection height rebalance');",
              "requireText(css, 'grid-template-rows:auto auto minmax(0,1fr)', 'three-line goal with reflection absorbing remaining height');",
              'right layout QA')
          s = replace_once(s,
              "requireText(css, '.meg-entry-previous .meg-previous-summary{font-size:16px!important', 'short-height previous text floor');",
              "requireText(css, '.meg-entry-previous .meg-previous-summary{font-size:16px!important;line-height:1.55!important;overflow:hidden!important}', 'short-height previous no-scroll auto-fit base');",
              'previous QA')
          anchor = "requireText(reflection, 'my-english-growth-draft-four-point-', 'new local-draft namespace');"
          replacement = "requireText(reflection, 'my-english-growth-draft-goal150-reflection600-', 'new local-draft namespace');\nrequireText(reflection, 'const GOAL_MAX_CHARS = 150', 'goal 150-character limit');\nrequireText(reflection, 'const REFLECTION_MAX_CHARS = 600', 'reflection 600-character limit');\nrequireText(reflection, 'rows={3}', 'three visible goal rows');\nrequireText(reflection, 'maxLength={GOAL_MAX_CHARS}', 'goal browser max length');\nrequireText(reflection, 'maxLength={REFLECTION_MAX_CHARS}', 'reflection browser max length');\nrequireText(reflection, 'AutoFitPreviousReflection', 'previous reflection auto-fit');\nrequireText(reflection, 'data-auto-fit=\"true\"', 'previous reflection auto-fit marker');\nforbidText(reflection, 'previousSummary', 'truncated previous reflection');\nforbidText(reflection, 'slice(0, 1000)', 'obsolete goal client limit');\nforbidText(reflection, 'slice(0, 12000)', 'obsolete reflection client limit');"
          s = replace_once(s, anchor, replacement, 'character-limit QA')
          anchor2 = "requireText(persistence, 'parsed >= 1 && parsed <= 4', 'server four-point validation');"
          replacement2 = anchor2 + "\nrequireText(persistence, 'const GOAL_MAX_CHARS = 150', 'server goal limit');\nrequireText(persistence, 'const REFLECTION_MAX_CHARS = 600', 'server reflection limit');\nrequireText(persistence, 'cleanText(row.todayGoal, GOAL_MAX_CHARS)', 'stored goal normalization');\nrequireText(persistence, 'cleanText(row.reflectionText, REFLECTION_MAX_CHARS)', 'stored reflection normalization');"
          s = replace_once(s, anchor2, replacement2, 'server limit QA')
          p.write_text(s)

          # Rendered QA: max-length previous text must fit with no internal scroll; goal must expose 3 lines and match reflection font size.
          p = Path('scripts/qa-reflection-visual.mjs')
          s = p.read_text()
          old_prev = "const previousText = '前回は、相手の話を聞いてから、自分の考えをつけたして話すことができました。次は、もっと質問をして会話を続けたいです。\\n\\n特に、相手が言ったことについて「それはどうして？」とたずねることで、話が広がることがわかりました。これからも、相手の話に興味をもって、もっといろいろ質問してみたいです。';"
          new_prev = "const previousSeed = '前回は相手の話をよく聞き、自分の考えを伝え、質問を続けながら学び方も工夫しました。次はもっと相手に合わせて話したいです。';\nconst previousText = previousSeed.repeat(20).slice(0, 600);"
          s = replace_once(s, old_prev, new_prev, '600-char previous fixture')
          s = replace_once(s,
              "return { x:r.x, y:r.y, width:r.width, height:r.height, bottom:r.bottom, right:r.right, centerX:r.x + r.width / 2, centerY:r.y + r.height / 2, fontSize:parseFloat(s.fontSize), background:s.backgroundImage, borderRadius:s.borderRadius };",
              "return { x:r.x, y:r.y, width:r.width, height:r.height, bottom:r.bottom, right:r.right, centerX:r.x + r.width / 2, centerY:r.y + r.height / 2, fontSize:parseFloat(s.fontSize), lineHeight:parseFloat(s.lineHeight), paddingTop:parseFloat(s.paddingTop), paddingBottom:parseFloat(s.paddingBottom), overflowY:s.overflowY, scrollHeight:el.scrollHeight, clientHeight:el.clientHeight, text:(el.textContent || '').trim(), background:s.backgroundImage, borderRadius:s.borderRadius };",
              'visual metric details')
          s = replace_once(s,
              "      goal: rect('.meg-entry-goal'),\n      ratings: rect('.meg-entry-ratings'),",
              "      goal: rect('.meg-entry-goal'),\n      goalInput: rect('.meg-goal-input'),\n      goalCount: rect('.meg-goal-input .meg-field-count'),\n      ratings: rect('.meg-entry-ratings'),",
              'goal visual metrics')
          s = replace_once(s,
              "      reflectionText: rect('.meg-main-reflection textarea'),",
              "      reflectionText: rect('.meg-main-reflection textarea'),\n      reflectionCount: rect('.meg-main-reflection .meg-field-count'),",
              'reflection count metrics')
          s = replace_once(s,
              "  assert(metrics.reflection.height >= 180, `${width}x${height} reflection writing card too short`);",
              "  assert(metrics.reflection.height >= 145, `${width}x${height} reflection writing card too short after transferring two lines to goal`);\n  assert(metrics.previousText.text.length === 600, `${width}x${height} previous reflection must render all 600 characters`);\n  assert(metrics.previousText.scrollHeight <= metrics.previousText.clientHeight + 1, `${width}x${height} previous reflection internally scrolls`);\n  assert(metrics.previousText.overflowY === 'hidden', `${width}x${height} previous reflection overflow must be hidden`);\n  const goalContentHeight = metrics.goalText.clientHeight - metrics.goalText.paddingTop - metrics.goalText.paddingBottom;\n  assert(goalContentHeight + 1 >= metrics.goalText.lineHeight * 3, `${width}x${height} goal does not expose three full writing lines`);\n  near(metrics.goalText.fontSize, metrics.reflectionText.fontSize, .2, `${width}x${height} goal/reflection writing font size`);\n  assert(metrics.goalCount.text.endsWith('/ 150'), `${width}x${height} goal counter is not / 150: ${metrics.goalCount.text}`);\n  assert(metrics.reflectionCount.text.endsWith('/ 600'), `${width}x${height} reflection counter is not / 600: ${metrics.reflectionCount.text}`);",
              'visual goal/previous assertions')
          s = replace_once(s,
              "  assert(metrics.previousText.fontSize >= bodyFloor, `${width}x${height} previous text too small: ${metrics.previousText.fontSize}`);",
              "  assert(metrics.previousText.fontSize >= 9, `${width}x${height} auto-fit previous text fell below 9px: ${metrics.previousText.fontSize}`);\n  assert(metrics.previousText.fontSize <= bodyFloor + .5, `${width}x${height} previous auto-fit exceeded base size: ${metrics.previousText.fontSize}`);",
              'previous font-size visual QA')
          s = replace_once(s,
              "    fonts: { brand: metrics.brand.fontSize, previous: metrics.previousText.fontSize, goal: metrics.goalText.fontSize, reflection: metrics.reflectionText.fontSize, heading: metrics.sectionHeading.fontSize, rating: metrics.ratingLabel.fontSize, hint: metrics.hintText.fontSize, submit: metrics.submit.fontSize },",
              "    goalRows: Number(((metrics.goalText.clientHeight - metrics.goalText.paddingTop - metrics.goalText.paddingBottom) / metrics.goalText.lineHeight).toFixed(2)),\n    previousFit: { chars: metrics.previousText.text.length, fontSize: Number(metrics.previousText.fontSize.toFixed(2)), scrollHeight: metrics.previousText.scrollHeight, clientHeight: metrics.previousText.clientHeight },\n    fonts: { brand: metrics.brand.fontSize, previous: metrics.previousText.fontSize, goal: metrics.goalText.fontSize, reflection: metrics.reflectionText.fontSize, heading: metrics.sectionHeading.fontSize, rating: metrics.ratingLabel.fontSize, hint: metrics.hintText.fontSize, submit: metrics.submit.fontSize },",
              'visual log details')
          s = replace_once(s,
              "console.log('[qa:reflection-visual] PASS: rendered Chromebook layout preserves the approved B design, nine hints, and four-point scale labels aligned above rating numbers 1 and 4.');",
              "console.log('[qa:reflection-visual] PASS: goal shows three lines at the approved writing size, reflection absorbs the two-line transfer, and the full 600-character previous reflection auto-fits with no scroll.');",
              'visual success message')
          p.write_text(s)
          PY

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify Reflection module, types and production build
        run: |
          npm run qa:reflection
          npm run lint
          npm run build

      - name: Install Playwright and verify rendered Chromebook layouts
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
          nohup npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/reflection-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/reflection/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/qa-reflection-visual.mjs

      - name: Commit verified patch to branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/reflection/ReflectionApp.tsx src/reflection/reflection-b.css src/server/reflectionPersistence.ts scripts/qa-reflection-module.ts scripts/qa-reflection-visual.mjs
          git diff --cached --quiet && { echo 'No patch changes produced'; exit 1; }
          git commit -m 'fix: set Reflection goal to 3 lines and 150 chars'
          git push origin HEAD:codex/reflection-goal3-600-fullprevious
