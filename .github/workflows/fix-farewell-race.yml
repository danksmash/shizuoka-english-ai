name: One-shot farewell race hotfix

on:
  push:
    paths:
      - '.github/workflows/fix-farewell-race.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Patch dialogue shutdown race
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/App.tsx')
          s = path.read_text()

          def replace_once(old, new, label):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              s = s.replace(old, new, 1)

          replace_once(
              "  const speechRateRef = useRef<number>(speechRate);\n  speechRateRef.current = speechRate;\n",
              "  const speechRateRef = useRef<number>(speechRate);\n  speechRateRef.current = speechRate;\n\n  // A dialogue may finish while an AI request is still in flight.\n  // Keep an imperative active flag and AbortController so a late response can never\n  // append or speak after the farewell sequence has started.\n  const dialogueActiveRef = useRef<boolean>(false);\n  const chatAbortControllerRef = useRef<AbortController | null>(null);\n",
              'refs'
          )

          replace_once(
              "  const handleStartDialogue = (newProfile: StudentProfile) => {\n    setProfile(newProfile);",
              "  const handleStartDialogue = (newProfile: StudentProfile) => {\n    chatAbortControllerRef.current?.abort();\n    chatAbortControllerRef.current = null;\n    dialogueActiveRef.current = true;\n    setProfile(newProfile);",
              'start dialogue activation'
          )

          replace_once(
              "    setTimeout(() => {\n      if (soundEnabledRef.current) {\n        setIsSpeaking(true);",
              "    setTimeout(() => {\n      if (dialogueActiveRef.current && soundEnabledRef.current) {\n        setIsSpeaking(true);",
              'starter speech guard'
          )

          replace_once(
              "    if (phase !== 'dialogue' || remainingSeconds <= 0 || !text.trim() || isAiResponding) {",
              "    if (!dialogueActiveRef.current || phase !== 'dialogue' || remainingSeconds <= 0 || !text.trim() || isAiResponding) {",
              'send guard'
          )

          replace_once(
              "    setIsAiResponding(true);\n    setMood('thinking');\n\n    try {",
              "    setIsAiResponding(true);\n    setMood('thinking');\n\n    const controller = new AbortController();\n    chatAbortControllerRef.current = controller;\n\n    try {",
              'controller creation'
          )

          replace_once(
              "        method: 'POST',\n        headers: { 'Content-Type': 'application/json' },\n        body: JSON.stringify({\n          message: trimmed,",
              "        method: 'POST',\n        headers: { 'Content-Type': 'application/json' },\n        signal: controller.signal,\n        body: JSON.stringify({\n          message: trimmed,",
              'chat fetch signal'
          )

          replace_once(
              "      const resData = await response.json();\n      if (resData.success && resData.data) {",
              "      const resData = await response.json();\n\n      // The timer/end button may have closed the dialogue while fetch was pending.\n      // In that case the response is stale and must never reach history or TTS.\n      if (\n        !dialogueActiveRef.current ||\n        controller.signal.aborted ||\n        chatAbortControllerRef.current !== controller\n      ) {\n        return;\n      }\n\n      if (resData.success && resData.data) {",
              'late response guard'
          )

          replace_once(
              "    } catch (e) {\n      console.error('AI backend unavailable; no conversation fallback will be generated:', e);\n      setMood('listening');\n      setMicHintMessage('AI留学生に接続できませんでした。もう一度送ってみてね。');\n      setTimeout(() => setMicHintMessage(''), 5000);\n    } finally {\n      setIsAiResponding(false);\n    }",
              "    } catch (e) {\n      const wasAborted = (e as { name?: string })?.name === 'AbortError' || controller.signal.aborted;\n      if (!wasAborted && dialogueActiveRef.current) {\n        console.error('AI backend unavailable; no conversation fallback will be generated:', e);\n        setMood('listening');\n        setMicHintMessage('AI留学生に接続できませんでした。もう一度送ってみてね。');\n        setTimeout(() => setMicHintMessage(''), 5000);\n      }\n    } finally {\n      if (chatAbortControllerRef.current === controller) {\n        chatAbortControllerRef.current = null;\n      }\n      if (dialogueActiveRef.current) {\n        setIsAiResponding(false);\n      }\n    }",
              'abort-aware catch/finally'
          )

          replace_once(
              "  const handleFinishDialogue = async () => {\n    if (phase !== 'dialogue') return;\n    stopSpeaking();",
              "  const handleFinishDialogue = async () => {\n    if (phase !== 'dialogue' || !dialogueActiveRef.current) return;\n\n    // Close the conversation synchronously before any farewell UI/audio starts.\n    // This prevents a late /api/chat response from racing the farewell message.\n    dialogueActiveRef.current = false;\n    chatAbortControllerRef.current?.abort();\n    chatAbortControllerRef.current = null;\n    setIsAiResponding(false);\n    stopSpeaking();",
              'finish shutdown'
          )

          replace_once(
              "  const handleRestart = () => {\n    stopSpeaking();",
              "  const handleRestart = () => {\n    dialogueActiveRef.current = false;\n    chatAbortControllerRef.current?.abort();\n    chatAbortControllerRef.current = null;\n    stopSpeaking();",
              'restart cleanup'
          )

          path.write_text(s)
          PY

      - name: Verify race guards
        shell: bash
        run: |
          grep -q "dialogueActiveRef.current = false" src/App.tsx
          grep -q "chatAbortControllerRef.current?.abort()" src/App.tsx
          grep -q "controller.signal.aborted" src/App.tsx
          grep -q "signal: controller.signal" src/App.tsx

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Dialogue QA
        run: npm run qa:dialogue --if-present

      - name: Build
        run: npm run build

      - name: Commit hotfix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git commit -m "Prevent late AI speech after dialogue ends"
          git push
