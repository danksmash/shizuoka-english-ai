name: Stage 2 contract completion

on:
  push:
    branches:
      - codex/stage2-data-contract-complete

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/stage2-data-contract-complete

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply stage 2 contract fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected 1 match, found {count}: {old!r}')
              p.write_text(text.replace(old, new, 1))

          replace_once('src/types.ts',
              "export interface AIStudentProfile {\n  id: string;",
              "export type AIStudentId =\n  | 'emma_usa'\n  | 'oliver_uk'\n  | 'liam_australia'\n  | 'chloe_canada'\n  | 'bence_hungary'\n  | 'zofia_poland'\n  | 'rahul_bangladesh'\n  | 'linh_vietnam'\n  | 'aung_myanmar';\n\nexport type DialogueDurationMinutes = 1 | 2 | 3 | 5;\n\nexport interface AIStudentProfile {\n  id: AIStudentId;")
          replace_once('src/types.ts',
              "  selectedDurationMinutes: number;\n  selectedTopic: DialogueTopic;\n  selectedAiStudentId: string;",
              "  selectedDurationMinutes: DialogueDurationMinutes;\n  selectedTopic: DialogueTopic;\n  selectedAiStudentId: AIStudentId;")

          replace_once('src/dataContract.ts',
              "import { ChatMessage, DialogueTopic, VisualVocabularyItem } from './types';\nimport { maskHighRiskPII } from './utils/security';",
              "import { AIStudentId, ChatMessage, DialogueDurationMinutes, DialogueTopic, VisualVocabularyItem } from './types';\nimport { maskMessagesForExternalUse } from './utils/privacy';")
          replace_once('src/dataContract.ts',
              "] as const;\n\nexport type AIStudentId = (typeof AI_STUDENT_IDS)[number];",
              "] as const satisfies readonly AIStudentId[];")
          replace_once('src/dataContract.ts',
              "export const DIALOGUE_DURATIONS_MINUTES = [1, 2, 3, 5] as const;\nexport type DialogueDurationMinutes = (typeof DIALOGUE_DURATIONS_MINUTES)[number];",
              "export const DIALOGUE_DURATIONS_MINUTES = [1, 2, 3, 5] as const satisfies readonly DialogueDurationMinutes[];")
          old_storage = "export function maskHistoryForStorage(history: ChatMessage[]): ChatMessage[] {\n  return history.map((message) => ({\n    ...message,\n    englishText: maskHighRiskPII(message.englishText).maskedText,\n    japaneseText: message.japaneseText ? maskHighRiskPII(message.japaneseText).maskedText : message.japaneseText,\n  }));\n}"
          new_storage = "export function maskHistoryForStorage(history: ChatMessage[]): ChatMessage[] {\n  return maskMessagesForExternalUse(history);\n}"
          replace_once('src/dataContract.ts', old_storage, new_storage)

          replace_once('src/components/FeedbackScreen.tsx',
              "import { getJapaneseTranslationForMessage } from '../utils/translation';\nimport { StudentAvatar } from './StudentAvatar';",
              "import { getJapaneseTranslationForMessage } from '../utils/translation';\nimport { safePlainTextForClipboard } from '../utils/privacy';\nimport { StudentAvatar } from './StudentAvatar';")
          replace_once('src/components/FeedbackScreen.tsx',
              ".writeText(fullText)",
              ".writeText(safePlainTextForClipboard(fullText))")

          replace_once('scripts/qa-data-contract.ts',
              "  validateSessionSaveInput,\n} from '../src/dataContract';",
              "  validateSessionSaveInput,\n  maskHistoryForStorage,\n} from '../src/dataContract';\nimport { safePlainTextForClipboard } from '../src/utils/privacy';")
          replace_once('scripts/qa-data-contract.ts',
              "assert.equal(badDuration.ok, false);\n\nconsole.log('DATA CONTRACT QA PASS');",
              "assert.equal(badDuration.ok, false);\n\nconst privateHistory = canonicalizeHistory([\n  { id: 'p', sender: 'child', englishText: 'My email is child@example.com and phone is 090-1234-5678.', timestamp: 1000 },\n]);\nconst maskedHistory = maskHistoryForStorage(privateHistory);\nassert.equal(maskedHistory[0].englishText.includes('child@example.com'), false);\nassert.equal(maskedHistory[0].englishText.includes('090-1234-5678'), false);\nconst copied = safePlainTextForClipboard('Email child@example.com phone 090-1234-5678');\nassert.equal(copied.includes('child@example.com'), false);\nassert.equal(copied.includes('090-1234-5678'), false);\n\nconsole.log('DATA CONTRACT QA PASS');")

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Full QA
        run: npm run qa

      - name: Production build
        run: npm run build

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/types.ts src/dataContract.ts src/components/FeedbackScreen.tsx scripts/qa-data-contract.ts
          git commit -m "refactor: complete canonical data contract and privacy paths"
          git push origin HEAD:codex/stage2-data-contract-complete
