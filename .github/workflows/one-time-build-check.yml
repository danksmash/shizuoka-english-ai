name: One-time production build check

on:
  push:
    paths:
      - '.github/workflows/one-time-build-check.yml'

permissions:
  contents: write

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

      - name: Remove one-time workflow after successful verification
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/one-time-build-check.yml
          git add .github/workflows/one-time-build-check.yml
          git diff --cached --check
          git commit -m "test: verify build after conversation fallback removal"
          git push
